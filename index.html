      localStorage.setItem('rm_changelog_seen', APP_VERSION);
      setTimeout(openChangelog, 300);
    }
  }catch(e){}
}

/* ===== Применение set-операции к переменной =====
   Унифицированная семантика — 3 оператора, поведение зависит от типа переменной.

   В JSON value может быть:
     • примитив / массив / объект      → op="set" (по умолчанию)
     • строка с {выражением}            → op="set" с вычислением
     • { op:"set"|"add"|"remove", value: X }

   Что делает каждый op (зависит от типа переменной):

   ┌──────────────┬────────────────────────┬──────────────────────────┬──────────────────────────┐
   │ Тип          │ set                    │ add                      │ remove                   │
   ├──────────────┼────────────────────────┼──────────────────────────┼──────────────────────────┤
   │ text         │ заменить               │ конкатенация             │ сброс к default          │
   │ number       │ заменить               │ сложение                 │ сброс к default          │
   │ bool         │ заменить               │ OR                       │ сброс к default          │
   │ enum single  │ заменить               │ (не имеет смысла, ignore)│ сброс к default          │
   │ array<T>     │ заменить целиком       │ объединить (push N)      │ убрать перечисленные     │
   │ map<K,V>     │ заменить целиком       │ merge (Object.assign)    │ удалить ключи            │
   └──────────────┴────────────────────────┴──────────────────────────┴──────────────────────────┘

   Для array/map value может быть как одиночным элементом (один ключ/значение),
   так и массивом/объектом (несколько за раз).

   Алиасы для совместимости со старыми JSON: clear/toggle/inc/dec/set_key/del_key. */
function applySetOp(varId, value){
  const vd = varDef(varId);
  const t = vd ? varDataType(vd) : 'text';
  const fmt = vd ? varFormat(vd) : 'single';

  // Нормализация: примитив/массив/объект без op → {op:'set', value}
  let op, opValue;
  if(value && typeof value === 'object' && !Array.isArray(value) && value.op){
    op = value.op;
    opValue = ('value' in value) ? value.value : undefined;
    // Алиасы → перевод в новую систему
    if(op==='clear'){
      if(fmt==='array') { VARS[varId] = []; return; }
      if(fmt==='map')   { VARS[varId] = {}; return; }
      // single: сбрасываем
      VARS[varId] = defaultValueFor(vd||{type:t,format:'single'}); return;
    }
    if(op==='toggle'){ VARS[varId] = !VARS[varId]; return; }
    if(op==='inc'){ VARS[varId] = (Number(VARS[varId])||0) + Number(opValue ?? 1); return; }
    if(op==='dec'){ VARS[varId] = (Number(VARS[varId])||0) - Number(opValue ?? 1); return; }
    if(op==='set_key'){
      if(!VARS[varId] || typeof VARS[varId]!=='object') VARS[varId] = {};
      VARS[varId][value.key] = resolveSetValue(opValue, t);
      return;
    }
    if(op==='del_key'){
      if(VARS[varId] && typeof VARS[varId]==='object') delete VARS[varId][value.key];
      return;
    }
  } else {
    op = 'set';
    opValue = value;
  }
  // Разрешаем строковые выражения и подстановки
  const resolved = resolveSetValue(opValue, t);

  // === ОПЕРАЦИЯ SET ===
  if(op==='set'){
    if(fmt==='array'){
      const raw = Array.isArray(resolved) ? resolved.slice() : (resolved==null||resolved==='' ? [] : [resolved]);
      // дедупликация (array как set)
      const seen = new Set(); const dedup = [];
      raw.forEach(x=>{ if(!seen.has(x)){ seen.add(x); dedup.push(x); } });
      VARS[varId] = dedup;
    } else if(fmt==='map'){
      VARS[varId] = (resolved && typeof resolved==='object' && !Array.isArray(resolved)) ? Object.assign({}, resolved) : {};
    } else {
      // single
      if(t==='bool') VARS[varId] = (resolved===true || resolved==='true');
      else if(t==='number') VARS[varId] = (resolved===''||resolved==null) ? '' : Number(resolved);
      else VARS[varId] = resolved;
    }
    return;
  }

  // === ОПЕРАЦИЯ ADD ===
  if(op==='add'){
    if(fmt==='array'){
      if(!Array.isArray(VARS[varId])) VARS[varId] = [];
      const items = Array.isArray(resolved) ? resolved : [resolved];
      // Array работает как set: дубликаты игнорируем
      items.forEach(it=>{
        if(it===undefined || it==='') return;
        if(VARS[varId].indexOf(it) < 0) VARS[varId].push(it);
      });
    } else if(fmt==='map'){
      if(!VARS[varId] || typeof VARS[varId]!=='object') VARS[varId] = {};
      if(resolved && typeof resolved==='object' && !Array.isArray(resolved)){
        Object.assign(VARS[varId], resolved);
      } else if(value.key !== undefined){
        // совместимость: { op:"add", key:K, value:V }
        VARS[varId][value.key] = resolved;
      }
    } else {
      // single
      if(t==='number'){
        VARS[varId] = (Number(VARS[varId])||0) + Number(resolved||0);
      } else if(t==='text'){
        VARS[varId] = String(VARS[varId]||'') + String(resolved||'');
      } else if(t==='bool'){
        VARS[varId] = !!VARS[varId] || (resolved===true || resolved==='true');
      } else if(t==='enum'){
        // add для enum single — нет смысла; игнор
      }
    }
    return;
  }

  // === ОПЕРАЦИЯ REMOVE ===
  if(op==='remove'){
    if(fmt==='array'){
      if(!Array.isArray(VARS[varId])) { VARS[varId] = []; return; }
      const items = Array.isArray(resolved) ? resolved : [resolved];
      items.forEach(it=>{
        const i = VARS[varId].indexOf(it);
        if(i>=0) VARS[varId].splice(i,1);
      });
    } else if(fmt==='map'){
      if(!VARS[varId] || typeof VARS[varId]!=='object') return;
      const keys = Array.isArray(resolved) ? resolved
                 : (resolved && typeof resolved==='object' && !Array.isArray(resolved)) ? Object.keys(resolved)
                 : [resolved];
      keys.forEach(k=>{ delete VARS[varId][k]; });
    } else {
      // single → сброс к default
      VARS[varId] = defaultValueFor(vd||{type:t,format:'single'});
    }
    return;
  }
}
/* Вычислить значение для set: если строка содержит {выражение} — рассчитать. */
function resolveSetValue(v, expectedType){
  if(typeof v === 'string' && v.indexOf('{')>=0){
    // подстановка с возможным выражением
    const interp = interpolate(v);
    // если ожидается число — попытаться
    if(expectedType==='number'){
      const n = parseFloat(interp);
      return isNaN(n) ? interp : n;
    }
    return interp;
  }
  return v;
}

/* ============================================================
   ПЕРЕМЕННЫЕ — РЕНДЕР В РЕЖИМЕ РАБОТЫ
============================================================ */
/* Заметки оператора на текущий разговор. Хранятся ТОЛЬКО в RAM (OPERATOR_NOTES),
   сбрасываются при resetVarsToDefaults (↺ С начала / end:true). */
let OPERATOR_NOTES = '';
function renderNotes(){
  const root = document.getElementById('notesBlock');
  if(!root) return;
  // Создаём textarea один раз — чтобы не сбрасывать фокус при каждом ререндере
  let ta = root.querySelector('textarea.op-notes');
  if(!ta){
    root.innerHTML = `
      <div class="op-notes-block">
        <div class="op-notes-head">
          <label>📝 Заметки <span style="color:var(--line)">(сессия)</span></label>
          <button class="op-notes-clear" title="Очистить">✕</button>
        </div>
        <textarea class="op-notes" placeholder="Имена, числа, договорённости…"></textarea>
      </div>`;
    ta = root.querySelector('textarea.op-notes');
    ta.value = OPERATOR_NOTES;
    ta.addEventListener('input', ()=>{ OPERATOR_NOTES = ta.value; });
    root.querySelector('.op-notes-clear').onclick = ()=>{
      if(!OPERATOR_NOTES.trim() || confirm('Очистить заметки?')){
        OPERATOR_NOTES = '';
        ta.value = '';
        ta.focus();
      }
    };
  } else if(ta.value !== OPERATOR_NOTES){
    // Если значение поменялось извне (например, сбросилось через reset/импорт) — обновим UI
    // и сразу пересчитаем высоту: программная смена value не вызывает input-событие.
    ta.value = OPERATOR_NOTES;
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  }
}
function renderVars(){
  const root = document.getElementById('vars');
  root.innerHTML = '';
  (DATA.variables||[]).forEach(v=>{
    if(v.hidden) return;
    const wrap = document.createElement('div');
    wrap.className = 'var-row';
    wrap.dataset.varId = v.id;
    if(v.showIf && !evalIf(v.showIf)) wrap.style.display = 'none';
    const lab = document.createElement('label');
    lab.innerHTML = escHTML(v.label||v.id)+' <span style="color:var(--line)">('+v.id+')</span>';
    wrap.appendChild(lab);
    wrap.appendChild(renderVarEditor(v));
    root.appendChild(wrap);
  });
}
/* Лёгкое обновление видимости переменных (без перерендера) — для случаев,
   когда нельзя терять фокус (пользователь печатает в одной из них). */
function refreshVarsVisibility(){
  const root = document.getElementById('vars');
  if(!root) return;
  (DATA.variables||[]).forEach(v=>{
    if(v.hidden) return;
    const row = root.querySelector('.var-row[data-var-id="'+CSS.escape(v.id)+'"]');
    if(!row) return;
    const show = !v.showIf || evalIf(v.showIf);
    row.style.display = show ? '' : 'none';
  });
}
function renderVarEditor(v, source){
  // source: 'left' | 'center' — откуда рендер. Обработчики передадут это в afterVarChange.
  source = source || 'left';
  const wrap = document.createElement('div');
  const fmt = varFormat(v);
  const t   = varDataType(v);
  const cur = VARS[v.id];
  const notify = ()=>afterVarChange({skipScreenRender:true, changedVar:v.id, source});

  if(fmt==='map'){
    wrap.appendChild(renderMapEditor(v, source));
    return wrap;
  }
  if(fmt==='array'){
    wrap.appendChild(renderArrayEditor(v, source));
    return wrap;
  }
  // single
  if(t==='bool'){
    const l = document.createElement('label'); l.className='bool-toggle';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.dataset.var=v.id;
    cb.checked = !!cur;
    const sp = document.createElement('span'); sp.textContent = cb.checked?'да':'нет';
    cb.onchange = ()=>{ VARS[v.id]=cb.checked; sp.textContent=cb.checked?'да':'нет'; notify(); };
    l.appendChild(cb); l.appendChild(sp);
    wrap.appendChild(l);
  } else if(t==='number'){
    const inp = document.createElement('input'); inp.type='number'; inp.dataset.var=v.id;
    inp.value = cur===undefined||cur===null?'':cur;
    inp.oninput = ()=>{ VARS[v.id]=inp.value===''?'':Number(inp.value); notify(); };
    wrap.appendChild(inp);
  } else if(t==='enum'){
    const sel = document.createElement('select'); sel.dataset.var=v.id;
    const opts = ['<option value="">— не выбрано —</option>']
      .concat(getEnumOptions(v.id).map(o=>`<option value="${escHTML(o)}" ${String(cur??'')===String(o)?'selected':''}>${escHTML(o)}</option>`));
    sel.innerHTML = opts.join('');
    sel.onchange = ()=>{ VARS[v.id] = sel.value; notify(); };
    wrap.appendChild(sel);
  } else { // text
    const inp = document.createElement('input'); inp.type='text'; inp.dataset.var=v.id;
    inp.value = cur ?? '';
    inp.oninput = ()=>{ VARS[v.id]=inp.value; notify(); };
    wrap.appendChild(inp);
  }
  return wrap;
}

/* Редактор array-переменной (мульти-список одного типа). */
function renderArrayEditor(v, source){
  source = source || 'left';
  const root = document.createElement('div'); root.className='map-block';
  const t = v.valueType || 'text';
  if(!Array.isArray(VARS[v.id])) VARS[v.id] = [];
  const arr = VARS[v.id];
  const notify = ()=>afterVarChange({skipScreenRender:true, changedVar:v.id, source});

  // Дедупликация при отображении (вдруг данные пришли с дублями из JSON)
  const dedupArr = ()=>{
    const seen = new Set(); const out = [];
    for(let i=0;i<arr.length;i++){
      const k = (t==='bool') ? String(!!arr[i]) : (arr[i]==null?'':String(arr[i]));
      if(!seen.has(k)){ seen.add(k); out.push(arr[i]); }
    }
    if(out.length !== arr.length){
      arr.length = 0;
      out.forEach(x=>arr.push(x));
    }
  };
  dedupArr();

  // Проверка: становится ли newVal дублем в позиции idx?
  const isDuplicate = (newVal, idx)=>{
    const k = (t==='bool') ? String(!!newVal) : (newVal==null?'':String(newVal));
    if(k==='') return false; // пустые не считаем дублями (промежуточный ввод)
    for(let i=0;i<arr.length;i++){
      if(i===idx) continue;
      const ki = (t==='bool') ? String(!!arr[i]) : (arr[i]==null?'':String(arr[i]));
      if(ki===k) return true;
    }
    return false;
  };

  arr.forEach((val, idx)=>{
    const row = document.createElement('div'); row.className='map-row';
    const grip = document.createElement('span'); grip.className='dnd-grip'; grip.textContent='⋮⋮'; grip.title='Перетащить';
    row.appendChild(grip);
    let inp;
    if(t==='bool'){
      // У bool-массива только 2 возможных значения. Если уже есть оба — дубликаты неизбежны → особый кейс:
      // используем select, чтобы пользователь не мог выбрать уже занятое.
      const cell = document.createElement('label'); cell.className='bool-cell';
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !!val;
      cb.onchange = ()=>{
        if(isDuplicate(cb.checked, idx)){
          cb.checked = !cb.checked; // откатить
          alert('Такое значение уже есть в списке.');
          return;
        }
        arr[idx]=cb.checked; notify();
      };
      cell.appendChild(cb); inp = cell;
    } else if(t==='number'){
      inp = document.createElement('input'); inp.type='number';
      inp.value = val===''?'':val;
      // На input обновляем без дедупа (промежуточный ввод), а на blur проверяем
      inp.oninput = ()=>{ arr[idx]=inp.value===''?'':Number(inp.value); notify(); };
      inp.onblur = ()=>{
        if(inp.value!=='' && isDuplicate(Number(inp.value), idx)){
          alert('Значение «'+inp.value+'» уже есть — строка удалена.');
          arr.splice(idx,1); afterVarChange({changedVar:v.id});
        }
      };
    } else if(t==='enum'){
      inp = document.createElement('select');
      // Дедупликация на уровне options: показываем все, но disabled те что уже выбраны (кроме текущей строки)
      const selectedElsewhere = new Set();
      arr.forEach((x,i)=>{ if(i!==idx && x!=='' && x!=null) selectedElsewhere.add(String(x)); });
      const opts = ['<option value="">— выбери —</option>']
        .concat(getEnumOptions(v.optionsFrom).map(o=>{
          const isSel = String(val??'')===String(o);
          const isUsed = selectedElsewhere.has(String(o));
          return `<option value="${escHTML(o)}" ${isSel?'selected':''} ${isUsed?'disabled':''}>${escHTML(o)}${isUsed?' (уже выбрано)':''}</option>`;
        }));
      inp.innerHTML = opts.join('');
      inp.onchange = ()=>{
        if(inp.value!=='' && isDuplicate(inp.value, idx)){
          // не должно происходить из-за disabled, но на всякий случай
          inp.value = val||''; alert('Такой вариант уже выбран.'); return;
        }
        arr[idx]=inp.value;
        afterVarChange({changedVar:v.id}); // полный рендер — чтобы пересчитать disabled у других строк
      };
    } else { // text
      inp = document.createElement('input'); inp.type='text';
      inp.value = val||'';
      inp.oninput = ()=>{ arr[idx]=inp.value; notify(); };
      inp.onblur = ()=>{
        if(inp.value!=='' && isDuplicate(inp.value, idx)){
          alert('Значение «'+inp.value+'» уже есть — строка удалена.');
          arr.splice(idx,1); afterVarChange({changedVar:v.id});
        }
      };
    }
    row.appendChild(inp);
    const del = document.createElement('button'); del.className='danger-btn'; del.textContent='✕';
    del.onclick = ()=>{ arr.splice(idx,1); afterVarChange({changedVar:v.id}); };
    row.appendChild(del);
    root.appendChild(row);
  });
  const itemRows = Array.from(root.children);
  itemRows.forEach((r,i)=>{ r.dataset.dndArrayItem = '1'; });

  const addRow = document.createElement('div'); addRow.className='map-row';
  const addBtn = document.createElement('button'); addBtn.className='secondary small-btn add-row';
  addBtn.textContent = '+ элемент';
  // Для enum: если все опции уже выбраны — disable кнопку
  if(t==='enum'){
    const all = getEnumOptions(v.optionsFrom).map(String);
    const used = new Set(arr.filter(x=>x!=='' && x!=null).map(String));
    const allUsed = all.length>0 && all.every(o=>used.has(o));
    if(allUsed){
      addBtn.disabled = true;
      addBtn.title = 'Все варианты уже выбраны';
      addBtn.textContent = '+ элемент (все варианты выбраны)';
    }
  }
  // Для bool: если уже 2 элемента (true и false) — disable
  if(t==='bool' && arr.length>=2){
    const has = new Set(arr.map(x=>!!x));
    if(has.size===2){
      addBtn.disabled = true;
      addBtn.title = 'true и false уже добавлены';
    }
  }
  addBtn.onclick = ()=>{
    let newVal;
    if(t==='bool'){
      const hasFalse = arr.some(x=>x===false);
      newVal = hasFalse ? true : false;
    } else {
      newVal = '';
    }
    arr.push(newVal);
    FOCUS_ARRAY_LAST = v.id;
    afterVarChange({changedVar:v.id});
  };
  addRow.appendChild(addBtn);
  root.appendChild(addRow);

  attachListDnD(root, {
    itemSelector: '.map-row[data-dnd-array-item="1"]',
    handleSelector: '.dnd-grip',
    getArr: ()=>arr,
    onReorder: ()=>{ afterVarChange({changedVar:v.id}); }
  });
  // Если только что добавили элемент в этот массив — сфокусировать последний ввод
  if(FOCUS_ARRAY_LAST === v.id){
    FOCUS_ARRAY_LAST = null;
    requestAnimationFrame(()=>{
      const itemRows = root.querySelectorAll('.map-row[data-dnd-array-item="1"]');
      const lastRow = itemRows[itemRows.length-1];
      if(!lastRow) return;
      const focusable = lastRow.querySelector('select, input[type=text], input[type=number], input[type=checkbox]');
      if(focusable){
        focusable.focus();
        // Для select — открыть dropdown через программный клик не получится в большинстве браузеров,
        // но фокус всё равно полезен. Для enum — оператор сразу видит выделенный select и может нажать Space/Enter.
        if(focusable.tagName === 'INPUT' && focusable.type==='text'){
          try{ focusable.select(); }catch(e){}
        }
        // Прокрутить к нему, если он за пределами viewport
        focusable.scrollIntoView({block:'nearest', behavior:'smooth'});
      }
    });
  }
  return root;
}
function renderMapEditor(v, source){
  source = source || 'left';
  const root = document.createElement('div'); root.className='map-block';
  const vt = v.valueType || 'text';
  const kt = v.keyType || 'text';
  if(!VARS[v.id] || typeof VARS[v.id]!=='object' || Array.isArray(VARS[v.id])) VARS[v.id]={};
  const obj = VARS[v.id];
  const notify = ()=>afterVarChange({skipScreenRender:true, changedVar:v.id, source});
  const notifyStruct = ()=>afterVarChange({changedVar:v.id}); // структурное (add/del key)

  const keysFromEnum = (kt==='enum');
  const fixedKeys = keysFromEnum || (v.keys && v.keys.length);
  const allKeys = keysFromEnum ? getMapKeys(v) : (fixedKeys ? v.keys : Object.keys(obj));

  allKeys.forEach(key=>{
    if(obj[key]===undefined) obj[key] = vt==='bool'?false:'';
    const row = document.createElement('div'); row.className='map-row';
    row.dataset.dndMapItem = !fixedKeys ? '1' : '';
    if(!fixedKeys){
      const grip = document.createElement('span'); grip.className='dnd-grip'; grip.textContent='⋮⋮'; grip.title='Перетащить';
      row.classList.add('map-row-4');
      row.appendChild(grip);
    } else {
      row.classList.add('map-row-3');
    }
    const kInp = document.createElement('input'); kInp.type='text'; kInp.value=key;
    if(fixedKeys){ kInp.disabled = true; }
    else kInp.onchange = ()=>{
      if(!kInp.value || (obj[kInp.value]!==undefined && kInp.value!==key)){ kInp.value=key; return; }
      obj[kInp.value]=obj[key]; delete obj[key]; notifyStruct();
    };
    row.appendChild(kInp);
    let valEl;
    if(vt==='bool'){
      const cell = document.createElement('label'); cell.className='bool-cell';
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!obj[key];
      cb.onchange = ()=>{ obj[key]=cb.checked; notify(); };
      cell.appendChild(cb); valEl = cell;
    } else if(vt==='number'){
      valEl = document.createElement('input'); valEl.type='number';
      valEl.value = obj[key]===''?'':obj[key];
      valEl.oninput = ()=>{ obj[key]=valEl.value===''?'':Number(valEl.value); notify(); };
    } else if(vt==='enum'){
      valEl = document.createElement('select');
      const opts = ['<option value="">— выбери —</option>']
        .concat(getEnumOptions(v.optionsFrom).map(o=>`<option value="${escHTML(o)}" ${String(obj[key]??'')===String(o)?'selected':''}>${escHTML(o)}</option>`));
      valEl.innerHTML = opts.join('');
      valEl.onchange = ()=>{ obj[key]=valEl.value; notify(); };
    } else {
      valEl = document.createElement('input'); valEl.type='text';
      valEl.value = obj[key]||'';
      valEl.oninput = ()=>{ obj[key]=valEl.value; notify(); };
    }
    row.appendChild(valEl);
    if(!fixedKeys){
      const del = document.createElement('button'); del.className='danger-btn'; del.textContent='✕';
      del.onclick = ()=>{ delete obj[key]; notifyStruct(); };
      row.appendChild(del);
    } else {
      const sp = document.createElement('span'); row.appendChild(sp);
    }
    root.appendChild(row);
  });
  if(!fixedKeys && kt==='text'){
    const addRow = document.createElement('div'); addRow.className='map-row';
    const addBtn = document.createElement('button'); addBtn.className='secondary small-btn add-row';
    addBtn.textContent = '+ ключ';
    addBtn.onclick = ()=>{
      let i=1; while(obj['ключ'+i]!==undefined) i++;
      obj['ключ'+i] = vt==='bool'?false:'';
      FOCUS_MAP_LAST = v.id;
      notifyStruct();
    };
    addRow.appendChild(addBtn);
    root.appendChild(addRow);
  }
  // Автофокус на только что добавленный ключ map
  if(FOCUS_MAP_LAST === v.id){
    FOCUS_MAP_LAST = null;
    requestAnimationFrame(()=>{
      const rows = root.querySelectorAll('.map-row[data-dnd-map-item="1"]');
      const lastRow = rows[rows.length-1];
      if(!lastRow) return;
      const keyInp = lastRow.querySelector('input[type=text]');
      if(keyInp){
        keyInp.focus(); try{ keyInp.select(); }catch(e){}
        keyInp.scrollIntoView({block:'nearest', behavior:'smooth'});
      }
    });
  }
  // DnD только для свободных text-ключей: переставляем ключи в объекте через пересоздание
  if(!fixedKeys){
    // Держим один и тот же массив ключей между getArr вызовами, чтобы splice его реально менял
    let keysBuf = Object.keys(obj);
    attachListDnD(root, {
      itemSelector: '.map-row[data-dnd-map-item="1"]',
      handleSelector: '.dnd-grip',
      getArr: ()=>keysBuf,
      onReorder: ()=>{
        const newObj = {};
        keysBuf.forEach(k=>{ if(obj.hasOwnProperty(k)) newObj[k] = obj[k]; });
        VARS[v.id] = newObj;
        afterVarChange({changedVar:v.id});
      }
    });
  }
  return root;
}
function exprMentionsVar(expr, varId){
  if(!expr || !varId) return false;
  const re = new RegExp('(?<![A-Za-z0-9_])'+escapeRegex(varId)+'(?![A-Za-z0-9_])');
  return re.test(String(expr));
}
function enumSourceDependsOnVar(sourceId, changedVar, visited){
  if(!sourceId || !changedVar) return false;
  visited = visited || new Set();
  if(visited.has(sourceId)) return false;
  visited.add(sourceId);
  const src = varDef(sourceId);
  if(!src) return false;
  if(Array.isArray(src.optionsFromIf)){
    for(const r of src.optionsFromIf){
      if(r && exprMentionsVar(r.if, changedVar)) return true;
      if(r && r.from && enumSourceDependsOnVar(r.from, changedVar, visited)) return true;
    }
  }
  if(src.optionsFrom && enumSourceDependsOnVar(src.optionsFrom, changedVar, visited)) return true;
  return false;
}
function varUsesEnumOptionsDependingOn(v, changedVar){
  if(!v || !changedVar) return false;
  const fmt = varFormat(v), t = varDataType(v);
  if(fmt==='single' && t==='enum') return enumSourceDependsOnVar(v.id, changedVar);
  if(fmt==='array' && v.valueType==='enum') return enumSourceDependsOnVar(v.optionsFrom, changedVar);
  if(fmt==='map'){
    if(v.keyType==='enum' && enumSourceDependsOnVar(v.keysFrom, changedVar)) return true;
    if(v.valueType==='enum' && enumSourceDependsOnVar(v.optionsFrom, changedVar)) return true;
  }
  return false;
}
function enumOptionsDependOn(changedVar){
  if(!changedVar) return false;
  return (DATA?.variables||[]).some(v=>varUsesEnumOptionsDependingOn(v, changedVar));
}
function refreshDynamicEnumLeftRows(changedVar){
  const root = document.getElementById('vars');
  if(!root || !changedVar) return;
  (DATA.variables||[]).forEach(v=>{
    if(v.hidden || v.id===changedVar) return;
    if(!varUsesEnumOptionsDependingOn(v, changedVar)) return;
    const row = root.querySelector('.var-row[data-var-id="'+CSS.escape(v.id)+'"]');
    if(!row) return;
    const label = row.querySelector(':scope > label');
    Array.from(row.children).forEach(ch=>{ if(ch!==label) ch.remove(); });
    row.appendChild(renderVarEditor(v, 'left'));
  });
}
function refreshDynamicEnumCenterInputs(changedVar, source){
  if(!changedVar) return;
  (DATA.variables||[]).forEach(v=>{
    if(v.id===changedVar) return; // не трогаем поле, в котором сейчас меняют значение
    if(!varUsesEnumOptionsDependingOn(v, changedVar)) return;
    const holders = document.querySelectorAll(`.inline-input-block[data-input-var="${CSS.escape(v.id)}"] .input-editor-holder`);
    holders.forEach(h=>{ h.innerHTML=''; h.appendChild(renderVarEditor(v, 'center')); });
  });
}
function afterVarChange(opts){
  opts = opts || {};
  const m = CURRENT ? DATA.modules[CURRENT] : null;
  const inputs = m ? getInputs(m) : [];
  const inputVarIds = inputs.map(i=>i.var);
  const changedIsInInputs = opts.changedVar && inputVarIds.includes(opts.changedVar);
  // source: 'left' | 'center' | undefined — откуда пришло изменение.
  // Мы НЕ перерисовываем ту же сторону (чтобы не терять фокус),
  // но обновляем ПРОТИВОПОЛОЖНУЮ, чтобы значения синхронизировались.
  const source = opts.source;

  const dynamicEnumChanged = enumOptionsDependOn(opts.changedVar);

  // Центр (модуль)
  if(opts.skipScreenRender){
    if(dynamicEnumChanged && CURRENT){
      // Для optionsFromIf нужен полный пересбор текущего модуля: зависимое поле может быть
      // array/map enum внутри buttons/input-блока. Частичный точечный апдейт оказался
      // недостаточно надёжным для всех вариантов разметки.
      renderScreen(CURRENT, false);
    } else {
      // Лёгкое обновление: пересчитать все text-блоки и кнопки (видимость по if).
      refreshTextBlocks();
      refreshModuleButtons();
      // Если изменение пришло из левой панели и переменная используется в input-блоке —
      // перерисуем конкретный input-блок, чтобы синхронизировать значение в центре.
      if(source==='left' && changedIsInInputs && opts.changedVar){
        const holders = document.querySelectorAll(`.inline-input-block[data-input-var="${CSS.escape(opts.changedVar)}"] .input-editor-holder`);
        const vdef = varDef(opts.changedVar);
        if(vdef){
          holders.forEach(h=>{ h.innerHTML=''; h.appendChild(renderVarEditor(vdef, 'center')); });
        }
      }
    }
  } else if(CURRENT){
    renderScreen(CURRENT, false);
  }

  // Левая панель
  // Если изменение пришло из центра — перерисуем левую целиком (фокус там не был).
  // Если из левой — фокус сохраняем: обновляем только зависящие enum-переменные
  // (а не всю панель), чтобы не потерять фокус/каретку в текущем поле.
  if(dynamicEnumChanged && source==='left'){
    // Точечно обновить только enum-переменные, зависящие от изменившейся.
    refreshDynamicEnumLeftRows(opts.changedVar);
    refreshDynamicEnumCenterInputs(opts.changedVar, source);
  } else if(dynamicEnumChanged){
    // Полная пересборка, только если изменение не из левой панели (фокус не там).
    renderVars();
  } else if(source !== 'left'){
    renderVars();
  } else {
    refreshVarsVisibility();
  }

  renderStages();
  if(CURRENT_OBJ) renderObjCard();
  renderNotes();
}

/* ============================================================
   ВНЕШНИЙ ИМПОРТ ДАННЫХ (Naumen → скрипт)
   Принимает payload через hash вида:
     #naumen=<base64url(JSON)>
     #import=<base64url(JSON)>
   Стандартные поля payload: parentName, childName, class, bitrixUrl, phone, raw, children[].
   Значения раскладываются по существующим переменным сценария через набор типовых alias.
============================================================ */
let PENDING_EXTERNAL_IMPORT = null;
function b64UrlDecodeUtf8(s){
  s = String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function findExistingVarId(candidates){
  const vars = (DATA?.variables||[]);
  const ids = new Set(vars.map(v=>v.id));
  const exact = (candidates||[]).find(id=>ids.has(id));
  if(exact) return exact;
  const lower = new Map(vars.map(v=>[String(v.id).toLowerCase(), v.id]));
  for(const id of (candidates||[])){
    const found = lower.get(String(id).toLowerCase());
    if(found) return found;
  }
  return '';
}
function setImportedVar(varId, value){
  if(!varId || value===undefined || value===null || value==='') return false;
  const vd = varDef(varId);
  if(!vd) return false;
  const t = varDataType(vd), fmt = varFormat(vd);
  if(fmt!=='single'){
    VARS[varId] = value;
    return true;
  }
  if(t==='number'){
    const n = Number(String(value).replace(',', '.').replace(/[^0-9.\-]/g,''));
    VARS[varId] = Number.isFinite(n) ? n : value;
  } else if(t==='bool'){
    VARS[varId] = (value===true || String(value).toLowerCase()==='true' || String(value).toLowerCase()==='да');
  } else {
    VARS[varId] = String(value);
  }
  return true;
}
function externalPayloadHasUsefulData(payload){
  if(!payload || typeof payload !== 'object') return false;
  if(payload.bitrixUrl || payload.parentName || payload.childName || payload.class || payload.phone) return true;
  if(Array.isArray(payload.children) && payload.children.length) return true;
  // raw сам по себе полезен только если похож на клиентскую строку Naumen, а не на таймер 02:26:26.
  const raw = String(payload.raw||'').trim();
  return /(^|\s)Р\s+[А-ЯЁA-Z]/.test(raw) || /(^|\s)У\s+[А-ЯЁA-Z]/.test(raw);
}
function applyExternalImport(payload){
  if(!payload || typeof payload !== 'object') return false;
  if(!externalPayloadHasUsefulData(payload)){
    console.warn('[external-import] Naumen payload without useful data:', payload);
    return false;
  }
  const varsReady = !!(DATA && Array.isArray(DATA.variables) && DATA.variables.length);
  if(!varsReady && !payload.__pendingForVars){
    // Данные пришли раньше, чем сценарий/переменные загрузились: заметки добавим сразу,
    // а раскладку по VARS повторим после initAll().
    PENDING_EXTERNAL_IMPORT = Object.assign({}, payload, {__pendingForVars:true, __notesAlreadyAdded:false});
  }
  const map = {
    parentName: ['parent_name','parent','parentName','parent_full_name','parent_fullname','client_name','clientName','name_parent','parent_first_name','parentName','parent_fio','parent_full'],
    childName:  ['child_name','student_name','pupil_name','student','child','kid_name','studentName','childName','student_fio','student_full','pupil'],
    class:      ['class','grade','student_class','child_class','klass','school_class','student_grade','child_grade','studentClass','childClass'],
    bitrixUrl:  ['bitrix_url','bitrix_contact_url','crm_url','contact_url'],
    phone:      ['phone','parent_phone','client_phone','contact_phone']
  };
  const applied = [];
  const appliedVarIds = [];
  const skipped = [];
  const pairs = [
    ['parentName', payload.parentName],
    ['childName',  payload.childName || payload.children?.[0]?.name],
    ['class',      payload.class || payload.children?.[0]?.class],
    ['bitrixUrl',  payload.bitrixUrl],
    ['phone',      payload.phone]
  ];
  if(varsReady){
    pairs.forEach(([key,val])=>{
      if(val===undefined || val===null || val==='') return;
      const varId = findExistingVarId(map[key]);
      if(varId && setImportedVar(varId, val)){
        applied.push(`${varId}=${val}`);
        appliedVarIds.push(varId);
      } else skipped.push(`${key}=${val}`);
    });
  } else {
    pairs.forEach(([key,val])=>{ if(val!==undefined && val!==null && val!=='') skipped.push(`${key}=${val}`); });
  }

  // Раньше импорт дублировался в заметки оператора. Убрано: данные Naumen
  // должны попадать в переменные, а заметки остаются ручным блокнотом оператора.


  renderNotes();
  if(varsReady){
    renderVars();
    if(appliedVarIds.length){
      [...new Set(appliedVarIds)].forEach(id=>afterVarChange({skipScreenRender:true, changedVar:id, source:'import'}));
    } else {
      afterVarChange({changedVar:null});
    }
  }
  console.log('[external-import]', payload, 'applied:', applied, 'skipped:', skipped);
  return true;
}
function processExternalImportFromLocation(){
  const h = location.hash || '';
  const m = h.match(/^#(?:naumen|import)=([^&]+)/);
  if(!m) return;
  try{
    const payload = JSON.parse(b64UrlDecodeUtf8(decodeURIComponent(m[1])));
    applyExternalImport(payload);
    // очищаем hash, чтобы при перезагрузке случайно не импортировать повторно
    history.replaceState(null, document.title, location.pathname + location.search);
  }catch(e){
    console.error('[external-import] bad payload:', e);
  }
}
window.addEventListener('hashchange', processExternalImportFromLocation);

function renderStages(){
  const root = document.getElementById('stages');
  root.innerHTML='';
  const stages = DATA.stages||[];

============================================================ */
function renderJump(){
  const sel = document.getElementById('jump');
  sel.innerHTML = '<option value="">— перейти к модулю —</option>';
  const byStage = {};
  const order = getModuleOrder();
  order.forEach(id=>{
    const m = DATA.modules[id]; if(!m) return;
    const s = m.stage || '—';
    (byStage[s] ||= []).push([id,m]);
  });
  const stageOrder = (DATA.stages||[]).map(s=>s.id)
    .concat(Object.keys(byStage).filter(s=>!(DATA.stages||[]).some(x=>x.id===s)));
  stageOrder.forEach(sid=>{
    if(!byStage[sid]) return;
    const so = (DATA.stages||[]).find(s=>s.id===sid);
    const og = document.createElement('optgroup'); og.label = so?so.title:sid;
    byStage[sid].forEach(([id,m])=>{
      const o = document.createElement('option');
      o.value=id; o.textContent=m.title||id;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.onchange = ()=>{ if(sel.value){ go(sel.value,true); sel.value=''; } };
}

/* ============================================================
   ПЕРЕХОД
============================================================ */
function go(id, record){
  if(!id) return;
  let m = DATA.modules[id];
  if(!m){
    document.getElementById('screen').innerHTML = `<div class="err">Модуль <b>${escHTML(id)}</b> не найден</div>`;
    return;
  }
  const visited = new Set();
  while(m && Array.isArray(m.branch)){
    if(visited.has(id)){
      document.getElementById('screen').innerHTML = `<div class="err">Зацикливание branch: ${[...visited].join(' → ')} → ${id}</div>`;
      return;
    }
    visited.add(id);
    let next=null;
    for(const b of m.branch){ if(evalIf(b.if)){ next=b.go; break; } }
    if(!next){
      document.getElementById('screen').innerHTML = `<div class="err">В branch-роутере <b>${escHTML(id)}</b> ни одна ветка не сработала</div>`;
      return;
    }
    id=next; m=DATA.modules[id];
    if(!m){ document.getElementById('screen').innerHTML=`<div class="err">Роутер ведёт в несуществующий модуль <b>${escHTML(id)}</b></div>`; return; }
  }
  renderScreen(id, record);
}

/* Сформировать HTML для одного buttons-блока. */
/* Сборка HTML buttons-блока. Items могут быть kind='button' (по умолчанию) или kind='input'.
   Это позволяет в одной строке смешивать кнопки и поля ввода переменных. */
function buildButtonsBlockHTML(blockItems, blockIdx){
  const items = (blockItems||[]);
  // Фильтр видимости: кнопки скрываются по if; поля ввода всегда видны
  const visible = items.map((it,i)=>({it,i})).filter(({it})=>{
    if(!it) return false;
    if((it.kind||'button') === 'input') return true;
    return evalIf(it.if);
  });
  if(!visible.length) return '<div class="empty">Нечего показать (все элементы скрыты по условию).</div>';
  return visible.map(({it,i})=>{
    if((it.kind||'button') === 'input'){
      const vdef = varDef(it.var);
      const labelHTML = escHTML(it.label || (vdef?.label || it.var || ''));
      return `<div class="inline-input-block btnrow-input" data-block-idx="${blockIdx}" data-item-idx="${i}" data-input-var="${escHTML(it.var||'')}">
        ${labelHTML ? `<label class="inline-input-label">${labelHTML}</label>` : ''}
        <div class="input-editor-holder"></div>
        ${!vdef ? '<div class="hint" style="color:var(--bad)">переменная не задана</div>' : ''}
      </div>`;
    }
    // button
    const b = it;
    const cls = b.end ? 'end' : (b.open_obj ? 'obj-link-btn' : '');
    const hint = b.next ? `→ ${escHTML(b.next)}`
               : b.end ? '↺ заново'
               : b.open_obj ? `⚠ ${escHTML(b.open_obj)}` : '';
    return `<button data-bi="${blockIdx}" data-i="${i}" class="${cls}">
      ${interpolateHTML(b.label||'(без текста)')}
      ${hint?` <span style="opacity:.55;font-size:11px">${hint}</span>`:''}
    </button>`;
  }).join('');
}

/* Сохранить фокус-контекст (varId + позиция каретки) если фокус находится внутри
   указанного контейнера (или любого из контейнеров). Возвращает снимок или null. */
function snapshotFocus(container){
  // container может быть: Element, NodeList, массив элементов, либо null/undefined.
  let containers;
  if(!container) containers = [];
  else if(container instanceof NodeList || Array.isArray(container)) containers = Array.from(container);
  else containers = [container];
  const ae = document.activeElement;
  if(!ae) return null;
  const inside = containers.some(c => c && typeof c.contains === 'function' && c.contains(ae));
  if(!inside) return null;
  const varId = ae.dataset && ae.dataset.var;
  if(!varId) return null;
  const snap = { varId, tagName: ae.tagName, type: ae.type || '' };
  if(ae.tagName === 'INPUT' && (ae.type === 'text' || ae.type === 'number' || ae.type === '')){
    snap.selectionStart = ae.selectionStart;
    snap.selectionEnd = ae.selectionEnd;
  } else if(ae.tagName === 'TEXTAREA'){
    snap.selectionStart = ae.selectionStart;
    snap.selectionEnd = ae.selectionEnd;
  }
  return snap;
}
/* Восстановить фокус на элементе с data-var == snap.varId внутри указанного корня. */
function restoreFocus(root, snap){
  if(!snap || !snap.varId) return;
  const targets = (root || document).querySelectorAll(
    `input[data-var="${CSS.escape(snap.varId)}"], select[data-var="${CSS.escape(snap.varId)}"], textarea[data-var="${CSS.escape(snap.varId)}"]`
  );
  if(!targets.length) return;
  const el = targets[0];
  try{ el.focus(); }catch(e){}
  if((el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number' || el.type === '')) || el.tagName === 'TEXTAREA'){
    const pos = typeof snap.selectionStart === 'number' ? snap.selectionStart : el.value.length;
    const posEnd = typeof snap.selectionEnd === 'number' ? snap.selectionEnd : pos;
    try{ el.setSelectionRange(pos, posEnd); }catch(e){}
  }
}

/* Перерисовать ВСЕ buttons-блоки текущего модуля (видимость кнопок зависит от переменных).
   После перерисовки — повторно подключить редакторы переменных в input-items этого блока.
   ВАЖНО: перед пересборкой сохраняем фокус и позицию каретки, чтобы ввод в инлайновом
   инпуте не терял фокус после каждого нажатого символа. */
function refreshModuleButtons(){
  if(!CURRENT) return;
  const m = DATA.modules[CURRENT];
  if(!m) return;
  const boxes = document.querySelectorAll('#screen .module .btns[data-block-idx]');
  // Сохранить фокус, если активный элемент сейчас в одном из buttons-блоков
  const focusSnap = snapshotFocus(boxes);
  boxes.forEach(box=>{
    const idx = +box.dataset.blockIdx;
    const blk = (m.blocks||[])[idx];
    if(!blk || blk.type!=='buttons') return;
    box.innerHTML = buildButtonsBlockHTML(blk.items, idx);
    // Подключить редакторы переменных в input-items внутри этого блока
    box.querySelectorAll('.inline-input-block').forEach(spot=>{
      const vname = spot.dataset.inputVar;
      const vdef = varDef(vname);
      if(!vdef) return;
      const holder = spot.querySelector('.input-editor-holder');
      if(holder){ holder.innerHTML=''; holder.appendChild(renderVarEditor(vdef, 'center')); }
    });
  });
  attachButtonsHandlers(m);
  // Восстановить фокус и каретку
  if(focusSnap){
    // Ищем новый элемент по всей области экрана
    restoreFocus(document.getElementById('screen'), focusSnap);
  }
}

/* Перерисовать ВСЕ text-блоки (сохраняя состояние раскрытых \\\ блоков). */
function refreshTextBlocks(){
  if(!CURRENT) return;

  if(!m) return;
  document.querySelectorAll('#screen .module .text[data-block-idx]').forEach(box=>{

/* Навесить onclick на все кнопки во всех buttons-блоках текущего модуля. */
function attachButtonsHandlers(m){
  document.querySelectorAll('#screen .btns button[data-bi]').forEach(btn=>{
    btn.onclick = ()=>{
      const bi = +btn.dataset.bi, i = +btn.dataset.i;
      const blk = (m.blocks||[])[bi];
      if(!blk || blk.type!=='buttons') return;
      const b = (blk.items||[])[i];
      if(!b) return;
      let setChangedVars = [];
      if(b.set){
        setChangedVars = Object.keys(b.set || {});
        Object.entries(b.set).forEach(([k,vv])=>{ applySetOp(k, vv); });
        // Важно: set-кнопки тоже могут менять переменные, от которых зависят optionsFromIf
        // (например class → favorite_subjects). Поэтому прогоняем обычный pipeline изменения
        // переменной, а не только текст/кнопки. Иначе enum-списки обновлялись только после
        // перезахода в модуль.
        setChangedVars.forEach(k=>afterVarChange({skipScreenRender:true, changedVar:k, source:'set'}));
      }
      if(b.end){
        resetVarsToDefaults();
        renderNotes(); renderVars(); HISTORY=[];
        if(DATA.start) go(DATA.start, true);
        else { document.getElementById('screen').innerHTML=`<div class="module"><h1>Готово ✓</h1></div>`; renderStages(); renderHistory(); }
        return;
      }
      if(b.open_obj){
        CURRENT_OBJ = b.open_obj;
        document.querySelectorAll('#workView .tab').forEach(x=>x.classList.remove('active'));
        document.querySelector('#workView .tab[data-tab="obj"]').classList.add('active');
        document.getElementById('tab-hist').style.display='none';
        document.getElementById('tab-obj').style.display='';
        renderObjList(); renderObjCard();
        return;
      }
      if(b.next) go(b.next, true);
    };
  });
}

function renderScreen(id, record){
  const m = DATA.modules[id];
  if(!m){ document.getElementById('screen').innerHTML = `<div class="err">Модуль ${escHTML(id)} не найден</div>`; return; }
  const isNewModule = (CURRENT !== id) || record;
  if(isNewModule){
    const col = document.querySelector('.col-script');
    if(col) col.scrollTop = 0;
  }
  CURRENT = id;
  const blocks = getBlocks(m);
  // Сохраним состояние раскрытых \\\ блоков (если это перерендер того же модуля)
  const prevOpenByIdx = {};
  if(!isNewModule){
    document.querySelectorAll('#screen .module .text[data-block-idx]').forEach(box=>{
      prevOpenByIdx[box.dataset.blockIdx] = snapshotCollapsibleState(box);
    });
  }
  // Если новый заход — пересоздать выбор случайного варианта в каждом text-блоке
  if(isNewModule){
    CURRENT_TEXT_BLOCKS = {};
    blocks.forEach((b, i)=>{
      if(b.type==='text') CURRENT_TEXT_BLOCKS[i] = pickText(b.text);
    });
  } else {
    // Для блоков, у которых нет выбора (например, новые добавились) — выбрать
    blocks.forEach((b, i)=>{
      if(b.type==='text' && CURRENT_TEXT_BLOCKS[i]===undefined){
        CURRENT_TEXT_BLOCKS[i] = pickText(b.text);
      }
    });
  }
  const stageObj = (DATA.stages||[]).find(s=>s.id===m.stage);
  const stageLabel = stageObj?stageObj.title:(m.stage||'—');

  // Построим HTML по блокам. Соседние input-блоки группируем в один ряд,
  // чтобы они стакались как кнопки (авто-грид).
  function inputBlockHTML(blk, idx){
    const vdef = varDef(blk.var);
    const labelHTML = escHTML(blk.label || (vdef?.label || blk.var || ''));
    return `<div class="inline-input-block" data-block-idx="${idx}" data-input-var="${escHTML(blk.var||'')}">
      ${labelHTML ? `<label class="inline-input-label">${labelHTML}</label>` : ''}
      <div class="input-editor-holder"></div>
      ${!vdef ? '<div class="hint" style="color:var(--bad)">переменная не задана</div>' : ''}
    </div>`;
  }
  let blocksHTML = '';
  let i = 0;
  while(i < blocks.length){
    const blk = blocks[i];
    if(blk.type === 'text'){
      const chosen = CURRENT_TEXT_BLOCKS[i] ?? '';
      blocksHTML += `<div class="text" data-block-idx="${i}">${interpolateHTML(chosen)}</div>`;
      i++;
    } else if(blk.type === 'buttons'){
      blocksHTML += `<div class="btns" data-block-idx="${i}">${buildButtonsBlockHTML(blk.items, i)}</div>`;
      i++;
    } else if(blk.type === 'input'){
      // Собрать пачку подряд идущих input-блоков
      let j = i;
      const items = [];
      while(j < blocks.length && blocks[j].type === 'input'){
        items.push(inputBlockHTML(blocks[j], j));
        j++;
      }
      if(items.length === 1){
        blocksHTML += items[0];
      } else {
        blocksHTML += `<div class="input-group">${items.join('')}</div>`;
      }
      i = j;
    } else {
      i++;
    }
  }

  // Снимок фокуса на случай, если полная перерисовка вызвана во время ввода в инлайн-поле
  // (например при изменении enum-опций от другой переменной).
  var _screenFocusSnap = null;
  {
    const ae = document.activeElement;
    if(ae && document.getElementById('screen').contains(ae)){
      _screenFocusSnap = snapshotFocus([document.getElementById('screen')]);
    }
  }

  document.getElementById('screen').innerHTML = `
    <div class="module">
      <button class="edit-link" id="editCurrentModule" title="Открыть в редакторе">✎</button>
      <span class="badge stage-badge">этап: ${escHTML(stageLabel)}</span>
      <span class="badge">id: ${escHTML(id)}</span>
      <h1>${escHTML(m.title||id)}</h1>
      ${blocksHTML}
    </div>`;
  document.getElementById('editCurrentModule').onclick = ()=>{
    EDIT_TAB='scripts'; EDIT_SELECTED=id;
    setMode('edit');
  };

  // Сохранить фокус до заполнения редакторов (screen уже переписан, старые узлы мертвы —
  // но snapshot мы сняли раньше, см. ниже). Здесь запомним позицию в новом контейнере пока пустом.
  // Заполнить input-блоки редакторами переменных
  let firstFocusable = null;
  document.querySelectorAll('#screen .inline-input-block').forEach(box=>{
    const vname = box.dataset.inputVar;
    const vdef = varDef(vname);
    if(!vdef) return;
    const holder = box.querySelector('.input-editor-holder');
    if(!holder) return;
    holder.appendChild(renderVarEditor(vdef, 'center'));
    if(!firstFocusable){
      const focusable = holder.querySelector('input[type=text], input[type=number], textarea, select');
      if(focusable) firstFocusable = focusable;
    }
  });
  // Восстановить фокус, если был внутри инлайн-поля ввода при вызове (снимок в _screenFocusSnap)
  if(_screenFocusSnap){
    restoreFocus(document.getElementById('screen'), _screenFocusSnap);
    _screenFocusSnap = null;
  } else if(firstFocusable && isNewModule){
    firstFocusable.focus();
  }

  attachButtonsHandlers(m);

  // Восстановить раскрытые \\\ блоки в каждом text-блоке
  if(!isNewModule){
    Object.entries(prevOpenByIdx).forEach(([idx, openSet])=>{
      const box = document.querySelector(`#screen .module .text[data-block-idx="${idx}"]`);
      if(box) applyCollapsibleState(box, openSet);
    });
  }

  if(record){
    // Снимок текста — соберём из всех text-блоков
    let snip = '';
    blocks.forEach((b, i)=>{
      if(b.type==='text') snip += ' ' + (CURRENT_TEXT_BLOCKS[i]||'');
    });
    HISTORY.unshift({id, stage:m.stage, title:m.title||id,
      snippet: interpolate(snip).trim().slice(0,90), ts:new Date()});
    renderHistory();
  }
  renderStages();
}

function renderHistory(){
  document.getElementById('histCount').textContent = HISTORY.length;
  const root = document.getElementById('history');
  if(HISTORY.length===0){ root.innerHTML='<div class="empty">пусто</div>'; return; }
  root.innerHTML='';
  HISTORY.forEach((h,idx)=>{
    const el = document.createElement('div'); el.className='item';
    const so = (DATA.stages||[]).find(s=>s.id===h.stage);
    el.innerHTML = `<div><b>${HISTORY.length-idx}. ${escHTML(h.title)}</b>
      <span class="badge stage-badge">${escHTML(so?so.title:h.stage||'')}</span></div>
      <div class="small">${h.ts.toLocaleTimeString()} · ${escHTML(h.snippet)}…</div>`;
    el.onclick = ()=>{ HISTORY = HISTORY.slice(idx+1); go(h.id, true); };
    root.appendChild(el);
  });
}

function renderObjList(){
  const q = (document.getElementById('objSearch')?.value||'').toLowerCase().trim();
  const {map, roots} = buildObjTree();
  document.getElementById('objCount').textContent = (OBJS.objections||[]).length;
  const root = document.getElementById('objList');
  root.innerHTML='';

  // При поиске: показываем плоский список совпадений + их предков (для контекста).
  if(q){
    const matched = (OBJS.objections||[]).filter(o=>{
      const node = map[o.id] || {o, children:[]};
      return objectionMatchesQuery(node, map, q);
    });
    if(!matched.length){ root.innerHTML='<div class="empty">ничего не найдено</div>'; return; }
    matched.forEach(o=>{
      const node = map[o.id] || {o, children:[]};
      const path = pathTitlesOf(node, map);
      const breadcrumb = path.length>1 ? path.slice(0,-1).join(' / ') : '';
      const el = document.createElement('div');
      el.className='item'+(CURRENT_OBJ===o.id?' active':'');
      el.innerHTML = `${breadcrumb?`<div class="tags">${escHTML(breadcrumb)} ↳</div>`:''}
        <div><b>${escHTML(o.title)}</b></div>
        ${(o.tags||[]).length?`<div class="tags">${escHTML((o.tags||[]).join(', '))}</div>`:''}`;
      el.onclick = ()=>{ CURRENT_OBJ=o.id; renderObjList(); renderObjCard(); };
      root.appendChild(el);
    });
    return;
  }

  // Без поиска — древовидный рендер. Корни видны всегда. Дети — под раскрытым родителем.
  if(!roots.length){ root.innerHTML='<div class="empty">нет возражений</div>'; return; }
  const renderNode = (node, depth)=>{
    const o = node.o;
    const hasChildren = node.children.length>0;
    const isCollapsed = COLLAPSED.has(o.id);
    const el = document.createElement('div');
    el.className='item obj-tree-item'+(CURRENT_OBJ===o.id?' active':'');
    el.style.marginLeft = (depth*14)+'px';
    const twistyClass = hasChildren ? ('obj-tree-twisty has-children'+(isCollapsed?'':' open')) : 'obj-tree-twisty';
    el.innerHTML = `
      <span class="${twistyClass}"></span>
      <span class="obj-tree-title"><b>${escHTML(o.title)}</b></span>
      ${hasChildren?`<span class="obj-tree-count">${node.children.length}</span>`:''}`;
    // клик по стрелке — свернуть/раскрыть; клик по тексту — открыть карточку
    el.querySelector('.obj-tree-twisty').onclick = (e)=>{
      e.stopPropagation();
      if(!hasChildren) return;
      if(isCollapsed) COLLAPSED.delete(o.id); else COLLAPSED.add(o.id);
      renderObjList();
    };
    el.onclick = ()=>{ CURRENT_OBJ=o.id; renderObjList(); renderObjCard(); };
    root.appendChild(el);
    if(hasChildren && !isCollapsed){
      node.children.forEach(c=>renderNode(c, depth+1));
    }
  };
  roots.forEach(n=>renderNode(n, 0));
}
function renderObjCard(){
  const root = document.getElementById('objCard');
  if(!CURRENT_OBJ){ root.innerHTML='<div class="hint">Выбери возражение в списке.</div>'; OBJ_CARD_LAST_ID=null; return; }
  const o = (OBJS.objections||[]).find(x=>x.id===CURRENT_OBJ);
  if(!o){ root.innerHTML='<div class="err">Не найдено</div>'; OBJ_CARD_LAST_ID=null; return; }
  // Сохраняем состояние раскрытых блоков ТОЛЬКО если это та же карточка —
  // то есть перерисовка от изменения переменных, а не переход на другое возражение.
  // При переходе на другое возражение — все блоки в дефолтном состоянии (свернуты).
  const sameCard = (OBJ_CARD_LAST_ID === CURRENT_OBJ);
  const prevOpen = sameCard ? snapshotCollapsibleState(root) : null;
  OBJ_CARD_LAST_ID = CURRENT_OBJ;
  const text = pickText(o.text);

  // Ручные кнопки из JSON
  const manualBtns = (o.buttons||[]).map((b,i)=>
    `<button class="obj-manual" data-i="${i}">${interpolateHTML(b.label||'')}</button>`
  );
  // Автокнопки на детей — для тех, на кого ещё нет ручной ссылки
  const manualGotoSet = new Set((o.buttons||[]).map(b=>b.goto).filter(Boolean));
  const children = (OBJS.objections||[]).filter(x=>x.parent===o.id && !manualGotoSet.has(x.id));
  const autoBtns = children.map(c=>
    `<button class="obj-auto" data-go="${escHTML(c.id)}">↳ ${escHTML(c.title||c.id)}</button>`
  );
  const allBtns = manualBtns.concat(autoBtns);

  // Кнопка «↑ к родителю» (если есть)
  const parentBtn = o.parent
    ? `<button class="obj-parent" data-go="${escHTML(o.parent)}" title="К родителю">↑ ${escHTML((OBJS.objections||[]).find(x=>x.id===o.parent)?.title||o.parent)}</button>`
    : '';

  root.innerHTML = `<div class="obj-card">
      <button class="edit-link" id="editCurrentObj" title="Открыть в редакторе">✎</button>
      <button class="obj-close-x" id="objCloseX" title="Закрыть">✕</button>
      ${parentBtn}
      <h3>⚠ ${escHTML(o.title)}</h3>
      <div class="text">${interpolateHTML(text)}</div>
      ${allBtns.length?`<div class="btns">${allBtns.join('')}</div>`:''}
    </div>`;
  document.getElementById('objCloseX').onclick = ()=>{ CURRENT_OBJ=null; renderObjList(); renderObjCard(); };
  document.getElementById('editCurrentObj').onclick = ()=>{
    EDIT_TAB='objs'; EDIT_SELECTED=o.id;
    setMode('edit');
  };
  const pb = root.querySelector('.obj-parent');
  if(pb) pb.onclick = ()=>{ CURRENT_OBJ = pb.dataset.go; renderObjList(); renderObjCard(); };
  // ручные
  root.querySelectorAll('.obj-card .btns .obj-manual').forEach(btn=>{
    btn.onclick = ()=>{ const b=o.buttons[+btn.dataset.i]; if(b.goto){ CURRENT_OBJ=b.goto; renderObjList(); renderObjCard(); } };
  });
  // автоматические — на детей
  root.querySelectorAll('.obj-card .btns .obj-auto').forEach(btn=>{
    btn.onclick = ()=>{ CURRENT_OBJ=btn.dataset.go; renderObjList(); renderObjCard(); };
  });
  // Восстановить раскрытые блоки (если карточка перерисовалась из-за изменения переменных).
  // При переходе на другое возражение prevOpen === null — блоки остаются в дефолтном (свёрнутом) виде.
  if(prevOpen) applyCollapsibleState(root, prevOpen);
}

function setMode(mode){
  const wasMode = MODE;
  MODE = mode;
  document.getElementById('modeWork').classList.toggle('active', mode==='work');
  document.getElementById('modeCalls').classList.toggle('active', mode==='calls');
  document.getElementById('modeEdit').classList.toggle('active', mode==='edit');
  document.getElementById('workView').style.display = mode==='work'?'':'none';
  document.getElementById('callsView').style.display = mode==='calls'?'':'none';
  document.getElementById('editView').style.display = mode==='edit'?'':'none';
  document.getElementById('stages').style.display   = mode==='work'?'':'none';
  if(mode==='edit') renderEditor();
  if(mode==='calls') renderCalls();
  // При переходе в «Работа» из редактора — перерисовать текущие модуль и карточку возражения,
  // чтобы подтянулись правки. Не вызываем go(), чтобы не сбивать переменные/историю —
  // просто обновляем DOM с актуальным content.
  if(mode==='work' && wasMode==='edit'){
    if(CURRENT && DATA?.modules?.[CURRENT]){
      // Сбрасываем кэш выбранных вариантов — пересоберутся в renderScreen
      CURRENT_TEXT_BLOCKS = {};
      renderScreen(CURRENT, false);
    }
    if(CURRENT_OBJ){ renderObjList(); renderObjCard(); }
    renderVars();   // на случай, если переменные правились
    renderStages(); // и этапы
    renderJump();
  }
  updateSaveBtn();
  updateRestoreBtn();
}

/* ---- Список скриптов (плоский, с DnD) ---- */
function getModuleOrder(){
  const all = Object.keys(DATA.modules);
  if(!Array.isArray(DATA.order)) DATA.order = all.slice();
  // удалим несуществующие, добавим новые в конец
  DATA.order = DATA.order.filter(id=>DATA.modules[id]);
  all.forEach(id=>{ if(!DATA.order.includes(id)) DATA.order.push(id); });
  return DATA.order;
}
function renderScriptsList(root, q){
  const order = getModuleOrder();
  let shown = 0;
  order.forEach(id=>{
    const m = DATA.modules[id]; if(!m) return;
    // Поиск ищет в id, title и во всех text-блоках (с учётом массивов вариантов)
    let textHay = '';
    getBlocks(m).forEach(blk=>{
      if(blk.type==='text'){
        textHay += ' ' + (Array.isArray(blk.text) ? blk.text.join(' ') : (blk.text||''));
      } else if(blk.type==='input' && blk.label){
        textHay += ' ' + blk.label;
      }
    });
    const hay = (id+' '+(m.title||'')+' '+textHay).toLowerCase();
    if(q && !hay.includes(q)) return;
    const el = document.createElement('div'); el.className='item'+(EDIT_SELECTED===id?' active':'');
    el.draggable = true;
    el.dataset.kind='script'; el.dataset.id=id;
    const so = (DATA.stages||[]).find(s=>s.id===m.stage);
    const isBr = Array.isArray(m.branch);
    el.innerHTML = `<span class="grip" title="Перетащить">⋮⋮</span>
      <span>${isBr?'🔀 ':''}<b>${escHTML(m.title||id)}</b></span>
      <span class="stage-tag">${escHTML(so?so.title:(m.stage||'?'))}</span>
      <span class="id">${escHTML(id)}</span>`;
    el.onclick = (e)=>{ if(e.target.classList.contains('grip')) return; EDIT_SELECTED=id; renderEditor(); };
    attachScriptDnD(el);
    root.appendChild(el); shown++;
  });
  if(!shown) root.innerHTML='<div class="empty">нет модулей</div>';
}
/* ===== Универсальный drag-and-drop для упорядоченных списков =====
   Применяется к карточкам в редакторе: кнопки модуля, кнопки возражения,
   ветки branch, поля input, ключи map, варианты enum, элементы array.
   Параметры:
     - container: DOM-узел, куда вложены items
     - itemSelector: CSS-селектор итемов внутри container
     - getArr: () => массив, который нужно переставить
     - onReorder: () => void — вызов после перестановки (rerender)
     - handleSelector (опц.): где хватать (.grip / вся карточка)
*/
function attachListDnD(container, opts){
  const {itemSelector, getArr, onReorder, handleSelector} = opts;
  const items = container.querySelectorAll(itemSelector);
  items.forEach((item, idx)=>{
    item.dataset.dndIdx = idx;
    // По умолчанию НЕ draggable (чтобы можно было выделять текст в input)
    item.draggable = false;
    const handles = handleSelector ? item.querySelectorAll(handleSelector) : [item];
    handles.forEach(h=>{
      h.addEventListener('mousedown', e=>{
        if(e.target.closest('input,select,textarea,button')) return;
        item.draggable = true;
      });
    });
    item.addEventListener('mouseup', ()=>{ item.draggable = false; });
    item.addEventListener('mouseleave', ()=>{ if(!item.classList.contains('dnd-dragging')) item.draggable = false; });

    item.addEventListener('dragstart', e=>{
      item.classList.add('dnd-dragging');
      e.dataTransfer.setData('text/plain', String(idx));
      e.dataTransfer.effectAllowed = 'move';
      // Не пускать drag-в-textarea (varPalette) — там свой MIME
      e.stopPropagation();
    });
    item.addEventListener('dragend', ()=>{
      item.classList.remove('dnd-dragging');
      container.querySelectorAll(itemSelector).forEach(x=>x.classList.remove('dnd-before','dnd-after'));
      item.draggable = false;
    });
    item.addEventListener('dragover', e=>{
      const dragging = container.querySelector('.dnd-dragging');
      if(!dragging || dragging===item) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      item.classList.toggle('dnd-before', before);
      item.classList.toggle('dnd-after', !before);
    });
    item.addEventListener('dragleave', ()=>{ item.classList.remove('dnd-before','dnd-after'); });
    item.addEventListener('drop', e=>{
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain'),10);
      const to = parseInt(item.dataset.dndIdx,10);
      const arr = getArr();
      // Защита: индексы в пределах массива, разные, массив не повреждён.
      if(!Array.isArray(arr) || isNaN(from) || isNaN(to) || from===to
         || from < 0 || from >= arr.length || to < 0 || to >= arr.length){
        return;
      }
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height/2;
      const moved = arr[from];
      if(moved === undefined || moved === null) return; // защита от "дыр"
      arr.splice(from, 1);
      // После удаления индекс target сдвинулся (если from < to)
      const targetIdx = (from < to) ? to - 1 : to;
      const insertAt = before ? targetIdx : targetIdx + 1;
      arr.splice(Math.max(0, Math.min(arr.length, insertAt)), 0, moved);
      if(onReorder) onReorder();
    });
  });
}

/* ---- Дерево возражений (с DnD + parent) ---- */
function buildObjTree(){
  const map = {}; const roots = [];
  (OBJS.objections||[]).forEach(o=>{ map[o.id] = {o, children:[]}; });
  (OBJS.objections||[]).forEach(o=>{
    const node = map[o.id];
    if(o.parent && map[o.parent] && o.parent!==o.id){
      // защита от цикла: проверить, что o не предок parent
      let p = map[o.parent]; let safe = true;
      while(p){
        if(p.o.id===o.id){ safe=false; break; }
        p = p.o.parent ? map[p.o.parent] : null;
      }
      if(safe){ map[o.parent].children.push(node); return; }
    }
    roots.push(node);
  });
  return {map, roots};
}
function pathTitlesOf(node, map){
  const titles = [];
  let cur = node;
  while(cur){
    titles.unshift(cur.o.title||cur.o.id);
    cur = cur.o.parent && map[cur.o.parent] ? map[cur.o.parent] : null;
  }
  return titles;
}
function pathIdsOf(node, map){
  const ids = [];
  let cur = node;
  while(cur){
    ids.unshift(cur.o.id);
    cur = cur.o.parent && map[cur.o.parent] ? map[cur.o.parent] : null;
  }
  return ids;
}

/* ===== Префиксные id для возражений =====
   Полный id = [id предков ...].join('__') + '__' + leafName
   leafName — короткое имя, которое вводит юзер. Если родителя нет — id = leafName. */
const ID_SEP = '__';
function leafIdOf(fullId, parentFullId){
  if(!parentFullId) return fullId;
  const prefix = parentFullId + ID_SEP;
  return fullId.startsWith(prefix) ? fullId.slice(prefix.length) : fullId;
}
function makeFullId(leaf, parentFullId){
  leaf = String(leaf||'').trim();
  if(!parentFullId) return leaf;
  return parentFullId + ID_SEP + leaf;
}
/* Переименовать возражение и всю его ветку под новый полный id.
   Возвращает массив пар [oldId, newId] для обновления внешних ссылок. */
function renameObjectionTree(o, newId){
  if(o.id===newId) return [];
  const changes = [];
  const oldId = o.id;
  o.id = newId;
  changes.push([oldId, newId]);
  // обновим всех детей: их leaf остаётся, префикс меняется
  (OBJS.objections||[]).forEach(child=>{
    if(child.parent===oldId){
      child.parent = newId;
      const leaf = leafIdOf(child.id, oldId);
      const childNew = makeFullId(leaf, newId);
      // рекурсивно
      changes.push(...renameObjectionTree(child, childNew));
    }
  });
  return changes;
}
/* Применить переименования ко всем внешним ссылкам:
   goto в объ-кнопках, open_obj в скриптах. */
function applyIdChanges(changes){
  if(!changes.length) return;
  const m = new Map(changes);
  (OBJS.objections||[]).forEach(x=>{
    (x.buttons||[]).forEach(b=>{ if(m.has(b.goto)) b.goto = m.get(b.goto); });
  });
  Object.values(DATA.modules||{}).forEach(mod=>{
    getButtons(mod).forEach(b=>{ if(m.has(b.open_obj)) b.open_obj = m.get(b.open_obj); });
  });
}
function fullIdExists(id, excludeId){
  return (OBJS.objections||[]).some(o=>o.id===id && o.id!==excludeId);
}
function suggestUniqueLeaf(leaf, parentFullId, excludeId){
  let candidate = makeFullId(leaf, parentFullId);
  if(!fullIdExists(candidate, excludeId)) return leaf;
  let i = 2;
  while(fullIdExists(makeFullId(leaf+'_'+i, parentFullId), excludeId)) i++;
  return leaf+'_'+i;
}
/* Авто-теги: ["expensive", "expensive/installment", "Дорого", "Дорого/Рассрочка"] */
function autoTagsFor(node, map){
  const ids = pathIdsOf(node, map);
  const titles = pathTitlesOf(node, map);
  const out = [];
  for(let i=0;i<ids.length;i++){
    out.push(ids.slice(0,i+1).join('/'));
    out.push(titles.slice(0,i+1).join('/'));
  }
  return out;
}
function objectionMatchesQuery(node, map, q){
  if(!q) return true;
  const o = node.o;
  const tagsAll = (o.tags||[]).concat(autoTagsFor(node, map));
  const hay = (o.id+' '+(o.title||'')+' '+tagsAll.join(' ')+' '+(Array.isArray(o.text)?o.text.join(' '):o.text||'')).toLowerCase();
  return hay.includes(q);
}
function nodeHasMatch(node, map, q){
  if(objectionMatchesQuery(node, map, q)) return true;
  return node.children.some(c=>nodeHasMatch(c, map, q));
}
function renderObjectionsTree(root, q){
  const {map, roots} = buildObjTree();
  let shown = 0;
  function walk(nodes, depth){
    nodes.forEach(node=>{
      if(q && !nodeHasMatch(node, map, q)) return;
      const o = node.o;
      const hasChildren = node.children.length>0;
      const collapsed = COLLAPSED.has(o.id);
      const el = document.createElement('div');
      el.className='item'+(EDIT_SELECTED===o.id?' active':'');
      el.draggable = true;
      el.dataset.kind='obj'; el.dataset.id=o.id;
      const indent = depth*16;
      const leafIdShow = leafIdOf(o.id, o.parent||'');
      el.innerHTML = `
        <span class="indent" style="width:${indent}px"></span>
        <span class="grip" title="Перетащить">⋮⋮</span>
        <span class="twisty">${hasChildren ? (collapsed?'▶':'▼') : ' '}</span>
        <span><b>${escHTML(o.title||o.id)}</b></span>
        <span class="obj-tag">${hasChildren ? `↳ ${node.children.length}` : 'возр.'}</span>
        <span class="id" title="${escHTML(o.id)}">${escHTML(leafIdShow)}</span>`;
      const twisty = el.querySelector('.twisty');
      if(hasChildren){
        twisty.onclick = (e)=>{ e.stopPropagation();
          if(COLLAPSED.has(o.id)) COLLAPSED.delete(o.id); else COLLAPSED.add(o.id);
          renderEdList();
        };
      }
      el.onclick = (e)=>{
        if(e.target.classList.contains('grip')||e.target.classList.contains('twisty')) return;
        EDIT_SELECTED=o.id; renderEditor();
      };
      attachObjDnD(el);
      root.appendChild(el); shown++;
      if(!collapsed || q) walk(node.children, depth+1);
    });
  }
  walk(roots, 0);
  if(!shown) root.innerHTML='<div class="empty">нет возражений</div>';
}
function isAncestorOf(targetId, possibleAncestorId, map){
  let cur = map[targetId];
  while(cur && cur.o.parent){
    if(cur.o.parent===possibleAncestorId) return true;
    cur = map[cur.o.parent];
  }
  return false;
}
function attachObjDnD(el){
  el.addEventListener('dragstart', e=>{
    el.classList.add('dragging');
    e.dataTransfer.setData('text/plain', el.dataset.id);
    e.dataTransfer.effectAllowed='move';
  });
  el.addEventListener('dragend', ()=>{
    el.classList.remove('dragging');
    document.querySelectorAll('.ed-list .item').forEach(x=>x.classList.remove('drop-before','drop-after','drop-inside'));
  });
  el.addEventListener('dragover', e=>{
    if(!document.querySelector('.ed-list .item.dragging')) return;
    e.preventDefault();
    const rect = el.getBoundingClientRect();
    const y = e.clientY - rect.top;
    el.classList.remove('drop-before','drop-after','drop-inside');
    // Три зоны: верх 25% — before, низ 25% — after, середина — inside (вложить)
    if(y < rect.height*0.25) el.classList.add('drop-before');
    else if(y > rect.height*0.75) el.classList.add('drop-after');
    else el.classList.add('drop-inside');
  });
  el.addEventListener('dragleave', ()=>{ el.classList.remove('drop-before','drop-after','drop-inside'); });
  el.addEventListener('drop', e=>{
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetId = el.dataset.id;
    if(!draggedId || draggedId===targetId) return;

    const {map} = buildObjTree();
    // Запрет: не делать предка ребёнком потомка
    if(isAncestorOf(targetId, draggedId, map)){ alert('Нельзя перенести родителя внутрь его потомка.'); return; }

    const dragged = OBJS.objections.find(x=>x.id===draggedId);
    const target  = OBJS.objections.find(x=>x.id===targetId);
    if(!dragged||!target) return;

    const rect = el.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const mode = y < rect.height*0.25 ? 'before' : (y > rect.height*0.75 ? 'after' : 'inside');

    // Запомним короткое имя ДО смены parent
    const oldParent = dragged.parent || '';
    const leaf = leafIdOf(dragged.id, oldParent);

    // Уберём из массива
    OBJS.objections = OBJS.objections.filter(x=>x.id!==draggedId);

    let newParentId;
    if(mode==='inside'){
      newParentId = targetId;
    } else {
      newParentId = target.parent || '';
    }
    dragged.parent = newParentId || undefined;

    // Пересчитываем полный id, при конфликте — auto-suffix
    const uniqueLeaf = suggestUniqueLeaf(leaf, newParentId, dragged.id);
    const newFullId = makeFullId(uniqueLeaf, newParentId);
    const changes = renameObjectionTree(dragged, newFullId);

    // Вставляем dragged обратно в массив на нужную позицию
    if(mode==='inside'){
      const ti = OBJS.objections.findIndex(x=>x.id===targetId);
      OBJS.objections.splice(ti+1, 0, dragged);
      COLLAPSED.delete(targetId);
    } else {
      const ti = OBJS.objections.findIndex(x=>x.id===targetId);
      OBJS.objections.splice(mode==='before' ? ti : ti+1, 0, dragged);
    }
    applyIdChanges(changes);
    if(EDIT_SELECTED===draggedId) EDIT_SELECTED = dragged.id;
    markDirty('objs'); markDirty('scripts');
    renderEditor();
  });
}

          <li>Если блок не закрыт — в тексте появится предупреждение <code>⚠ Незакрытый блок</code>, содержимое не теряется.</li>
        </ul>
        <div class="help">Внутри блоков работают все подстановки переменных и inline-маркеры <code>\\!</code> / <code>\\!!</code>.</div>
      </div>

      <div class="card">
        <h3>↩ Перенос строки</h3>
