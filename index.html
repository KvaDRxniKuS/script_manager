        ${ex('"text": "Первая строка.\\nВторая строка.\\n\\nС пустой строкой между."')}
        <div class="help">В редакторе (textarea) — просто жми Enter, переносы сохранятся.</div>
      </div>

      <div class="card">
        <h3>🟡 Inline-выделение</h3>
        <p>Чтобы выделить кусок текста цветом — оберни его маркерами:</p>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="text-align:left;color:var(--muted);font-size:12px">
            <th style="padding:4px 8px">Запись</th><th style="padding:4px 8px">Результат</th></tr></thead>
          <tbody>
            <tr><td style="padding:4px 8px"><code>\\! пометка \\!</code></td>
              <td style="padding:4px 8px"><mark class="mk-blue">пометка</mark> (синее)</td></tr>
            <tr><td style="padding:4px 8px"><code>\\!! важно \\!!</code></td>
              <td style="padding:4px 8px"><mark class="mk-yellow">важно</mark> (жёлтое, жирное)</td></tr>
          </tbody>
        </table>
        <h4 style="margin:8px 0 4px;font-size:13px">Пример</h4>
        ${ex('Напоминаю: занятие \\!завтра в 18:00\\!. \\n\\nЕсли отмена — \\!!предупредите минимум за час\\!!.')}
        <div class="help">Маркеры можно ставить внутри сворачиваемых блоков и в подстановках. Скрытые символы <code>\\!</code> и <code>\\!!</code> в отображаемом тексте не показываются.</div>
      </div>

      <div class="card">
        <h3>📋 Копируемые блоки (одним кликом)</h3>
        <p>Оберни кусок текста в <code>\%</code>…<code>\%</code> — получится зелёная кликабельная плашка. ЛКМ в любом месте блока копирует его содержимое в буфер обмена.</p>
        ${ex('Номер телефона родителя: \\%+7 (999) 123-45-67\\%.\\nПароль от ЛК: \\%school2024\\%.')}
        <p>В режиме «Работа» блок выглядит как зелёная плашка с иконкой. При клике на миг подсвечивается и показывается надпись «Скопировано!».</p>
        <ul style="margin:4px 0;padding-left:20px;color:var(--muted);font-size:13px">
          <li>Синтаксис с <b>обратным слэшем</b>: <code>\%текст\%</code>. Бэкслеш перед <code>%</code> нужен, чтобы обычные проценты в тексте («скидка 20%», «100% гарантия») не превращались в блоки.</li>
          <li>Внутри блоков работают подстановки переменных и цветовое выделение <code>\\!</code> / <code>\\!!</code> — в буфер копируется уже вычисленный чистый текст (без разметки).</li>
          <li>Работает в модулях, возражениях и на кнопках.</li>
          <li>Если блок расположен прямо на кнопке — клик по блоку копирует текст и не нажимает кнопку; клик мимо блока нажимает кнопку как обычно.</li>
        </ul>
      </div>

      <div class="card">
        <h3>🔗 Ссылки на возражения</h3>
        <p>Прямо в тексте реплики можно вставить ссылку на возражение. Оператор кликает — справа открывается карточка этого возражения с готовым ответом. Формат: <code>(текст-для-кнопки|ID_возражения)</code>.</p>
        ${ex('Если скажет «дорого» — (про рассрочку|dorogo).')}
        <p>В режиме «Работа» ссылка подчёркнута и кликабельна; клик не разворачивает карточку-модуль, а открывает возражение в правой панели.</p>
      </div>

      <div class="card">
        <h3>🔀 Условные блоки текста</h3>
        <p>Внутри текста можно показать разный кусок в зависимости от значения переменной:</p>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="text-align:left;color:var(--muted);font-size:12px">
            <th style="padding:4px 8px">Запись</th><th style="padding:4px 8px">Что делает</th></tr></thead>
          <tbody>
            <tr><td style="padding:4px 8px"><code>(условие)[текст если да]</code></td>
              <td style="padding:4px 8px">показать текст только если условие истинно</td></tr>
            <tr><td style="padding:4px 8px"><code>(условие)[если да:если нет]</code></td>
              <td style="padding:4px 8px">двоеточие разделяет ветки «да/нет»</td></tr>
          </tbody>
        </table>
        <h4 style="margin:8px 0 4px;font-size:13px">Примеры</h4>
        ${ex('(fav_subjects.length==0)[Любимых пока нет, но это поправимо.:Любимые: {fav_subjects}]')}
        ${ex('(class>=5)[Старшеклассник:Младшеклассник]')}
        ${ex('(mood==хорошее)[Отлично! Продолжаем.](mood==плохое)[Понимаю, бывает.]')}
        ${ex('(class>=5)[(mood==хорошее)[Старший в духе:Старший, но устал]:Младший]')}
        <div class="help">Вложенность не ограничена. Условия — те же, что в <code>if</code>/<code>showIf</code>: см. карточку ниже. Двоеточия в обычном тексте (например «18:00») не путаются с разделителем — учитывается только верхний уровень квадратных скобок.</div>
      </div>

      <div class="card">
        <h3>❓ Условия (для <code>if</code>, <code>showIf</code>, <code>branch</code> и условных блоков)</h3>
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="text-align:left;color:var(--muted);font-size:12px">
            <th style="padding:4px 8px">Запись</th><th style="padding:4px 8px">Значение</th></tr></thead>
          <tbody>
            <tr><td style="padding:4px 8px"><code>var</code></td><td style="padding:4px 8px">переменная не пуста</td></tr>
            <tr><td style="padding:4px 8px"><code>!var</code></td><td style="padding:4px 8px">переменная пуста</td></tr>
            <tr><td style="padding:4px 8px"><code>class==5</code></td><td style="padding:4px 8px">равно (число)</td></tr>
            <tr><td style="padding:4px 8px"><code>mood==хорошее</code></td><td style="padding:4px 8px">равно (строка/enum — без кавычек)</td></tr>
            <tr><td style="padding:4px 8px"><code>mood!=плохое</code></td><td style="padding:4px 8px">не равно</td></tr>
            <tr><td style="padding:4px 8px"><code>class&gt;=5</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&lt;</code></td><td style="padding:4px 8px">числовые сравнения</td></tr>
            <tr><td style="padding:4px 8px"><code>list.length&gt;0</code></td><td style="padding:4px 8px">длина массива/map/строки</td></tr>
            <tr><td style="padding:4px 8px"><code>list.count==0</code></td><td style="padding:4px 8px">то же, синоним <code>.length</code></td></tr>
            <tr><td style="padding:4px 8px"><code>grades.математика&gt;=4</code></td><td style="padding:4px 8px">значение из map по литеральному ключу</td></tr>
            <tr><td style="padding:4px 8px"><code>a &amp;&amp; b</code></td><td style="padding:4px 8px">И</td></tr>
            <tr><td style="padding:4px 8px"><code>a || b</code></td><td style="padding:4px 8px">ИЛИ</td></tr>
            <tr><td style="padding:4px 8px"><code>class&gt;=5 &amp;&amp; mood==хорошее</code></td><td style="padding:4px 8px">комбинация</td></tr>
          </tbody>
        </table>
        <div class="help">Скобки поддерживаются для группировки: <code>(a || b) &amp;&amp; c</code>, также работает отрицание <code>!(a || b)</code>. Приоритет: <code>&amp;&amp;</code> сильнее <code>||</code>. Для проверки нескольких вариантов можно писать <code>device_type == (ноутбук || компьютер)</code> или <code>device_type in (ноутбук, компьютер)</code>. Если условие не понято — оно вернёт <b>false</b> (не показать), чтобы было видно ошибку.</div>
      </div>

      <div class="card">
        <h3>🎲 Несколько вариантов одного текста</h3>
        <p>Если <code>text</code> — массив строк, при каждом заходе в модуль случайно выбирается один:</p>
        ${ex('"text": [\n  "Добрый день, {client_name}!",\n  "Здравствуйте, {client_name}!"\n]')}
      </div>
    </div>`;
}

/* ---- ФОРМА МОДУЛЯ ---- */
function moduleOptionsHTML(selected){
  return ['<option value="">— не выбрано —</option>']
    .concat(Object.keys(DATA.modules).map(k=>{
      const sel = k===selected?'selected':'';
      return `<option value="${escHTML(k)}" ${sel}>${escHTML(DATA.modules[k].title||k)} (${escHTML(k)})</option>`;
    })).join('');
}
function renderModuleForm(id, m){
  const isBranch = Array.isArray(m.branch);
  const stageOpts = (DATA.stages||[]).map(s=>`<option value="${escHTML(s.id)}" ${m.stage===s.id?'selected':''}>${escHTML(s.title)} (${escHTML(s.id)})</option>`).join('');
  const root = document.getElementById('edForm');
  root.innerHTML = `
  <div class="form-with-palette">
    <div class="ed-form">
      <div class="card">
        <h3>Основное <span class="meta">id: <code>${escHTML(id)}</code></span>
          <button type="button" class="preview-link" id="previewModule" title="Открыть в режиме «Работа»">▶ В работе</button>
        </h3>
        <div class="row">
          <div>
            <label>id (внутреннее имя)</label>
            <input id="f_id" value="${escHTML(id)}">
            <div class="help">Меняем — все ссылки next/go/entry/start обновятся.</div>
          </div>
          <div>
            <label>Заголовок (title)</label>
            <input id="f_title" value="${escHTML(m.title||'')}">
          </div>
        </div>
        <div class="row">
          <div>
            <label>Этап (stage)</label>
            <select id="f_stage"><option value="">— не задан —</option>${stageOpts}</select>
          </div>
          <div>
            <label>Тип модуля</label>
            <select id="f_type">
              <option value="normal" ${!isBranch?'selected':''}>Обычный (текст + кнопки)</option>
              <option value="branch" ${isBranch?'selected':''}>Branch-роутер</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card" id="card-blocks" style="${isBranch?'display:none':''}">
        <h3>Содержимое модуля <span class="meta">блочная структура: текст / поле ввода / кнопки в любом порядке</span></h3>
        <div id="blocksList"></div>
        <div class="add-block-wrap" style="margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span style="color:var(--muted);font-size:12px">Добавить блок:</span>
          <button class="secondary small-btn" data-add-block="text">+ Текст</button>
          <button class="secondary small-btn" data-add-block="buttons">+ Интерактивный блок</button>
        </div>
      </div>

      <div class="card" id="card-branch" style="${isBranch?'':'display:none'}">
        <h3>Ветки роутера <span class="meta">первая истинная — срабатывает. Последняя без if = дефолт.</span></h3>
        <div id="branchList"></div>
        <button class="secondary small-btn" id="addBranch">+ Добавить ветку</button>
      </div>

      <div class="card">
        <div class="row">
          <button class="danger" id="delModule">🗑 Удалить модуль</button>
          <button class="secondary" id="duplicateModule">📋 Дублировать</button>
        </div>
      </div>
    </div>
    ${renderVarPalette()}
  </div>`;

  attachVarPaletteEvents(root);

  document.getElementById('previewModule').onclick = ()=>{
    setMode('work');
    go(id, true);
  };
  document.getElementById('f_id').onchange = e=>{
    const n = e.target.value.trim();
    if(!n||n===id) return;
    if(DATA.modules[n]){ alert('id уже существует'); e.target.value=id; return; }
    DATA.modules[n] = DATA.modules[id]; delete DATA.modules[id];
    Object.values(DATA.modules).forEach(mm=>{
      getButtons(mm).forEach(b=>{ if(b.next===id) b.next=n; });
      (mm.branch||[]).forEach(b=>{ if(b.go===id) b.go=n; });
    });
    (DATA.stages||[]).forEach(s=>{ if(s.entry===id) s.entry=n; });
    if(DATA.start===id) DATA.start=n;
    // обновим порядок
    if(Array.isArray(DATA.order)){
      const i = DATA.order.indexOf(id); if(i>=0) DATA.order[i]=n;
    }
    EDIT_SELECTED=n; markDirty('scripts'); renderEditor(); renderJump();
  };
  document.getElementById('f_title').oninput = e=>{ m.title=e.target.value; markDirty('scripts'); renderEdList(); };
  document.getElementById('f_stage').onchange = e=>{ m.stage = e.target.value || undefined; markDirty('scripts'); renderEdList(); renderStages(); };
  document.getElementById('f_type').onchange = e=>{
    if(e.target.value==='branch'){
      if(!Array.isArray(m.branch)) m.branch=[{if:'',go:''}];
      delete m.blocks;
    } else {
      delete m.branch;
      if(!Array.isArray(m.blocks)) m.blocks = [];
    }
    markDirty('scripts'); renderEditor();
  };

  if(!isBranch){
    renderBlocksList(m);
    root.querySelectorAll('[data-add-block]').forEach(btn=>{
      btn.onclick = ()=>{
        const type = btn.dataset.addBlock;
        const blocks = getBlocks(m);
        let newBlk;
        if(type==='text')       newBlk = {type:'text', text:''};
        else if(type==='buttons') newBlk = {type:'buttons', items:[]};
        if(newBlk){
          blocks.push(newBlk);
          markDirty('scripts');
          renderBlocksList(m);
          // прокрутить к новому блоку
          requestAnimationFrame(()=>{
            const list = document.getElementById('blocksList');
            const last = list?.lastElementChild;
            if(last){ last.scrollIntoView({block:'center', behavior:'smooth'}); }
          });
        }
      };
    });
  } else {
    renderBranchList(m);
    document.getElementById('addBranch').onclick = ()=>{
      m.branch.push({if:'', go:''}); markDirty('scripts'); renderBranchList(m);
    };
  }

  document.getElementById('delModule').onclick = ()=>{
    if(!confirm('Удалить модуль «'+(m.title||id)+'»?')) return;
    delete DATA.modules[id]; EDIT_SELECTED=null;
    if(Array.isArray(DATA.order)) DATA.order = DATA.order.filter(x=>x!==id);
    markDirty('scripts'); renderEditor(); renderJump();
  };
  document.getElementById('duplicateModule').onclick = ()=>{
    let n=id+'_copy', i=1; while(DATA.modules[n]) n=id+'_copy'+(++i);
    DATA.modules[n] = JSON.parse(JSON.stringify(m));
    DATA.modules[n].title = (m.title||id)+' (копия)';
    if(Array.isArray(DATA.order)){
      const i = DATA.order.indexOf(id);
      DATA.order.splice(i>=0?i+1:DATA.order.length, 0, n);
    }
    EDIT_SELECTED=n; markDirty('scripts'); renderEditor(); renderJump();
  };
}

/* === БЛОЧНЫЙ РЕДАКТОР МОДУЛЯ === */
function renderBlocksList(m){
  const root = document.getElementById('blocksList');
  if(!root) return;
  root.innerHTML = '';
  const blocks = getBlocks(m);
  if(!blocks.length){
    root.innerHTML = '<div class="empty" style="padding:12px;text-align:center">Модуль пустой — добавьте первый блок кнопками ниже.</div>';
    return;
  }
  blocks.forEach((blk, idx)=>{
    const card = document.createElement('div');
    card.className = 'mod-block mod-block-' + blk.type;
    card.dataset.blockIdx = idx;
    // Шапка с типом, перемещалкой, удалением
    const head = document.createElement('div');
    head.className = 'mod-block-head';
    const typeIcon = blk.type==='text' ? '📝' : blk.type==='buttons' ? '🔘' : '✍';
    const typeLabel = blk.type==='text' ? 'Текст' : blk.type==='buttons' ? 'Интерактивный блок' : 'Поле ввода';
    head.innerHTML = `
      <span class="dnd-grip" title="Перетащить">⋮⋮</span>
      <span class="mod-block-type">${typeIcon} ${typeLabel}</span>
      <span class="mod-block-idx">#${idx+1}</span>
      <span style="flex:1"></span>
      <button class="secondary small-btn mb-up" ${idx===0?'disabled':''} title="Выше">↑</button>
      <button class="secondary small-btn mb-down" ${idx===blocks.length-1?'disabled':''} title="Ниже">↓</button>
      <button class="danger-btn mb-del" title="Удалить блок">✕</button>`;
    card.appendChild(head);
    // Тело — зависит от типа
    const body = document.createElement('div');
    body.className = 'mod-block-body';
    if(blk.type==='text')         renderTextBlockBody(body, m, blk);
    else if(blk.type==='buttons') renderButtonsBlockBody(body, m, blk);
    card.appendChild(body);
    // Кнопки управления
    head.querySelector('.mb-up').onclick = ()=>{
      if(idx===0) return;
      [blocks[idx-1], blocks[idx]] = [blocks[idx], blocks[idx-1]];
      markDirty('scripts'); renderBlocksList(m);
    };
    head.querySelector('.mb-down').onclick = ()=>{
      if(idx===blocks.length-1) return;
      [blocks[idx+1], blocks[idx]] = [blocks[idx], blocks[idx+1]];
      markDirty('scripts'); renderBlocksList(m);
    };
    head.querySelector('.mb-del').onclick = ()=>{
      const label = blk.type==='text' ? 'текст' : blk.type==='input' ? 'поле ввода' : 'кнопки';
      if(!confirm('Удалить блок «'+label+'» #'+(idx+1)+'?')) return;
      blocks.splice(idx, 1);
      markDirty('scripts'); renderBlocksList(m);
    };
    root.appendChild(card);
  });
  attachListDnD(root, {
    itemSelector: '.mod-block',
    handleSelector: '.dnd-grip',
    getArr: ()=>blocks,
    onReorder: ()=>{ markDirty('scripts'); renderBlocksList(m); }
  });
}

function renderTextBlockBody(root, m, blk){
  // Поддерживаем массив вариантов: если уже массив — показываем все, иначе один textarea.
  const variants = Array.isArray(blk.text) ? blk.text : [blk.text || ''];
  const list = document.createElement('div'); list.className='text-variants';
  variants.forEach((v, i)=>{
    const wrap = document.createElement('div'); wrap.className='variant';
    const ta = document.createElement('textarea'); ta.rows=3; ta.value = v;
    ta.oninput = ()=>{
      if(Array.isArray(blk.text)) blk.text[i] = ta.value;
      else blk.text = ta.value;
      markDirty('scripts');
    };
    wrap.appendChild(ta);
    if(variants.length > 1){
      const del = document.createElement('button'); del.className='danger-btn'; del.textContent='✕';
      del.title = 'Удалить этот вариант';
      del.onclick = ()=>{
        blk.text.splice(i, 1);
        if(blk.text.length === 1) blk.text = blk.text[0];
        markDirty('scripts'); renderBlocksList(m);
      };
      wrap.appendChild(del);
    }
    list.appendChild(wrap);
  });
  root.appendChild(list);
  // Кнопка «+ ещё вариант»
  const addVar = document.createElement('button');
  addVar.className = 'secondary small-btn';
  addVar.textContent = '+ ещё вариант (случайный выбор)';
  addVar.style.marginTop = '4px';
  addVar.onclick = ()=>{
    if(typeof blk.text === 'string') blk.text = [blk.text, ''];
    else if(Array.isArray(blk.text)) blk.text.push('');
    else blk.text = ['', ''];
    markDirty('scripts'); renderBlocksList(m);
  };
  root.appendChild(addVar);
}

function renderButtonsBlockBody(root, m, blk){
  if(!Array.isArray(blk.items)) blk.items = [];
  const list = document.createElement('div'); list.id = 'buttonsListBlock_' + (blk.__uid = blk.__uid || (Math.random().toString(36).slice(2,9)));
  root.appendChild(list);
  renderButtonsItemsList(list, m, blk);
  // Две кнопки добавления — кнопка или поле ввода
  const addRow = document.createElement('div');
  addRow.style.cssText = 'display:flex;gap:6px;margin-top:6px;flex-wrap:wrap';
  const addBtn = document.createElement('button');
  addBtn.className='secondary small-btn'; addBtn.textContent='+ Кнопка';
  addBtn.onclick = ()=>{
    blk.items.push({kind:'button', label:'Новая кнопка', next:''});
    markDirty('scripts'); renderButtonsItemsList(list, m, blk);
  };
  const addInp = document.createElement('button');
  addInp.className='secondary small-btn'; addInp.textContent='+ Поле ввода';
  addInp.onclick = ()=>{
    blk.items.push({kind:'input', var:'', label:''});
    markDirty('scripts'); renderButtonsItemsList(list, m, blk);
  };
  addRow.appendChild(addBtn);
  addRow.appendChild(addInp);
  root.appendChild(addRow);
}

function objOptionsHTML(selected){
  return ['<option value="">— возражение —</option>']
    .concat((OBJS?.objections||[]).map(o=>{
      const sel = o.id===selected?'selected':'';
      return `<option value="${escHTML(o.id)}" ${sel}>${escHTML(o.title||o.id)} (${escHTML(o.id)})</option>`;
    })).join('');
}
function parentObjOptionsHTML(self){
  const {map} = buildObjTree();
  const opts = ['<option value="">— нет (корневое) —</option>'];
  (OBJS?.objections||[]).forEach(o=>{
    if(o.id===self.id) return;
    // нельзя выбрать своего потомка
    if(isAncestorOf(o.id, self.id, map)) return;
    const titles = pathTitlesOf(map[o.id]||{o,children:[]}, map).join(' / ');
    const sel = self.parent===o.id?'selected':'';
    opts.push(`<option value="${escHTML(o.id)}" ${sel}>${escHTML(titles)} (${escHTML(o.id)})</option>`);
  });
  return opts.join('');
}
function renderButtonsItemsList(root, m, blk){
  root.innerHTML='';
  const items = blk.items || (blk.items = []);
  const uid = blk.__uid;
  items.forEach((b,i)=>{
    if(!b || typeof b !== 'object'){ return; } // защита
    const kind = b.kind || 'button';
    // INPUT-ITEM: упрощённая карточка
    if(kind === 'input'){
      const card = document.createElement('div'); card.className='btn-card btn-card-input';
      const varsOpts = (DATA.variables||[])
        .map(v=>`<option value="${escHTML(v.id)}" ${b.var===v.id?'selected':''}>${escHTML(v.label||v.id)} (${escHTML(v.id)}, ${varTypeLabel(v)})</option>`).join('');
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span class="dnd-grip" title="Перетащить">⋮⋮</span>
          <b style="font-size:12px;color:var(--warn)">✍ Поле ввода #${i+1}</b>
        </div>
        <label>В какую переменную</label>
        <select class="i_var"><option value="">— выбери —</option>${varsOpts}</select>
        <label>Label (надпись над полем, опц.)</label>
        <input class="i_label" value="${escHTML(b.label||'')}" placeholder="${b.var ? escHTML(varDef(b.var)?.label||b.var) : ''}">
        <div class="btn-row">
          <button class="secondary small-btn moveUp"   ${i===0?'disabled':''}>↑</button>
          <button class="secondary small-btn moveDown" ${i===items.length-1?'disabled':''}>↓</button>
          <button class="danger-btn delBtn">✕ удалить</button>
        </div>`;
      root.appendChild(card);
      card.querySelector('.i_var').onchange = e=>{ b.var=e.target.value; markDirty('scripts'); renderButtonsItemsList(root, m, blk); };
      card.querySelector('.i_label').oninput = e=>{ b.label=e.target.value; markDirty('scripts'); };
      card.querySelector('.moveUp').onclick = ()=>{ [items[i-1],items[i]]=[items[i],items[i-1]]; markDirty('scripts'); renderButtonsItemsList(root, m, blk); };
      card.querySelector('.moveDown').onclick = ()=>{ [items[i+1],items[i]]=[items[i],items[i+1]]; markDirty('scripts'); renderButtonsItemsList(root, m, blk); };
      card.querySelector('.delBtn').onclick = ()=>{ items.splice(i,1); markDirty('scripts'); renderButtonsItemsList(root, m, blk); };

    }
    // BUTTON-ITEM (старая логика)
    const card = document.createElement('div'); card.className='btn-card';
    const action = b.end ? 'end' : (b.open_obj ? 'open_obj' : 'next');
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span class="dnd-grip" title="Перетащить для смены порядка">⋮⋮</span>
        <b style="font-size:12px;color:var(--muted)">Кнопка #${i+1}</b>
      </div>
      <label>Текст кнопки</label><input class="bf_label" value="${escHTML(b.label||'')}">
      <div class="row">
        <div>
          <label>Действие</label>
          <select class="bf_action">
            <option value="next"     ${action==='next'?'selected':''}>→ перейти к модулю</option>
            <option value="open_obj" ${action==='open_obj'?'selected':''}>⚠ открыть возражение</option>
            <option value="end"      ${action==='end'?'selected':''}>↺ завершить и начать заново</option>
          </select>
        </div>
        <div class="action-target">
          <label class="lbl-next">Модуль назначения (next)</label>
          <select class="bf_next" ${action!=='next'?'disabled':''}>${moduleOptionsHTML(b.next)}</select>
          <label class="lbl-obj" style="display:none">Какое возражение открыть</label>
          <select class="bf_open_obj" style="display:none">${objOptionsHTML(b.open_obj)}</select>
        </div>
      </div>
      <details>
        <summary>Условие if (показывать только если…)</summary>
        <input class="bf_if" placeholder="например: class>=5 && class<=8" value="${escHTML(b.if||'')}">
        <div class="help">См. Настройки → Синтаксис → «Условия».</div>
      </details>
      <details>
        <summary>Set — установить переменные кликом</summary>
        <div class="set-pairs" id="setPairs_${uid}_${i}"></div>
        <button class="secondary small-btn addSet">+ пара</button>
      </details>
      <div class="btn-row">
        <button class="secondary small-btn moveUp"   ${i===0?'disabled':''}>↑</button>
        <button class="secondary small-btn moveDown" ${i===items.length-1?'disabled':''}>↓</button>
        <button class="danger-btn delBtn">✕ удалить кнопку</button>
      </div>`;
    root.appendChild(card);
    card.querySelector('.bf_label').oninput = e=>{ b.label=e.target.value; markDirty('scripts'); };
    const actSel = card.querySelector('.bf_action');
    const nextSel = card.querySelector('.bf_next');
    const objSel  = card.querySelector('.bf_open_obj');
    const lblN    = card.querySelector('.lbl-next');
    const lblO    = card.querySelector('.lbl-obj');
    function updActionUI(v){
      if(v==='end'){
        b.end=true; delete b.next; delete b.open_obj;

        lblN.style.display=''; nextSel.style.display='';

        objSel.style.display=''; lblO.style.display='';

    nextSel.onchange = e=>{ b.next=e.target.value; markDirty('scripts'); };
    objSel.onchange  = e=>{ b.open_obj=e.target.value; markDirty('scripts'); };
    card.querySelector('.bf_if').oninput = e=>{ b.if=e.target.value||undefined; markDirty('scripts'); };
    renderSetPairs(b, uid+'_'+i);
    card.querySelector('.addSet').onclick = ()=>{ b.set=b.set||{}; b.set[''] = ''; markDirty('scripts'); renderSetPairs(b, uid+'_'+i); };
    card.querySelector('.moveUp').onclick = ()=>{ [items[i-1],items[i]]=[items[i],items[i-1]]; markDirty('scripts'); renderButtonsItemsList(root, m, blk); };
    card.querySelector('.moveDown').onclick = ()=>{ [items[i+1],items[i]]=[items[i],items[i+1]]; markDirty('scripts'); renderButtonsItemsList(root, m, blk); };
    card.querySelector('.delBtn').onclick = ()=>{ items.splice(i,1); markDirty('scripts'); renderButtonsItemsList(root, m, blk); };
  });
  attachListDnD(root, {

    handleSelector: '.dnd-grip',
    getArr: ()=>items,
    onReorder: ()=>{ markDirty('scripts'); renderButtonsItemsList(root, m, blk); }
  });
}
function renderSetPairs(b, idx){
  const root = document.getElementById('setPairs_'+idx);
  if(!root) return;
  root.innerHTML=''; if(!b.set) return;
  Object.entries(b.set).forEach(([k,v],pi)=>{
    const varsOpts = ['<option value="">— переменная —</option>']
      .concat((DATA.variables||[]).map(vv=>`<option value="${escHTML(vv.id)}" ${k===vv.id?'selected':''}>${escHTML(vv.label||vv.id)} [${varTypeLabel(vv)}]</option>`)).join('');
    const row = document.createElement('div'); row.className='pair';
    row.innerHTML = `<select class="setK">${varsOpts}</select>
      <div class="setV-holder" style="flex:1 1 200px;min-width:0"></div>
      <button class="danger-btn">✕</button>`;
    root.appendChild(row);
    const holder = row.querySelector('.setV-holder');
    rebuildSetV(holder, b, k, v, pi, idx);

    row.querySelector('.setK').onchange = e=>{
      const newK = e.target.value;
      const arr = Object.entries(b.set).map((p,ii)=>ii===pi?[newK,p[1]]:p);
      b.set = Object.fromEntries(arr); markDirty('scripts');
      // Перерисуем строку чтобы тип value подстроился
      renderSetPairs(b, idx);
    };
    row.querySelector('button').onclick = ()=>{
      const keys = Object.keys(b.set); delete b.set[keys[pi]];
      if(Object.keys(b.set).length===0) delete b.set;
      markDirty('scripts'); renderSetPairs(b, idx);
    };
  });
  // ✎ кнопки рядом с каждым selectом переменной
  attachVarEditLinksTo(root, 'select.setK');
}

function rebuildSetV(holder, b, varId, currentValue, pi, parentIdx){
  holder.innerHTML = '';
  const vd = varDef(varId);
  const fmt = vd ? varFormat(vd) : 'single';
  const t = vd ? varDataType(vd) : 'text';
  const writeBack = (newVal)=>{
    const keys = Object.keys(b.set); b.set[keys[pi]] = newVal; markDirty('scripts');
  };
  // Текущее состояние: или объект с op, или примитив (значит op="set")
  const isObjOp = currentValue && typeof currentValue === 'object' && !Array.isArray(currentValue) && currentValue.op;
  const currentOp = isObjOp ? currentValue.op : 'set';
  const currentVal = isObjOp ? currentValue.value : currentValue;

  // Селектор операции — всегда виден
  const opSel = document.createElement('select');
  opSel.style.flex = '0 0 auto';
  const opsByFmt = {
    single: [['set','= установить']],
    array:  [['set','= заменить'], ['add','+ добавить'], ['remove','− убрать']],
    map:    [['set','= заменить'], ['add','+ добавить ключи'], ['remove','− удалить ключи']]
  };
  // Для single text/number/bool добавим тоже add/remove
  if(fmt==='single' && (t==='text' || t==='number' || t==='bool')){
    const addLabel = t==='number'?'+ прибавить':(t==='bool'?'+ ИЛИ':'+ дописать');
    opsByFmt.single = [['set','= установить'], [ 'add', addLabel], ['remove','− сбросить']];
  } else if(fmt==='single' && t==='enum'){
    opsByFmt.single = [['set','= установить'], ['remove','− сбросить']];
  }
  const ops = opsByFmt[fmt] || opsByFmt.single;
  opSel.innerHTML = ops.map(([val,lbl])=>`<option value="${val}" ${currentOp===val?'selected':''}>${lbl}</option>`).join('');

  holder.style.display = 'flex'; holder.style.gap = '4px'; holder.style.flexWrap = 'wrap';
  holder.appendChild(opSel);

  const valWrap = document.createElement('div'); valWrap.style.flex='1 1 160px'; valWrap.style.minWidth='0';
  holder.appendChild(valWrap);

  function renderValueByOp(op){
    valWrap.innerHTML = '';
    // remove на single — сбрасывает к default, значение не нужно
    if(op==='remove' && fmt==='single'){
      valWrap.innerHTML = '<span class="help">сбросит к значению по умолчанию</span>';
      return;
    }
    // ARRAY of enum: мульти-чекбоксы по options
    if(fmt==='array' && t==='enum' && vd?.optionsFrom){
      const opts = getEnumOptions(vd.optionsFrom);
      const cur = Array.isArray(currentVal) ? currentVal.slice() : (currentVal ? [currentVal] : []);
      const box = document.createElement('div'); box.style.display='flex'; box.style.flexWrap='wrap'; box.style.gap='4px';
      opts.forEach(o=>{
        const lbl = document.createElement('label'); lbl.className='bool-toggle'; lbl.style.padding='2px 8px';
        lbl.style.border='1px solid var(--line)'; lbl.style.borderRadius='4px';
        const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = cur.includes(o);
        cb.onchange = ()=>{
          if(cb.checked){ if(!cur.includes(o)) cur.push(o); }
          else { const i = cur.indexOf(o); if(i>=0) cur.splice(i,1); }
          writeBack(op==='set' && cur.length===0 ? [] : {op, value: cur.slice()});
          // если op=='set', можно писать как простой массив:
          if(op==='set'){ writeBack(cur.slice()); }
        };
        lbl.appendChild(cb); lbl.appendChild(document.createTextNode(' '+o));
        box.appendChild(lbl);
      });
      valWrap.appendChild(box);
      return;
    }
    // ARRAY других типов или MAP — пока обычный value-инпут (одиночный) либо для add MAP — пары key:value
    if(fmt==='map' && (op==='add' || op==='set')){
      // value = объект {ключ: значение} — компактный редактор пар
      const cur = (currentVal && typeof currentVal==='object' && !Array.isArray(currentVal)) ? {...currentVal} : {};
      const list = document.createElement('div'); list.style.display='flex'; list.style.flexDirection='column'; list.style.gap='3px';
      const renderPairs = ()=>{
        list.innerHTML='';
        Object.entries(cur).forEach(([k,v])=>{
          const row = document.createElement('div'); row.style.display='flex'; row.style.gap='3px';
          const kI = document.createElement('input'); kI.type='text'; kI.placeholder='ключ'; kI.value=k; kI.style.flex='1';
          const vI = document.createElement('input'); vI.type='text'; vI.placeholder='значение'; vI.value=v==null?'':v; vI.style.flex='1';
          const del = document.createElement('button'); del.className='danger-btn'; del.textContent='✕';
          kI.onchange = ()=>{ if(!kI.value){ kI.value=k; return; } cur[kI.value]=cur[k]; delete cur[k]; writeBack(op==='set'?cur:{op,value:cur}); renderPairs(); };
          vI.oninput = ()=>{ cur[k]=vI.value; writeBack(op==='set'?cur:{op,value:cur}); };
          del.onclick = ()=>{ delete cur[k]; writeBack(op==='set'?cur:{op,value:cur}); renderPairs(); };
          row.appendChild(kI); row.appendChild(vI); row.appendChild(del);
          list.appendChild(row);
        });
        const add = document.createElement('button'); add.className='secondary small-btn'; add.textContent='+ пара';
        add.onclick = ()=>{ let i=1; while(cur['ключ'+i]!==undefined) i++; cur['ключ'+i]=''; writeBack(op==='set'?cur:{op,value:cur}); renderPairs(); };
        list.appendChild(add);
      };
      renderPairs();
      valWrap.appendChild(list);
      return;
    }
    if(fmt==='map' && op==='remove'){
      // value = массив ключей (или строка-один ключ)
      const inp = document.createElement('input'); inp.type='text';
      inp.placeholder='ключи через запятую';
      inp.value = Array.isArray(currentVal) ? currentVal.join(', ') : (currentVal||'');
      inp.oninput = ()=>{
        const arr = inp.value.split(',').map(s=>s.trim()).filter(Boolean);
        writeBack({op, value: arr});
      };
      valWrap.appendChild(inp);
      return;
    }
    // ARRAY (не enum) / single — простое поле
    renderPlainValueInput(valWrap, vd, currentVal, (nv)=>{
      if(op==='set' && fmt==='single') writeBack(nv);
      else writeBack({op, value: nv});
    });
  }

  opSel.onchange = ()=>{
    const op = opSel.value;
    // При смене операции либо переходим в op-объект, либо в чистое значение
    if(op==='set'){
      if(fmt==='single') writeBack(currentVal==null?'':currentVal);
      else writeBack(currentVal||(fmt==='array'?[]:{}));
    } else {
      writeBack({op, value: currentVal});
    }
    renderValueByOp(op);
  };
  renderValueByOp(currentOp);
}

/* Рисует один input в соответствии с типом переменной (для значения set/op-value). */
function renderPlainValueInput(holder, vd, currentValue, onChange, forceType){
  holder.innerHTML = '';
  const t = forceType || (vd ? varDataType(vd) : 'text');
  if(!vd && !forceType){
    // переменная не выбрана — обычный input
    const inp = document.createElement('input'); inp.type='text';
    inp.placeholder='значение или {выражение}';
    inp.value = currentValue==null?'':currentValue;
    inp.oninput = ()=>onChange(inp.value);
    holder.appendChild(inp); return;
  }
  if(t==='bool'){
    const sel = document.createElement('select');
    sel.innerHTML = `<option value="">— —</option><option value="true" ${String(currentValue)==='true'?'selected':''}>да (true)</option><option value="false" ${String(currentValue)==='false'?'selected':''}>нет (false)</option>`;
    sel.onchange = ()=>onChange(sel.value);
    holder.appendChild(sel);
  } else if(t==='number'){
    const inp = document.createElement('input'); inp.type='text';
    inp.placeholder='число или выражение, напр. {class}+1';
    inp.value = currentValue==null?'':currentValue;
    inp.oninput = ()=>onChange(inp.value);
    holder.appendChild(inp);
  } else if(t==='enum'){
    const sel = document.createElement('select');
    const opts = getEnumOptions(vd.id);
    sel.innerHTML = '<option value="">— выбери —</option>' +
      opts.map(o=>`<option value="${escHTML(o)}" ${String(currentValue)===String(o)?'selected':''}>${escHTML(o)}</option>`).join('');
    sel.onchange = ()=>onChange(sel.value);
    holder.appendChild(sel);
  } else {
    const inp = document.createElement('input'); inp.type='text';
    inp.placeholder='значение или {выражение}';
    inp.value = currentValue==null?'':currentValue;
    inp.oninput = ()=>onChange(inp.value);
    holder.appendChild(inp);
  }
}

    itemSelector: '.branch-card',
    handleSelector: '.dnd-grip',

        <div id="oBtnsList"></div>

      </div>
      <div class="card">
        <div class="row">
          <button class="danger" id="oDel">🗑 Удалить возражение</button>
          <button class="secondary" id="oDup">📋 Дублировать</button>
        </div>
      </div>
    </div>
    ${renderVarPalette()}
  </div>`;
  attachVarPaletteEvents(root);
  document.getElementById('previewObj').onclick = ()=>{
    setMode('work');
    // Открыть вкладку «Возражения» и показать карточку
    CURRENT_OBJ = o.id;
    document.querySelectorAll('#workView .tab').forEach(x=>x.classList.remove('active'));
    document.querySelector('#workView .tab[data-tab="obj"]').classList.add('active');
    document.getElementById('tab-hist').style.display='none';
    document.getElementById('tab-obj').style.display='';
    renderObjList(); renderObjCard();
  };
  document.getElementById('of_leaf').onchange = e=>{
    let newLeaf = e.target.value.trim();
    if(!newLeaf){ e.target.value = leafIdOf(o.id, o.parent||''); return; }
    if(newLeaf.includes(ID_SEP)) newLeaf = newLeaf.split(ID_SEP).pop();
    const parentFull = o.parent || '';
    const candidate = makeFullId(newLeaf, parentFull);
    if(candidate===o.id) return;
    if(fullIdExists(candidate, o.id)){
      alert('Возражение с полным id «'+candidate+'» уже существует.');
      e.target.value = leafIdOf(o.id, parentFull);
      return;
    }
    const changes = renameObjectionTree(o, candidate);
    applyIdChanges(changes);
    EDIT_SELECTED = o.id;
    markDirty('objs'); markDirty('scripts');
    renderEditor();
  };
  document.getElementById('of_title').oninput = e=>{ o.title=e.target.value; markDirty('objs'); renderEdList(); };
  document.getElementById('of_tags').oninput = e=>{ o.tags=e.target.value.split(',').map(s=>s.trim()).filter(Boolean); markDirty('objs'); };
  document.getElementById('of_parent').onchange = e=>{
    const oldParentId = o.parent || '';
    const newParentId = e.target.value || '';
    if(oldParentId===newParentId) return;
    const leaf = leafIdOf(o.id, oldParentId);   // короткое имя возражения
    o.parent = newParentId || undefined;
    const uniqueLeaf = suggestUniqueLeaf(leaf, newParentId, o.id);
    const newFullId = makeFullId(uniqueLeaf, newParentId);
    const changes = renameObjectionTree(o, newFullId);
    applyIdChanges(changes);
    EDIT_SELECTED = o.id;
    markDirty('objs'); markDirty('scripts');
    renderEditor();
  };
  function renderOText(){
    const root2 = document.getElementById('otextVariants'); root2.innerHTML='';
    const variants = Array.isArray(o.text)?o.text:[o.text||''];
    variants.forEach((v,i)=>{
      const w = document.createElement('div'); w.className='variant';
      w.innerHTML = `<textarea rows="3">${escHTML(v)}</textarea>${variants.length>1?'<button class="danger-btn">✕</button>':''}`;
      w.querySelector('textarea').oninput = e=>{
        if(Array.isArray(o.text)) o.text[i]=e.target.value; else o.text=e.target.value;
        markDirty('objs');
      };
      if(variants.length>1){
        w.querySelector('button').onclick = ()=>{
          o.text.splice(i,1); if(o.text.length===1) o.text=o.text[0]; markDirty('objs'); renderOText();
        };
      }
      root2.appendChild(w);
    });
  }
  renderOText();
  document.getElementById('oAddVariant').onclick = ()=>{
    if(typeof o.text==='string') o.text=[o.text||'',''];
    else if(Array.isArray(o.text)) o.text.push('');
    else o.text=['',''];
    markDirty('objs'); renderOText();
  };
  function renderOBtns(){
    const root2 = document.getElementById('oBtnsList'); root2.innerHTML='';
    (o.buttons||[]).forEach((b,i)=>{
      const card = document.createElement('div'); card.className='btn-card';
      card.innerHTML = `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span class="dnd-grip" title="Перетащить">⋮⋮</span>
          <b style="font-size:12px;color:var(--muted)">Аргумент #${i+1}</b>
        </div>
        <div class="row">
          <div><label>Текст</label><input class="bf_label" value="${escHTML(b.label||'')}"></div>
          <div><label>Перейти к (goto)</label><select class="bf_goto">${objOpts}</select></div>
        </div>
        <div class="btn-row">
          <button class="secondary small-btn moveUp" ${i===0?'disabled':''}>↑</button>
          <button class="secondary small-btn moveDown" ${i===o.buttons.length-1?'disabled':''}>↓</button>
          <button class="danger-btn delBtn">✕</button>
        </div>`;
      card.querySelector('.bf_goto').value = b.goto||'';
      card.querySelector('.bf_label').oninput = e=>{ b.label=e.target.value; markDirty('objs'); };
      card.querySelector('.bf_goto').onchange = e=>{ b.goto=e.target.value; markDirty('objs'); };
      card.querySelector('.moveUp').onclick = ()=>{ [o.buttons[i-1],o.buttons[i]]=[o.buttons[i],o.buttons[i-1]]; markDirty('objs'); renderOBtns(); };
      card.querySelector('.moveDown').onclick = ()=>{ [o.buttons[i+1],o.buttons[i]]=[o.buttons[i],o.buttons[i+1]]; markDirty('objs'); renderOBtns(); };
      card.querySelector('.delBtn').onclick = ()=>{ o.buttons.splice(i,1); markDirty('objs'); renderOBtns(); };
      root2.appendChild(card);
    });
    attachListDnD(root2, {
      itemSelector: '.btn-card',
      handleSelector: '.dnd-grip',
      getArr: ()=>o.buttons,
      onReorder: ()=>{ markDirty('objs'); renderOBtns(); }
    });
  }
  renderOBtns();
  document.getElementById('oAddBtn').onclick = ()=>{
    o.buttons = o.buttons||[]; o.buttons.push({label:'Новый аргумент', goto:''});
    markDirty('objs'); renderOBtns();
  };
  document.getElementById('oDel').onclick = ()=>{
    if(!confirm('Удалить возражение? Его дочерние возражения станут детьми его родителя (с пересчётом id).')) return;
    const newParentForChildren = o.parent || '';
    const oldId = o.id;
    // Сначала собрать прямых детей
    const directKids = (OBJS.objections||[]).filter(x=>x.parent===oldId);
    // Каждому ребёнку пересчитать id (вместе с его потомками)
    const allChanges = [];
    directKids.forEach(k=>{
      const leaf = leafIdOf(k.id, oldId);
      const uniqueLeaf = suggestUniqueLeaf(leaf, newParentForChildren, k.id);
      const newFullId = makeFullId(uniqueLeaf, newParentForChildren);
      k.parent = newParentForChildren || undefined;
      allChanges.push(...renameObjectionTree(k, newFullId));
    });
    // Удаляем сам узел
    OBJS.objections = OBJS.objections.filter(x=>x.id!==oldId);
    // Обнуляем goto на удалённый узел
    (OBJS.objections||[]).forEach(x=>(x.buttons||[]).forEach(b=>{ if(b.goto===oldId) b.goto=''; }));
    Object.values(DATA.modules||{}).forEach(m=>{
      getButtons(m).forEach(b=>{ if(b.open_obj===oldId) b.open_obj=''; });
    });
    // Применяем переименования
    applyIdChanges(allChanges);
    EDIT_SELECTED=null;
    markDirty('objs'); markDirty('scripts'); renderEditor();
  };
  document.getElementById('oDup').onclick = ()=>{
    const parentFull = o.parent || '';
    const leaf = leafIdOf(o.id, parentFull);
    const uniqueLeaf = suggestUniqueLeaf(leaf+'_copy', parentFull, null);
    const newFullId = makeFullId(uniqueLeaf, parentFull);
    const c = JSON.parse(JSON.stringify(o));
    c.id = newFullId;
    c.title = (o.title||o.id)+' (копия)';
    // вставим сразу после оригинала
    const idx = OBJS.objections.findIndex(x=>x.id===o.id);
    OBJS.objections.splice(idx+1, 0, c);
    EDIT_SELECTED=newFullId; markDirty('objs'); renderEditor();
  };
}

function setBkLog(msg){ const el = document.getElementById('bkLog'); if(el) el.textContent = msg; }
async function renderFilesStatus(){
  const rootS = document.getElementById('filesStatusScripts');
  const rootO = document.getElementById('filesStatusObjs');
  const rootC = document.getElementById('filesStatusCalls');
  const dir = await getBackupDirHandle().catch(()=>null);

  async function info(handle){
    if(!handle) return {ok:false};
    try{
      const perm = await handle.queryPermission({mode:'readwrite'}).catch(()=>null);
      const file = await handle.getFile();
      return {ok:true, name:handle.name||'?', size:file.size, perm};
    }catch(e){ return {ok:true, name:handle.name||'?', error:e.message}; }
  }
  const fmt = (i, kind)=> !i.ok
    ? '<span style="color:var(--warn)">не привязан</span>'
    : `<b style="color:${i.error?'var(--bad)':'var(--ok)'}">${i.error?'⚠':'✓'} ${escHTML(i.name)}</b>`
       + (i.size!==undefined?` <span class="help" style="display:inline">(${i.size} байт, права: ${i.perm||'?'})</span>`:'')
       + (i.error?` <span style="color:var(--bad)">${escHTML(i.error)}</span>`:'')
       + ` <button class="danger-btn" onclick="unbindHandle('${kind}')">отвязать</button>`;

  if(rootS){
    const sInfo = await info(SCRIPTS_HANDLE);
    const inMem = `<span class="help" style="display:inline">в памяти: ${Object.keys(DATA.modules||{}).length} модулей, ${(DATA.variables||[]).length} переменных</span>`;
    rootS.innerHTML = `<div>Файл: ${fmt(sInfo,'scripts')}</div><div style="margin-top:4px">${inMem}</div>`;
  }
  if(rootO){
    const oInfo = await info(OBJECTIONS_HANDLE);
    const inMem = `<span class="help" style="display:inline">в памяти: ${(OBJS.objections||[]).length} возражений</span>`;
    rootO.innerHTML = `<div>Файл: ${fmt(oInfo,'objs')}</div><div style="margin-top:4px">${inMem}</div>`;
  }
  if(rootC){
    const cInfo = await info(CALLS_HANDLE);
    const inMem = `<span class="help" style="display:inline">в памяти: ${(CALLS.items||[]).length} перезвонов</span>`;
    rootC.innerHTML = `<div>Файл: ${fmt(cInfo,'calls')}</div><div style="margin-top:4px">${inMem}</div>`;
  }

  const dInfo = document.getElementById('bkDirInfo');
  if(dInfo){
    dInfo.innerHTML = dir
      ? `<span style="color:var(--ok)">✓ ${escHTML(dir.name)}</span>`
      : `<span style="color:var(--muted)">не выбрана — бэкапы будут скачиваться в загрузки браузера</span>`;
  }
}
async function unbindHandle(kind){
  const label = kind==='objs' ? 'возражений' : (kind==='calls' ? 'перезвонов' : 'скриптов');
  if(!confirm('Отвязать файл '+label+'? Содержимое в памяти останется, автосохранение этого файла прекратится.')) return;
  if(kind==='objs'){
    OBJECTIONS_HANDLE = null;
    try{ await idbDel('objections_handle'); }catch(e){}
  } else if(kind==='calls'){
    CALLS_HANDLE = null;
    try{ await idbDel('calls_handle'); }catch(e){}
  } else {
    SCRIPTS_HANDLE = null;
    try{ await idbDel('scripts_handle'); }catch(e){}
  }
  if(!SCRIPTS_HANDLE && !OBJECTIONS_HANDLE && !CALLS_HANDLE) AUTOSAVE_ARMED = false;
  updateSaveBtn(); updateRestoreBtn(); renderFilesStatus();
}
window.openHandleAndInit = openHandleAndInit;
window.unbindHandle = unbindHandle;
async function openHandleAndInit(kind){
  if(!hasFSA){ alert('Только Chrome/Edge. В других браузерах — кнопкой «📂 Открыть свой…» в режиме «Работа», сохранение будет через скачивание.'); return; }
  kind = kind || 'scripts';
  try{
    const sug = kind==='objs' ? 'objections.json' : 'scripts.json';
    const {handle, data} = await openFileWithHandle(sug);
    if(kind==='objs'){
      OBJECTIONS_HANDLE = handle;
      OBJS = data || {};
      ensureDataShape();
      // Если переменные ещё не были загружены — applyDefaults уже сделано в init.
      DIRTY.objs = false;
      try{ await idbSet('objections_handle', handle); }catch(e){}
      renderObjList(); renderObjCard();
      if(EDIT_TAB==='objs') renderEditor();
    } else {
      SCRIPTS_HANDLE = handle;
      // Если в загружаемом scripts-файле есть objections — это старый объединённый формат.
      // Решаем что делать с возражениями.
      let useObjs = OBJS;
      if(Array.isArray(data?.objections) && data.objections.length>0){
        const haveOurObjs = (OBJS.objections||[]).length>0;
        if(!OBJECTIONS_HANDLE){
          if(haveOurObjs){
            const useFromFile = confirm('В этом файле скриптов есть встроенные возражения ('+data.objections.length+' шт).\n\nOK — взять их (текущие '+OBJS.objections.length+' возражения будут заменены)\nОтмена — оставить текущие');
            if(useFromFile) useObjs = {objections: data.objections};
          } else {
            useObjs = {objections: data.objections};
          }
          alert('У возражений нет привязки к отдельному файлу.\nПри сохранении они НЕ запишутся! Подключи файл возражений: Настройки → Файлы → Открыть файл возражений.');
        } else if(haveOurObjs){
          // Есть отдельный файл возражений — игнорируем встроенные
          console.warn('[load] игнорирую встроенные objections в scripts (используется отдельный файл возражений)');
        }
      }
      initAll(data, useObjs);
      DIRTY.scripts = false;
    }
    AUTOSAVE_ARMED = true;
    try{ await idbSet(kind==='objs'?'objections_handle':'scripts_handle', handle); }catch(e){}
    updateSaveBtn(); updateRestoreBtn(); renderFilesStatus();
    showSaveState('✓ файл '+(kind==='objs'?'возражений':'скриптов')+' подключён, автосохранение активно', false);
  }catch(e){ if(e.name!=='AbortError') alert('Ошибка: '+e.message); }
}

/* Тип данных: text/number/bool. Формат данных: single / map / enum. */
/* ===== Типы и форматы переменных =====
   Тип данных:  text | number | bool | enum
   Формат:      single | array | map
   Любая комбинация. enum-переменная имеет options[] или optionsFrom (ссылка).
   array имеет valueType (для enum → optionsFrom).
   map  имеет keyType (text|enum), valueType, keys[]/keysFrom (для enum-ключей). */

function varDataType(v){
  // Новый формат — берём как есть
  if(v.type==='text' || v.type==='number' || v.type==='bool' || v.type==='enum') return v.type;
  // Legacy: type==='map' → возвращаем valueType
  if(v.type==='map') return v.valueType || 'text';
  return 'text';
}
function varFormat(v){
  if(v.format==='single' || v.format==='array' || v.format==='map') return v.format;
  // Legacy: type==='map' без format
  if(v.type==='map') return 'map';
  return 'single';
}
function setVarDataType(v, t){
  v.type = t;
  if(t!=='enum'){
    // enum-specific поля чистим
    if(varFormat(v)==='single') delete v.options;
    delete v.optionsFrom;
    delete v.optionsFromIf;
  }
}
function setVarFormat(v, fmt){
  const prevFmt = varFormat(v);
  const prevDataType = varDataType(v);
  v.format = fmt;
  if(fmt==='single'){
    delete v.keys; delete v.keysFrom; delete v.keyType;
    // При переходе array/map → single: переносим тип элементов в v.type
    if(prevFmt!=='single' && v.valueType){
      v.type = v.valueType;
    }
    delete v.valueType;
    if(varDataType(v)==='enum'){
      if(!Array.isArray(v.options) && !v.optionsFrom && !Array.isArray(v.optionsFromIf)) v.options=[];
    } else {
      delete v.options; delete v.optionsFrom; delete v.optionsFromIf;
    }
    if(v.default===undefined) v.default = varDataType(v)==='bool' ? 'false' : '';
  } else if(fmt==='array'){
    // При переходе single → array: переносим v.type в valueType (наследование выбранного типа)
    if(prevFmt==='single'){
      v.valueType = prevDataType;
    } else if(!v.valueType){
      v.valueType = 'text';
    }
    delete v.keys; delete v.keysFrom; delete v.keyType;
    delete v.default;
    delete v.options;
    if(v.valueType!=='enum'){ delete v.optionsFrom; delete v.optionsFromIf; }
  } else if(fmt==='map'){
    if(!v.keyType) v.keyType = 'text';
    // При переходе single → map: переносим v.type в valueType
    if(prevFmt==='single'){
      v.valueType = prevDataType;
    } else if(!v.valueType){
      v.valueType = 'text';
    }
    delete v.default;
    delete v.options;
    if(v.valueType!=='enum'){ delete v.optionsFrom; delete v.optionsFromIf; }
    if(v.keyType!=='enum') delete v.keysFrom;
  }
}
function varTypeLabel(v){
  const t = varDataType(v); const f = varFormat(v);
  const tn = {text:'строка',number:'число',bool:'да/нет',enum:'enum'}[t]||t;
  if(f==='single'){
    if(t==='enum' && Array.isArray(v.optionsFromIf)) return 'enum:по условию';
    if(t==='enum' && v.optionsFrom) return `enum:${v.optionsFrom}`;
    return tn;
  }
  if(f==='array'){
    const inner = v.valueType==='enum' ? `enum:${v.optionsFrom||'?'}` : (v.valueType||t);
    return `array<${inner}>`;
  }
  if(f==='map'){
    const k = v.keyType==='enum' ? `enum:${v.keysFrom||'?'}` : 'string';
    const val = v.valueType==='enum' ? `enum:${v.optionsFrom||'?'}` : (v.valueType||'text');
    return `map<${k}→${val}>`;
  }
  return tn;
}

/* Список вариантов enum-переменной по её optionsFrom или собственным options.
   Защита от циклов: visited-set. */
function getEnumOptions(varId, _visited){
  const v = varDef(varId);
  if(!v) return [];
  const visited = _visited || new Set();
  if(visited.has(varId)){
    console.warn('Цикл в optionsFrom:', [...visited, varId].join(' → '));
    return [];
  }
  visited.add(varId);
  // Динамический enum-источник: первый истинный if выбирает другой enum-справочник
  // (from) ИЛИ прямой список вариантов (options).
  // Формат: optionsFromIf:[{if:'class<=4', from:'subjects_primary'}, {from:'subjects_default'}]
  //   или   optionsFromIf:[{if:'class>=11', options:['алгебра','геометрия']}]
  if(Array.isArray(v.optionsFromIf) && v.optionsFromIf.length){
    for(const r of v.optionsFromIf){
      if(!r) continue;
      if(r.if && !evalIf(r.if)) continue;
      if(r.from) return getEnumOptions(r.from, visited);
      if(Array.isArray(r.options)) return r.options.slice();
    }
    return [];
  }
  if(Array.isArray(v.options) && v.options.length) return v.options;
  if(v.optionsFrom) return getEnumOptions(v.optionsFrom, visited);
  return [];
}
/* Список ключей map: keys[] или keysFrom (enum-ссылка) */
function getMapKeys(v){
  if(Array.isArray(v.keys) && v.keys.length) return v.keys;
  if(v.keyType==='enum' && v.keysFrom) return getEnumOptions(v.keysFrom);
  return [];
}
/* enum-переменные, которые можно использовать как источник вариантов.
   Это enum с format='single' (т.е. справочники, а не наборы значений).
   excludeId — id текущей переменной (нельзя выбрать саму себя).
   Также защищаемся от циклов: не показываем те, что в итоге ссылаются на excludeId. */
function getEnumVarsList(excludeId){
  const all = (DATA?.variables||[]).filter(v=>
    v.type==='enum' && varFormat(v)==='single' && v.id!==excludeId
  );
  // отсортируем: сначала «корневые» (со своими options), потом «ссылочные»
  const roots = all.filter(v => Array.isArray(v.options) && v.options.length);
  const refs  = all.filter(v => !Array.isArray(v.options) || !v.options.length).filter(v=>{
    // отсекаем те, что зациклятся на excludeId
    const visited = new Set();
    let cur = v;
    while(cur){
      if(visited.has(cur.id)) return false;
      visited.add(cur.id);
      if(cur.optionsFrom){
        if(cur.optionsFrom === excludeId) return false;
        cur = varDef(cur.optionsFrom);
        continue;
      }
      if(Array.isArray(cur.optionsFromIf)){
        if(cur.optionsFromIf.some(r=>r && r.from===excludeId)) return false;
      }
      break;
    }
    return true;
  });
  return { roots, refs, all: roots.concat(refs) };
}
/* HTML <option>s для select'а — с группами «Корневые / Ссылочные». */
function enumVarsOptionsHTML(excludeId, selectedId){
  const {roots, refs} = getEnumVarsList(excludeId);
  const mkOpt = ev => {
    const sel = ev.id===selectedId ? 'selected' : '';
    const tip = Array.isArray(ev.optionsFromIf) ? ' → по условию'
      : (((!Array.isArray(ev.options) || !ev.options.length) && ev.optionsFrom) ? ` → ${ev.optionsFrom}` : '');
    return `<option value="${escHTML(ev.id)}" ${sel}>${escHTML(ev.label||ev.id)} (${escHTML(ev.id)})${escHTML(tip)}</option>`;
  };
  let html = '<option value="">— выбери enum-справочник —</option>';
  if(roots.length){
    html += `<optgroup label="Корневые справочники">${roots.map(mkOpt).join('')}</optgroup>`;
  }
  if(refs.length){
    html += `<optgroup label="Ссылки на другие enum">${refs.map(mkOpt).join('')}</optgroup>`;
  }
  return html;
}

          row.querySelector('.ec_from').onchange = e=>{ r.from = e.target.value || ''; markDirty('scripts'); resetVarsToDefaults(); renderVars(); };
          row.querySelector('.ec_up').onclick = ()=>{ [v.optionsFromIf[ri-1], v.optionsFromIf[ri]]=[v.optionsFromIf[ri], v.optionsFromIf[ri-1]]; markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars(); };
          row.querySelector('.ec_down').onclick = ()=>{ [v.optionsFromIf[ri+1], v.optionsFromIf[ri]]=[v.optionsFromIf[ri], v.optionsFromIf[ri+1]]; markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars(); };
          row.querySelector('.ec_del').onclick = ()=>{ v.optionsFromIf.splice(ri,1); if(v.optionsFromIf.length===0) v.optionsFromIf=[{if:'',from:''}]; markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars(); };

    if(varDataType(v)==='enum' && varFormat(v)==='single' && enumOwnMode){
      const optsRoot = card.querySelector('[id^="enumOpts_"]');

            }
            markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars();
          };
          r.querySelector('button').onclick = ()=>{

        markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars();

      };
      const vtM = card.querySelector('.v_valueType_map');
      if(vtM) vtM.onchange = e=>{
        v.valueType = e.target.value;
        if(v.valueType!=='enum') delete v.optionsFrom;
        markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars();
      };
      const kf = card.querySelector('.v_keysFrom');
      if(kf) kf.onchange = e=>{
        v.keysFrom = e.target.value || undefined;
        markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars();
      };
      const ofM = card.querySelector('.v_optionsFrom_map');
      if(ofM) ofM.onchange = e=>{
        v.optionsFrom = e.target.value || undefined;
        markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars();
      };
      // text-ключи: список + добавление
      if(v.keyType !== 'enum'){
        const mkRoot = card.querySelector('[id^="mapKeys_"]');
        if(mkRoot){
          (v.keys||[]).forEach((k,ki)=>{
            const r = document.createElement('div'); r.className='mk';
            r.innerHTML = `<span class="dnd-grip" title="Перетащить">⋮⋮</span><input value="${escHTML(k)}"><button class="danger-btn">✕</button>`;

            r.querySelector('button').onclick = ()=>{ v.keys.splice(ki,1); markDirty('scripts'); renderEdVars(); resetVarsToDefaults(); renderVars(); };

        };
      }
    }

    card.querySelector('.vDup').onclick = ()=>{
      const base = v.id + '_copy';
      let newId = base, n = 2;
      while((DATA.variables||[]).some(x=>x.id===newId)) newId = base + '_' + (n++);
      const copy = JSON.parse(JSON.stringify(v));
      copy.id = newId;
      copy.label = (v.label || v.id) + ' (копия)';
      // Если копируем enum со ссылкой на саму себя — убираем ссылку, чтобы не получить невалидный источник.
      if(copy.optionsFrom === v.id) copy.optionsFrom = '';
      if(copy.keysFrom === v.id) copy.keysFrom = '';
      const idx = DATA.variables.findIndex(x=>x.id===v.id);
      DATA.variables.splice(idx>=0 ? idx+1 : DATA.variables.length, 0, copy);
      VARS[copy.id] = defaultValueFor(copy);
      VARS_COLLAPSED.delete(copy.id);
      markDirty('scripts');
      renderEdVars(); renderVars();
      requestAnimationFrame(()=>{
        const newCard = document.querySelector('.var-card[data-var-id="'+CSS.escape(copy.id)+'"]');
        if(newCard){
          newCard.scrollIntoView({behavior:'smooth', block:'center'});
          const idInp = newCard.querySelector('.v_id');
          if(idInp){ idInp.focus(); idInp.select(); }
        }
      });
    };
    card.querySelector('.vDel').onclick = ()=>{
      if(!confirm('Удалить переменную «'+(v.label||v.id)+'»?')) return;
      const idx = DATA.variables.findIndex(x=>x.id===v.id);
      DATA.variables.splice(idx,1); delete VARS[v.id];
      markDirty('scripts'); renderEdVars(); renderVars();
    };

    attachVarDnD(card);
    // ✎ кнопки к селектам ссылок на другие enum-переменные
    attachVarEditLinksTo(card, '.v_optionsFrom, .v_optionsFrom_arr, .v_optionsFrom_map, .v_keysFrom');
    root.appendChild(card);
    shown++;
  });
  if(!shown){
    const empty = document.createElement('div'); empty.className='empty';
    empty.textContent = q ? 'ничего не найдено' : 'нет переменных';
    root.appendChild(empty);
  }
}

/* Drag-and-drop переменных — хватаемся только за шапку */
function attachVarDnD(card){
  // По умолчанию карточка НЕ драггабельна. Включаем при mousedown на шапку,
  // выключаем после dragend/mouseup — чтобы клики внутри текстовых полей не таскали.
  const head = card.querySelector('.var-head');
  card.draggable = false;
  head.style.cursor = ''; // курсор задаётся через .grip
  head.addEventListener('mousedown', e=>{
    // не активируем drag, если клик по input/select (на случай если такие появятся в шапке)
    if(e.target.closest('input,select,textarea,button')) return;
    card.draggable = true;
  });
  card.addEventListener('mouseup',   ()=>{ card.draggable = false; });
  card.addEventListener('mouseleave',()=>{ if(!card.classList.contains('dragging')) card.draggable = false; });

  card.addEventListener('dragstart', e=>{
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', card.dataset.varId);
    e.dataTransfer.effectAllowed='move';
  });
  card.addEventListener('dragend', ()=>{
    card.classList.remove('dragging');
    card.draggable = false;
    document.querySelectorAll('.var-card').forEach(x=>x.classList.remove('drop-before','drop-after'));
  });
  card.addEventListener('dragover', e=>{
    if(!document.querySelector('.var-card.dragging')) return;
    e.preventDefault();
    const rect = card.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height/2;
    card.classList.toggle('drop-before', before);
    card.classList.toggle('drop-after', !before);
  });
  card.addEventListener('dragleave', ()=>{ card.classList.remove('drop-before','drop-after'); });
  card.addEventListener('drop', e=>{
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetId = card.dataset.varId;
    if(!draggedId||draggedId===targetId) return;
    const di = DATA.variables.findIndex(v=>v.id===draggedId);
    const ti = DATA.variables.findIndex(v=>v.id===targetId);
    if(di<0||ti<0) return;
    const rect = card.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height/2;
    const [moved] = DATA.variables.splice(di,1);
    const newTi = DATA.variables.findIndex(v=>v.id===targetId);
    DATA.variables.splice(before?newTi:newTi+1, 0, moved);
    markDirty('scripts'); renderEdVars(); renderVars();
  });
}

/* Восстановление сохранённых ручек: scripts и objections — независимо. */
async function tryRestoreHandles(){
  if(!hasFSA) return {scripts:false, objs:false};
  let scriptsData = null, objsData = null, sHandle = null, oHandle = null;
  try{
    const sh = await idbGet('scripts_handle');
    if(sh && await verifyHandlePermission(sh)){
      const file = await sh.getFile();
      scriptsData = JSON.parse(await file.text());
      sHandle = sh;
    }
  }catch(e){ console.warn('scripts handle:', e); }
  try{
    const oh = await idbGet('objections_handle');
    if(oh && await verifyHandlePermission(oh)){
      const file = await oh.getFile();
      objsData = JSON.parse(await file.text());
      oHandle = oh;
    }
  }catch(e){ console.warn('objections handle:', e); }
  // Legacy: старый objs_handle — мигрируем как objections_handle, потом удалим запись.
  if(!oHandle){
    try{
      const legacy = await idbGet('objs_handle');
      if(legacy && await verifyHandlePermission(legacy)){
        const file = await legacy.getFile();
        objsData = JSON.parse(await file.text());
        oHandle = legacy;
        try{ await idbSet('objections_handle', legacy); }catch(e){}
        console.log('[migrate] legacy objs_handle → objections_handle');
      }
      try{ await idbDel('objs_handle'); }catch(e){}
    }catch(e){ console.warn('legacy objs handle:', e); }
  }

  if(sHandle){ SCRIPTS_HANDLE = sHandle; DIRTY.scripts = false; }
  if(oHandle){ OBJECTIONS_HANDLE = oHandle; DIRTY.objs = false; }

  if(scriptsData || objsData){
    // initAll принимает (scripts, objs). Если что-то null — части будут пустыми, но это OK.
    initAll(scriptsData, objsData);
  }

  if(scriptsData || objsData) AUTOSAVE_ARMED = true;
  updateSaveBtn();
  updateRestoreBtn();
  return {scripts:!!scriptsData, objs:!!objsData};
}

async function updateRestoreBtn(){
  const btn = document.getElementById('restoreBtn');
  if(!hasFSA){ btn.style.display='none'; return; }
  const sh = await idbGet('scripts_handle').catch(()=>null);
  const oh = await idbGet('objections_handle').catch(()=>null);
  const ch = await idbGet('calls_handle').catch(()=>null);
  const need = (sh && !SCRIPTS_HANDLE) || (oh && !OBJECTIONS_HANDLE) || (ch && !CALLS_HANDLE);
  btn.style.display = need ? '' : 'none';
}

document.getElementById('restoreBtn').onclick = async ()=>{
  const res = await tryRestoreHandles();
  if(!res.scripts && !res.objs){
    alert('Не удалось восстановить доступ. Возможно, файл был удалён или нужно открыть его заново через ⚙ Редактор → Настройки → Файлы.');
  } else {
    const parts = [];
    if(res.scripts) parts.push('скрипты');
    if(res.objs) parts.push('возражения');
    showSaveState('✓ подключено: '+parts.join(', ')+', автосохранение активно', false);
  }
};

document.getElementById('fileInput').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const parsed = JSON.parse(r.result);
      // Авто-определение: если есть objections И нет modules/variables → это файл возражений
      const looksLikeObjs = parsed && Array.isArray(parsed.objections) && !parsed.modules && !parsed.variables;
      if(looksLikeObjs){
        OBJS = parsed;
        ensureDataShape();
        renderObjList(); renderObjCard();
        if(EDIT_TAB==='objs') renderEditor();
        showSaveState('✓ возражения загружены ('+(OBJS.objections||[]).length+')', false);
      } else {
        // Файл скриптов (с objections внутри — будет смигрирован в OBJS через ensureDataShape, кроме случая когда OBJS уже не пустой)
        // Если в загруженном файле есть objections И в текущем OBJS уже что-то есть — спросим.
        if(Array.isArray(parsed.objections) && parsed.objections.length>0 && (OBJS.objections||[]).length>0){
          if(confirm('В загружаемом файле есть возражения. Заменить ими текущие?')){
            OBJS = {objections: parsed.objections};
          }
          delete parsed.objections;
        }
        initAll(parsed, OBJS);
      }
    }catch(err){ showError('Ошибка файла: '+err.message); }
  };
  r.readAsText(f,'utf-8');
});

(async function(){
  // 1) fetch — если страница открыта с локального сервера и файлы лежат рядом
  let loadedViaFetch = false;
  let scriptsData = null, objsData = null, callsData = null;
  try{ scriptsData = await loadJSON('scripts.json'); loadedViaFetch = true; }catch(e){}
  try{ objsData    = await loadJSON('objections.json'); loadedViaFetch = true; }catch(e){}
  try{ callsData   = await loadJSON('callbacks.json'); loadedViaFetch = true; }catch(e){}
  if(loadedViaFetch){
    initAll(scriptsData, objsData, callsData);
  } else {
    DATA = {stages:[], variables:[], modules:{}, start:''};
    OBJS = {objections:[]};
    CALLS = emptyCalls();
    ensureDataShape();
    ensureCallsShape();
  }

  // 2) FSA-ручки — могут существовать независимо: только скрипты / только возражения / оба / перезвоны
  if(hasFSA){
    const sh = await idbGet('scripts_handle').catch(()=>null);
    const oh = await idbGet('objections_handle').catch(()=>null);
    const ch = await idbGet('calls_handle').catch(()=>null);
    const ohLegacy = (!oh) ? await idbGet('objs_handle').catch(()=>null) : null;
    if(sh || oh || ohLegacy || ch){
      let restoredSilently = false;
      let scrData = null, objData = null, calData = null;
      try{
        if(ch && (await ch.queryPermission({mode:'readwrite'}))==='granted'){
          const file = await ch.getFile();
          try{
            calData = JSON.parse(await file.text());
            CALLS_HANDLE = ch;
          }catch(e){ console.warn('startup calls parse:', e); }
        }
      }catch(e){ console.warn('startup calls handle:', e); }
      try{
        if(sh && (await sh.queryPermission({mode:'readwrite'}))==='granted'){
          const file = await sh.getFile();
          scrData = JSON.parse(await file.text());
          SCRIPTS_HANDLE = sh;
        }
      }catch(e){ console.warn('startup scripts handle:', e); }
      try{
        const useO = oh || ohLegacy;
        if(useO && (await useO.queryPermission({mode:'readwrite'}))==='granted'){
          const file = await useO.getFile();
          objData = JSON.parse(await file.text());
          OBJECTIONS_HANDLE = useO;
          if(ohLegacy && !oh){
            // мигрируем legacy → новое имя в IDB
            try{ await idbSet('objections_handle', useO); }catch(e){}
            console.log('[migrate] legacy objs_handle → objections_handle');
          }
        }
        try{ await idbDel('objs_handle'); }catch(e){}
      }catch(e){ console.warn('startup objections handle:', e); }

      if(scrData || objData || calData){
        if(scrData) DATA = scrData;
        if(objData) OBJS = objData;
        if(calData){ CALLS = calData; ensureCallsShape(); }
        initAll(DATA, OBJS, CALLS);
        DIRTY.scripts = false; DIRTY.objs = false; DIRTY.calls = false;
        restoredSilently = true;
      }
      if(restoredSilently) AUTOSAVE_ARMED = true;
      updateSaveBtn();
      updateRestoreBtn();

      // Защита от пустой перезаписи: если scripts handle привязан, а в памяти пусто и файл не пуст — отключим autosave
      if(restoredSilently && SCRIPTS_HANDLE && dataLooksEmpty()){
        try{
          const f = await SCRIPTS_HANDLE.getFile();
          if(f.size > 50){
            showError('⚠ Внимание!\nФайл скриптов привязан (размер '+f.size+' байт), но прочитанный сценарий пуст.\nВозможно, файл был перезаписан пустотой ранее.\n\nПроверь рядом:\n  • <имя>.bak.json (последний ручной бэкап)\n  • backups/scripts-*.json\n\nАвтосохранение временно ОТКЛЮЧЕНО.');
            AUTOSAVE_ARMED = false;
          }
        }catch(e){}
      }
      if(restoredSilently && OBJECTIONS_HANDLE && objsLookEmpty()){
        try{
          const f = await OBJECTIONS_HANDLE.getFile();
          if(f.size > 50){
            console.warn('⚠ Файл возражений привязан, но в памяти пусто. Автосохранение возражений заблокировано.');
            AUTOSAVE_ARMED = false;
          }
        }catch(e){}
      }

      if(!restoredSilently && !loadedViaFetch){
        showError('Файлы не загружены. В шапке есть кнопка «🔓 Восстановить доступ к файлам».\n\nЛибо открой их через ⚙ Редактор → Настройки → Файлы.');
      }
    } else if(!loadedViaFetch){
      showError('Файлы не загрузились. Открой их через «📂 Открыть свой scripts.json» (просмотр) или ⚙ Редактор → Настройки → Файлы (с прямой записью и автосохранением).');
    }
  } else if(!loadedViaFetch){
    showError('Файлы не загрузились. Открой их через «📂 Открыть свой scripts.json» слева, либо запусти `python -m http.server 8000`.');
  }
})();

}

/* Глобальный MutationObserver — автосайз для любых textarea, которые появляются в DOM */
new MutationObserver(muts=>{
  muts.forEach(mu=>{
    mu.addedNodes.forEach(n=>{
      if(n.nodeType!==1) return;
      if(n.tagName==='TEXTAREA' && !n.classList.contains('autosize')) autosizeTA(n);
      n.querySelectorAll && n.querySelectorAll('textarea:not(.autosize)').forEach(autosizeTA);
    });
  });
}).observe(document.body, {childList:true, subtree:true});
/* И сразу — те, что уже есть */
autosizeAll(document);
