<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Менеджер речевых модулей</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#1f2330; --line:#2a2f3d;
    --text:#e8ecf3; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#3a6fd6;
    --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c; --obj:#ff9f43;
    --maxw: 1900px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .app{display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:100%;height:100vh;
    max-width:var(--maxw);margin:0 auto;width:100%}

  /* ===== Верхняя панель режимов ===== */
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0c0f15;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .topbar .title{font-weight:600;color:#cfe0ff}
  .topbar .mode{margin-left:auto;display:flex;gap:4px;background:var(--panel2);
    padding:3px;border-radius:8px;border:1px solid var(--line)}
  .topbar .mode button{background:transparent;color:var(--muted);padding:6px 14px;
    border-radius:6px;font-size:13px;border:0;cursor:pointer}
  .topbar .mode button.active{background:var(--accent);color:#fff}
  /* Бейдж-счётчик на кнопке вкладки «Перезвоны» */
  .mode-badge{display:inline-block;background:#e74c3c;color:#fff;border-radius:999px;
    min-width:18px;height:18px;line-height:18px;font-size:11px;font-weight:700;text-align:center;padding:0 5px;margin-left:4px}
  .topbar .save-state{font-size:12px;color:var(--muted);margin-right:8px}
  .topbar .save-state.dirty{color:var(--warn)}
  .topbar .save-state.saved{color:var(--ok)}

  /* ===== Прогресс-бар этапов ===== */
  .stages{display:flex;gap:6px;padding:10px 14px;background:#13161d;
    border-bottom:1px solid var(--line);overflow-x:auto}
  .stage{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);transition:.15s}
  .stage:hover{border-color:var(--accent)}
  .stage .num{display:inline-flex;width:22px;height:22px;border-radius:50%;
    background:var(--line);color:var(--muted);align-items:center;justify-content:center;
    font-size:12px;font-weight:600;flex-shrink:0}
  .stage.done{color:#cfe0ff;border-color:#2e466e}
  .stage.done .num{background:#2e466e;color:#fff}
  .stage.current{color:#fff;border-color:var(--accent);background:#1a2741}
  .stage.current .num{background:var(--accent);color:#fff}
  .stage .arrow{position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    color:var(--line);font-size:14px}
  .stage:last-child .arrow{display:none}

  /* ===== Основная сетка ===== */
  /* 3 колонки: переменные (фикс. 280px), скрипт (растягивается), возражения (адаптивно по содержимому, минимум 360px).
     Используем minmax чтобы правая не разрасталась бесконечно — её ширина пропорциональна центру (соотношение ~2:1). */
  .main{display:grid;grid-template-columns:280px minmax(0,2fr) minmax(360px,1fr);gap:1px;background:var(--line);overflow:hidden;min-height:0}
  .col{background:var(--panel);overflow:auto;padding:14px;min-width:0}
  /* Грид переменных в левой панели: 1 в ряд при узкой колонке, до 4 при широкой. */
  #vars{display:grid;gap:6px 10px;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr))}
  /* var-row сама по себе flex (label + редактор), но в гриде она занимает ячейку */
  .var-row{min-width:0}
  .var-row > label{font-size:12px;color:var(--muted);margin:0 0 2px;display:block}

  /* Адаптив: на узких экранах — скрипт сверху на всю ширину,
     внизу две колонки: переменные слева, возражения справа.
     Используем grid-template-areas. */
  .main{grid-template-areas: "vars script obj"}
  .col-vars{grid-area: vars}
  .col-script{grid-area: script; overflow-anchor: none}
  .col-obj{grid-area: obj}
  @media (max-width: 1100px){
    .main{
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(40vh, auto) auto;
      grid-template-areas:
        "script script"
        "vars   obj";
    }
    .col{max-height: none}
  }

  h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0 0 6px;font-size:20px;word-break:break-word}
  /* В центральном модуле — заголовок поменьше и приглушённый, чтобы не сливался с речью */
  .module h1{font-size:14px;font-weight:600;color:var(--muted);margin:4px 0 8px;letter-spacing:.03em}
  .badge{display:inline-block;font-size:11px;color:var(--muted);
    border:1px solid var(--line);padding:2px 8px;border-radius:999px;margin-right:6px;margin-bottom:4px}
  .version-btn{cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;opacity:.85}
  .version-btn:hover{color:#fff;border-color:var(--accent);background:var(--panel2)}
  .badge.stage-badge{border-color:#2e466e;color:#cfe0ff}
  .badge.warn{border-color:#5a4628;color:#ffdba8}

  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input,textarea,select{width:100%;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;outline:none;min-width:0}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:60px;font-family:inherit;overflow:hidden}
  textarea.autosize{resize:none}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > *{flex:1 1 200px;min-width:0}

  button{cursor:pointer;background:var(--accent);color:#fff;border:0;
    border-radius:6px;padding:9px 12px;font:inherit;text-align:left}
  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button.danger{background:var(--bad)}
  button.ok{background:var(--ok)}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}

  .module{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative}
  /* Кнопка-ссылка «✎» в правом верхнем углу карточки модуля/возражения — открыть в редакторе */
  .edit-link{position:absolute;top:6px;right:6px;background:transparent;color:var(--muted);
    border:0;font-size:14px;padding:4px 8px;cursor:pointer;border-radius:4px;line-height:1;opacity:.5}
  .edit-link:hover{opacity:1;color:var(--accent);background:var(--panel2)}
  /* В карточке возражения кнопка ✎ должна быть слева от ✕ */
  .obj-card .edit-link{right:34px;color:#9aa3b2}
  .obj-card .edit-link:hover{color:#ffdba8;background:#3a2e1d}
  /* Кнопка «▶ В работе» в шапке формы редактора */
  .preview-link{margin-left:auto;background:transparent;color:var(--muted);
    border:1px solid var(--line);font-size:11px;padding:3px 10px;cursor:pointer;
    border-radius:4px;line-height:1;transition:all .15s}
  .preview-link:hover{color:var(--ok);border-color:var(--ok);background:rgba(46,204,113,0.08)}
  /* В шапках card делаем flex чтобы preview-link встал в правый угол */
  .ed-form .card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* === БЛОКИ МОДУЛЯ В РЕЖИМЕ «РАБОТА» === Единый стиль для всех типов блоков.
     Цвет акцентной полосы слева различается по типу. Зазор между блоками минимален. */
  .module .text,
  .module .inline-input-block,
  .module .btns{
    background:#13161d;border:1px solid #2e466e;border-left:3px solid var(--accent);
    border-radius:8px;padding:14px 16px;color:#f0f4fb;margin:2px 0;
  }
  .module .text{font-size:17px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
  .module .text mark{background:rgba(79,140,255,.18);color:#cfe0ff;
    padding:0 4px;border-radius:3px;font-style:normal}
  .module .text mark.missing{background:rgba(231,76,60,.25);color:#ffcfc8}
  /* Ссылки на возражения внутри текста */
  .obj-link-inline{color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:500}
  .obj-link-inline:hover{color:#7ba6ff;background:rgba(79,140,255,0.1);border-radius:3px}
  /* Inline-форматирование \! (синее, обычное) и \!! (жёлтое, жирное) — работает везде. */
  mark.mk-blue, .module .text mark.mk-blue{
    background:rgba(79,140,255,.22) !important;color:#cfe0ff !important;
    padding:0 4px;border-radius:3px;font-style:normal;font-weight:normal}
  mark.mk-yellow, .module .text mark.mk-yellow{
    background:rgba(255,159,67,.32) !important;color:#ffd089 !important;
    padding:0 4px;border-radius:3px;font-style:normal;font-weight:600}
  /* Копируемые блоки \%текст\% — клик по любому месту копирует содержимое в буфер */
  .copy-block{
    display:inline-block;background:rgba(46,204,113,.18);color:#a9f0c3;
    border:1px dashed rgba(46,204,113,.55);border-radius:4px;padding:1px 8px;
    cursor:pointer;transition:background .15s, transform .08s;
    user-select:none;position:relative;
  }
  .copy-block:hover{background:rgba(46,204,113,.32);color:#e5fff0}
  .copy-block:active{transform:scale(.98)}
  .copy-block.copied{background:rgba(46,204,113,.55);color:#fff;border-style:solid}
  .copy-block::after{
    content:'📋';margin-left:6px;font-size:11px;opacity:.6;
  }
  .copy-block.copied::after{content:'✓';opacity:1}
  /* Всплывающее уведомление «Скопировано!» */
  .copy-toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1f2b3d;color:#cfe0ff;border:1px solid var(--accent);border-radius:8px;
    padding:8px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    pointer-events:none;opacity:0;transition:opacity .2s, transform .2s;z-index:9999;
  }
  .copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== ПЕРЕЗВОНЫ ===== */
  .calls-view{padding:18px 22px;width:100%;max-width:1200px;margin:0 auto;display:block;min-height:0;overflow:auto}
  .calls-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .calls-toolbar h2{margin:0 12px 0 0;font-size:20px}
  .calls-toolbar .spacer{flex:1}
  .calls-stats{color:var(--muted);font-size:13px;margin-right:10px}
  .calls-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .calls-filters .chip{
    padding:7px 16px;border-radius:8px;border:1px solid var(--line);
    cursor:pointer;background:var(--panel2);color:var(--text);font-size:14px;
    font-weight:600;transition:background .15s,border-color .15s
  }
  .calls-filters .chip:hover{border-color:var(--accent)}
  .calls-filters .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .calls-search{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .calls-search input[type=text]{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-size:14px}
  .calls-search input[type=text]:focus{border-color:var(--accent)}
  .calls-search .search-ignore{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .call-card{
    background:#171d2a;border:1px solid #2a3a5a;border-left:4px solid #5fa0ff;
    border-radius:12px;padding:14px 18px;margin:9px 0;color:#f0f4fb;
    box-shadow:0 1px 4px rgba(0,0,0,.2);
    display:grid;grid-template-columns:1fr;gap:4px;font-size:13px;
  }
  .call-card.overdue{border-color:#ff5252;border-left-color:#ff5252;background:#241417;box-shadow:0 0 0 1px rgba(255,82,82,.35), 0 2px 8px rgba(255,82,82,.18)}
  .call-card.today{border-left-color:#ffc107;background:#1c1b17}
  .call-card.upcoming{border-left-color:#4caf50;background:#161c17}
  .call-card.archived{opacity:.5;border-left-color:#5a6070;background:#14171d}

  /* Строка 1: два блока-плитки: (1) время и счётчики, (2) имя/номер/комментарий, + действия */
  .call-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:stretch}

  /* === Блок 1: время и счётчики === */
  .tile-when{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;min-height:100%}
  .tile-when .tw-main{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
   .tile-when .tw-main .big-time{font-size:27px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
   .tile-when .tw-main .big-shift{font-size:16px;font-weight:700;color:#ffd089;white-space:nowrap}
  /* подблок: следующий + локальное время */
  .tile-when .tw-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
   .tile-when .tw-sub .next-time{font-size:14px;font-weight:700;color:#7fd8a8}
   .tile-when .tw-sub .big-local{font-size:13px;font-weight:600;color:#9fb0cd}
  /* подблок: дата + создан */
  .tile-when .tw-date{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
   .tile-when .tw-date .date{font-size:14px;font-weight:600;color:#c8d3e8}
  .tile-when .tw-date .created{font-size:11px;color:#6b7890}
  /* подблок: история */
  .tile-when .tw-hist{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
   .tile-when .tw-hist .lbl{font-size:12px;color:var(--muted)}
  .tile-when .tw-hist .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:inline-block}
  .tile-when .tw-hist .dot.no{background:#ff5252}
  .tile-when .tw-hist .dot.ao{background:#ffa726}
  .tile-when .tw-hist .dot.done{background:#4caf50}
  .tile-when .tw-hist .dot.sb{background:#ef5350}
  .tile-when .tw-hist .dot.cb{background:#42a5f5}

  /* === Блок 2: имя/номер/комментарий === */
  .tile-info{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;
    display:flex;flex-direction:column;gap:4px;min-width:0;min-height:100%}
  .tile-info .ti-top{display:flex;align-items:baseline;gap:14px;min-width:0;flex-wrap:wrap}
  .tile-info .name{font-size:19px;font-weight:700;color:#fff;white-space:nowrap}
  .tile-info .reason-tag{font-size:12px;background:rgba(79,140,255,.2);color:#cfe0ff;padding:0 10px;border-radius:8px;white-space:nowrap;flex-shrink:0}
  .tile-info .phone{white-space:nowrap;flex-shrink:0}
  .tile-info .phone-num{font-size:17px;cursor:pointer;font-weight:700;color:#cfe0ff;font-variant-numeric:tabular-nums;padding:0 4px;border-radius:4px;transition:background .15s}
  .tile-info .phone-num:hover{background:rgba(79,140,255,.18)}
  .tile-info .phone-num.copied{background:rgba(46,204,113,.3);color:#a9f0c3}
  .tile-info .comment{font-size:14px;color:#d8e2f2;white-space:normal;word-wrap:break-word;min-width:0}
  .tile-info .call-result-field{font-size:13px;color:#a9f0c3;background:rgba(46,204,113,.12);border:1px dashed rgba(46,204,113,.4);border-radius:6px;padding:2px 8px;white-space:normal;word-wrap:break-word;min-width:0;align-self:flex-start;cursor:pointer}

  /* Выделение карточки, из которой последним скопирован номер */
  .call-card.copied-num{background:#16301f;border-color:#2ecc71;box-shadow:0 0 0 1px rgba(46,204,113,.5), 0 2px 8px rgba(46,204,113,.25)}
  .call-info .comment{font-size:15px;color:#d8e2f2;white-space:normal;word-wrap:break-word;min-width:0}
  .call-info .call-result-field{font-size:14px;color:#a9f0c3;background:rgba(46,204,113,.12);border:1px dashed rgba(46,204,113,.4);border-radius:6px;padding:3px 8px;white-space:normal;word-wrap:break-word;min-width:0}

  /* Строка 2: три мини-блока — управление карточкой / результат звонка / ссылки */
  .call-bottom{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:8px}
  .cb-block{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:42px}
  .cb-block button{padding:5px 13px;font-size:13px;border-radius:6px}
  .cb-block button.ok{background:#4caf50;border-color:#4caf50;color:#0c0f15}
  .cb-block button.danger{border-color:rgba(231,76,60,.5);color:#ff8a80}
  .cb-result button.cb{background:#5fa0ff;border-color:#5fa0ff;color:#fff;font-weight:600}
  .cb-result button.no{background:#ff525233;border-color:#ff525266;color:#ffb0b0}
  .cb-result button.ao{background:#ffa72633;border-color:#ffa72666;color:#ffcc80}
  .cb-result button.sb{background:#ef535022;border-color:#ef535055;color:#ff9e9b}
  /* Поле записанного результата — внутри блока «Результат звонка» */
  .cb-result .call-result-field{font-size:13px;color:#a9f0c3;background:rgba(46,204,113,.12);
    border:1px dashed rgba(46,204,113,.4);border-radius:6px;padding:4px 9px;white-space:normal;
    word-wrap:break-word;min-width:0;cursor:pointer}
  .cb-result .call-result-field:hover{background:rgba(46,204,113,.25)}
  /* Блок ссылок (Звонок + админки) — скруглённые прямоугольники */
  .cb-links{display:flex;gap:8px;flex-wrap:wrap}
  .cb-links .link-btn{display:inline-flex;align-items:center;text-decoration:none;color:#fff;background:#3a6fd6;
    font-size:13px;font-weight:600;padding:5px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:filter .1s}
  .cb-links .link-btn.zvonok{background:#2ecc71}
  .cb-links .link-btn:hover{filter:brightness(1.12)}
  .cb-links .link-btn.disabled{opacity:.5;cursor:default;filter:none}

  /* Детали (раскрываются кликом по карточке) — только история */
  .call-detail{margin-top:3px;border-top:1px dashed var(--line);padding-top:5px;font-size:12px;color:#c8d2e4;display:none}
  .call-detail.open{display:block}
  .call-detail .hist-row{margin:2px 0;display:flex;gap:8px}
  .call-detail .hist-row .t{color:#8ea3c7;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* Встроенная форма переноса */
  .reschedule-inline{margin-top:3px;background:rgba(95,160,255,.07);border:1px dashed rgba(95,160,255,.35);border-radius:6px;padding:6px 8px;display:none;gap:6px;flex-wrap:wrap;align-items:flex-start;width:100%;max-width:100%}
  .reschedule-inline.open{display:flex}
  .reschedule-inline select,.reschedule-inline input,.reschedule-inline textarea{
    font-size:12px;padding:3px 6px;background:#0c0f15;border:1px solid var(--line);color:#f0f4fb;border-radius:4px;width:auto
  }
  .reschedule-inline input[type=date]{min-width:0}
  .reschedule-inline select{max-width:110px}
  .reschedule-inline .rl-label{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
  .reschedule-inline textarea{flex:1 1 auto;min-width:180px;min-height:24px;font-family:inherit}
  .reschedule-inline button{padding:3px 9px;font-size:12px;border-radius:4px}
  .call-form{margin:8px 0 14px}
  .call-form .cf-head{margin:0 0 10px;font-size:15px;color:#fff}
  .call-form .cf-body{display:flex;flex-direction:column;gap:10px}
  .cf-block{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .cf-block .cf-title{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0 0 6px}
  .cf-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .cf-block label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px}
  .cf-block label input,.cf-block label select,.cf-block label textarea{
    font-size:13px;padding:7px 9px;background:#0c0f15;border:1px solid var(--line);color:#f0f4fb;
    border-radius:6px;font-family:inherit;text-transform:none;letter-spacing:0}
  .cf-block label textarea{min-height:60px;resize:vertical}
  .cf-check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    text-transform:none;letter-spacing:0;cursor:pointer;align-self:end;padding-bottom:9px;white-space:nowrap}
  .cf-check input{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0}
  /* Ссылки внутри блока */
  .cf-links{display:flex;flex-direction:column;gap:6px}
  .cf-links .link-row{display:flex;gap:6px;align-items:center}
  .cf-links .link-row input{flex:0 0 150px;font-size:12px;padding:6px 8px;background:#0c0f15;
    border:1px solid var(--line);color:#f0f4fb;border-radius:4px;text-transform:none;letter-spacing:0}
  .cf-links .link-row input.link-url{flex:1}
  .cf-links .link-row button{flex:0 0 auto}
  .call-form .form-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .btn-small{padding:5px 10px;font-size:12px;border-radius:4px;border:1px solid var(--line);background:#1a2030;color:#cfe0ff;cursor:pointer}
  /* Модальное окно ввода результата звонка */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100000}
  .modal-box{background:#171d2a;border:1px solid var(--line);border-radius:12px;padding:18px;width:min(520px,90vw);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .modal-box h3{margin:0 0 8px;font-size:16px;color:#fff}
  .modal-box .modal-hint{font-size:12px;color:var(--muted);margin-bottom:10px}
  .modal-box textarea{width:100%;min-height:80px;background:#0c0f15;border:1px solid var(--line);color:#f0f4fb;border-radius:6px;padding:8px 10px;font:inherit;resize:vertical}
  .modal-box .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .modal-box .modal-actions button{padding:7px 14px;font-size:13px}
  .cl-modal{width:min(560px,92vw)}
  .cl-list{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .cl-item{display:flex;gap:10px;align-items:baseline;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .cl-v{font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
  .cl-text{color:var(--text);font-size:13px;line-height:1.4}
  .btn-small:hover{border-color:var(--accent);color:#fff}
  .btn-small.danger{border-color:rgba(231,76,60,.5);color:#ff8a80}
  .btn-small.danger:hover{background:rgba(231,76,60,.15);border-color:#e74c3c;color:#fff}
  .btn-small.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-small.ok{background:#2ecc71;border-color:#2ecc71;color:#0c0f15;font-weight:600}
  .reschedule-form{background:rgba(255,200,100,.08);border:1px dashed rgba(255,200,100,.4);
    border-radius:6px;padding:10px;margin-top:8px;display:grid;gap:6px;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .reschedule-form .form-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
  /* Поле ввода: тот же стиль рамки, акцент в полосе слева — жёлтый чтобы оператор видел «надо заполнить» */
  .module .inline-input-block{border-left-color:#f1c40f;padding:10px 12px}
  .module .inline-input-block > .inline-input-label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:none;letter-spacing:0}
  /* Inline-input ВНУТРИ buttons-блока: без внешней рамки/фона, чтобы визуально объединиться с кнопками
     (контейнер .btns уже даёт рамку группы). Только лёгкая жёлтая граница слева, padding под кнопку. */
  .module .btns > .inline-input-block.btnrow-input{
    background:transparent;border:0;border-left:3px solid #f1c40f;
    border-radius:4px;padding:6px 10px;margin:0;
  }
  /* Группа подряд идущих input-блоков → авто-грид, как кнопки.
     На широком экране 2-4 поля в ряд, на узком — 1 в столбик. */
  .module .input-group{display:grid;gap:6px;margin:2px 0;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr))}
  /* Внутри группы — у самих блоков убираем внешний margin, чтобы не было двойных зазоров */
  .module .input-group > .inline-input-block{margin:0}
  /* Кнопки: акцент зелёный */
  .module .btns{border-left-color:#2ecc71;padding:10px 12px;display:grid;gap:8px;
    grid-template-columns:repeat(auto-fit, minmax(170px, 1fr))}
  .module .btns button{white-space:normal;word-wrap:break-word}
  .module .btns .end{background:var(--ok)}
  .module .btns .obj-link-btn{background:#3a2e1d;color:#ffdba8;border:1px solid #5a4628}
  .module .btns .obj-link-btn:hover{background:#4a3a25}
  /* Старый .inp-block (на случай legacy-кода) */
  .inp-block{margin:12px 0;padding:12px;background:#141821;border:1px dashed var(--line);border-radius:8px}
  .inp-block label{margin-top:0}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .toolbar select{width:auto;flex:1 1 160px;min-width:160px}

  /* Сворачиваемые блоки в текстах модулей и возражений */
  .collapsible{margin:6px 0;border-radius:6px;background:rgba(255,255,255,0.03);
    border:1px solid var(--line);overflow:hidden;display:block}
  /* Соседние блоки идут вплотную — без двойного зазора */
  .collapsible + .collapsible{margin-top:0}
  .collapsible-head{display:flex;align-items:center;gap:8px;width:100%;
    background:rgba(255,255,255,0.04);border:0;color:var(--text);
    padding:6px 10px;cursor:pointer;font:inherit;text-align:left;
    transition:background .15s}
  .collapsible-head:hover{background:rgba(79,140,255,0.15)}
  /* Chevron-стрелка из CSS-border'ов — выглядит чище чем символ ▶ */
  .collapsible-arrow{display:inline-block;width:0;height:0;
    border-left:6px solid var(--accent);
    border-top:5px solid transparent;border-bottom:5px solid transparent;
    transition:transform .15s ease;flex-shrink:0;margin-right:2px}
  .collapsible-head:hover .collapsible-arrow{border-left-color:#7ba6ff}
  .obj-card .collapsible-arrow{border-left-color:var(--obj)}
  .obj-card .collapsible-head:hover .collapsible-arrow{border-left-color:#ffc285}
  .collapsible-title{flex:1;font-weight:500}
  .collapsible-body{display:none;padding:8px 12px;background:rgba(255,255,255,0.02);
    border-top:1px solid var(--line);white-space:pre-wrap;line-height:1.55}
  .collapsible.open > .collapsible-body{display:block}
  /* Стрелка тоже только своя — не у потомков */
  .collapsible.open > .collapsible-head > .collapsible-arrow{transform:rotate(90deg)}
  /* Вложенные блоки: такой же зазор как у корневых, чтобы визуально разделялись.
     Чтобы вложенность читалась — у внутренних слегка темнее фон. */
  .collapsible .collapsible{margin:6px 0;background:rgba(255,255,255,0.04)}
  .collapsible .collapsible:first-child{margin-top:0}
  .collapsible .collapsible:last-child{margin-bottom:0}
  /* В карточке возражения — чуть другой акцент */
  .obj-card .collapsible{background:rgba(255,159,67,0.06);border-color:#5a4628}
  .obj-card .collapsible-head{background:rgba(255,159,67,0.08)}
  .obj-card .collapsible-head:hover{background:rgba(255,159,67,0.2)}
  .obj-card .collapsible-body{background:rgba(255,159,67,0.03);border-top-color:#5a4628}
  .obj-card .collapsible .collapsible{background:rgba(255,159,67,0.1)}

  /* Заметки оператора (редактируемые, на текущий разговор) — стиль как у обычной переменной */
  .op-notes-block{margin-bottom:8px;position:sticky;top:0;z-index:5;background:var(--panel);padding-bottom:6px}
  .op-notes-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .op-notes-head label{font-size:12px;color:var(--muted);margin:0}
  .op-notes-head .op-notes-clear{padding:0 6px;font-size:11px;line-height:1;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;opacity:.6}
  .op-notes-head .op-notes-clear:hover{opacity:1;color:var(--bad)}
  textarea.op-notes{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;font:inherit;outline:none;resize:none;min-height:40px;line-height:1.45}
  textarea.op-notes:focus{border-color:var(--accent)}

  /* Map-переменная (key→value). Inline-таблица: колонки сами подгоняются под содержимое. */
  .map-block{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px;margin-bottom:8px;
    display:block;max-width:100%}
  .map-block .map-row{display:grid;grid-template-columns: auto minmax(180px, 1fr) auto;
    gap:4px 10px;margin-bottom:4px;align-items:center;justify-items:stretch}
  .map-block .map-row .dnd-grip{justify-self:start}
  .map-block .map-row input[type=text], .map-block .map-row input[type=number],
  .map-block .map-row select{padding:6px 10px;font-size:13px;width:100%;min-width:0;box-sizing:border-box}
  .map-block .map-row input[disabled]{background:#141821;color:var(--muted);border-color:transparent;
    padding-left:2px;font-weight:500;color:var(--text);min-width:0;width:auto}
  .map-block .map-row .bool-cell{display:inline-flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;justify-self:start}
  .map-block .map-row .bool-cell input{margin:0;cursor:pointer}
  .map-block .map-row .add-row{grid-column:1 / -1;justify-self:stretch}
  .map-block .map-row button.danger-btn{padding:4px 10px;font-size:12px;justify-self:end}
  /* Map: 4 колонки (grip, key, value, delete) или 3 (key, value, delete) */
  .map-block .map-row.map-row-4{grid-template-columns: auto minmax(120px, 1fr) minmax(180px, 1fr) auto}
  .map-block .map-row.map-row-3{grid-template-columns: minmax(120px, 1fr) minmax(180px, 1fr) auto}

  /* ===== Правая колонка: вкладки ===== */
  .tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 12px;cursor:pointer;color:var(--muted);font-size:13px;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:#fff;border-color:var(--accent)}
  .tab .pill{display:inline-block;background:var(--line);color:var(--muted);
    border-radius:999px;padding:1px 7px;font-size:11px;margin-left:6px}
  .tab.warn{color:var(--obj)}
  .tab.warn.active{border-color:var(--obj)}

  .history{display:flex;flex-direction:column;gap:6px}
  .history .item{padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--panel2);cursor:pointer;font-size:13px}
  .history .item:hover{border-color:var(--accent)}
  .history .item .small{color:var(--muted);font-size:11px;margin-top:2px;word-wrap:break-word}

  .obj-search{margin-bottom:10px}
  .obj-list{display:flex;flex-direction:column;gap:4px;max-height:35vh;overflow:auto;
    padding-right:4px;margin-bottom:10px}
  .obj-list .item{padding:7px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--panel2);cursor:pointer;font-size:13px}
  .obj-list .item:hover{border-color:var(--obj)}
  .obj-list .item.active{border-color:var(--obj);background:#2a2218}
  .obj-list .item .tags{color:var(--muted);font-size:11px;margin-top:2px}
  /* Древовидный режим списка возражений */
  .obj-tree-item{display:flex !important;align-items:center;gap:6px;padding:5px 8px !important}
  .obj-tree-twisty{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
    cursor:pointer;user-select:none;flex-shrink:0}
  .obj-tree-twisty.has-children::before{content:'';display:inline-block;width:0;height:0;
    border-left:5px solid var(--obj);
    border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform .15s ease}
  .obj-tree-twisty.has-children.open::before{transform:rotate(90deg)}
  .obj-tree-twisty.has-children:hover::before{border-left-color:#ffc285}
  .obj-tree-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .obj-tree-count{font-size:10px;color:var(--muted);background:var(--line);
    border-radius:99px;padding:1px 7px;flex-shrink:0}
  .obj-card{background:#1c1812;border:1px solid #3a2e1d;border-radius:8px;padding:14px;
    position:relative}
  .obj-card h3{margin:0 0 8px;font-size:15px;color:#ffdba8;padding-right:60px;word-wrap:break-word}
  .obj-card .text{white-space:pre-wrap;line-height:1.55;margin-bottom:10px;font-size:14px;word-wrap:break-word}
  .obj-card .btns button{background:#3a2e1d;color:#ffdba8;border:1px solid #5a4628}
  /* Автокнопки на детей возражения — чуть приглушённый стиль (визуально отделить от ручных) */
  .obj-card .btns .obj-auto{background:#2a2218;color:#d4a566;border:1px dashed #5a4628}
  .obj-card .btns .obj-auto:hover{background:#3a2e1d;color:#ffdba8}
  /* Кнопка "↑ к родителю" в шапке карточки */
  .obj-card .obj-parent{display:block;background:transparent;color:#9aa3b2;border:0;
    padding:2px 0 6px;font-size:12px;cursor:pointer;text-align:left}
  .obj-card .obj-parent:hover{color:#ffdba8}
  .obj-close-x{position:absolute;top:6px;right:6px;background:transparent;
    color:#ffdba8;border:0;font-size:18px;padding:4px 10px;cursor:pointer;
    border-radius:4px;line-height:1}
  .obj-close-x:hover{background:#3a2e1d}

  /* ===== РЕДАКТОР ===== */
  .editor-grid{display:grid;grid-template-columns:340px 1fr;gap:1px;background:var(--line);
    height:100%;overflow:hidden;min-height:0}
  .editor-grid > .col{padding:14px;overflow:auto;background:var(--panel);min-width:0}
  @media (max-width: 900px){
    .editor-grid{grid-template-columns:1fr; grid-template-rows:auto 1fr}
  }
  /* В режиме настроек левая колонка узкая — только навигация */
  .editor-grid.settings-mode{grid-template-columns:240px 1fr}
  @media (max-width: 900px){
    .editor-grid.settings-mode{grid-template-columns:1fr}
  }
  .ed-tabs{display:flex;gap:4px;margin-bottom:10px}
  .ed-tabs button{flex:1;text-align:center;background:var(--panel2);color:var(--muted);
    border:1px solid var(--line);font-size:12px;padding:7px;border-radius:6px;cursor:pointer}
  .ed-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ed-list .item{padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--panel2);cursor:pointer;font-size:13px;margin-bottom:5px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
  .ed-list .item:hover{border-color:var(--accent)}
  .ed-list .item.active{border-color:var(--accent);background:#1a2741}
  .ed-list .item.dragging{opacity:.4}
  .ed-list .item.drop-before{box-shadow:0 -2px 0 0 var(--accent)}
  .ed-list .item.drop-after{box-shadow:0 2px 0 0 var(--accent)}
  .ed-list .item.drop-inside{outline:2px dashed var(--accent);outline-offset:-2px}
  .ed-list .grip{cursor:grab;color:var(--muted);user-select:none;
    font-size:14px;padding:0 2px;line-height:1}
  .ed-list .grip:active{cursor:grabbing}
  .ed-list .twisty{width:14px;display:inline-flex;justify-content:center;
    color:var(--accent);cursor:pointer;user-select:none;font-size:11px;font-weight:600;
    transition:color .15s}
  .ed-list .twisty:hover{color:#7ba6ff;transform:scale(1.2)}
  .ed-list .indent{display:inline-block;flex-shrink:0}
  .ed-list .stage-tag{font-size:10px;color:var(--muted);
    border:1px solid var(--line);border-radius:99px;padding:1px 6px}
  .ed-list .obj-tag{font-size:10px;color:#ffdba8;border:1px solid #5a4628;
    border-radius:99px;padding:1px 6px}
  .ed-list .id{color:var(--muted);font-size:11px;margin-left:auto;font-family:monospace;word-break:break-all}
  .ed-search{margin-bottom:10px}
  .ed-add{width:100%;margin-bottom:10px;text-align:center;background:var(--ok)}
  .ed-form{max-width:1100px;margin:0 auto}
  .ed-form.wide{max-width:1300px}

  /* Палитра переменных (правая колонка центра редактора) */
  .form-with-palette{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:start;max-width:1400px;margin:0 auto}
  @media (max-width:1100px){ .form-with-palette{grid-template-columns:1fr} }
  .var-palette{position:sticky;top:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:10px;font-size:12px}
  .var-palette h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .var-palette .vp-hint{color:var(--muted);font-size:11px;margin-bottom:8px;line-height:1.4}
  .var-palette .vp-list{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
  .vp-chip{display:flex;align-items:center;gap:6px;background:#13161d;border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;cursor:grab;font-size:12px;line-height:1.2}
  .vp-chip:hover{border-color:var(--accent);background:#1a2741}
  .vp-chip:active{cursor:grabbing}
  .vp-chip .vp-name{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vp-chip .vp-id{color:var(--muted);font-family:monospace;font-size:10px;flex-shrink:0}
  .vp-chip .vp-type{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 5px;flex-shrink:0}
  .vp-chip .vp-edit{flex-shrink:0;width:22px;height:22px;margin-left:2px;font-size:11px;opacity:0;transition:opacity .15s}
  .vp-chip:hover .vp-edit{opacity:1}
  /* Подсветка целевого textarea при перетаскивании */
  .drop-target{outline:2px dashed var(--accent);outline-offset:-2px}

  /* Универсальный DnD для упорядоченных списков */
  .dnd-dragging{opacity:.4}
  .dnd-before{box-shadow:0 -2px 0 0 var(--accent)}
  .dnd-after{box-shadow:0 2px 0 0 var(--accent)}
  .dnd-grip{cursor:grab;color:var(--muted);user-select:none;padding:0 4px;font-size:14px;line-height:1;flex-shrink:0}
  .dnd-grip:active{cursor:grabbing}
  .dnd-grip:hover{color:var(--text)}
  /* В картах/массивах ручка делает строку чуть шире */
  .map-block .map-row{position:relative}
  .ed-form .card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin-bottom:14px}
  .ed-form .card h3{margin:0 0 10px;font-size:14px}
  .ed-form .card h3 .meta{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  .text-variants .variant{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
  .text-variants .variant textarea{flex:1}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .btn-card{background:#141821;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;border-left:3px solid #2ecc71}
  .btn-card.btn-card-input{border-left-color:#f1c40f}
  .btn-card .row{margin-bottom:6px}
  .btn-card label{margin-top:4px}
  /* Блочный редактор модуля */
  .mod-block{background:#141821;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
  .mod-block.dragging{opacity:.4}
  .mod-block.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
  .mod-block.drop-after{box-shadow:0 3px 0 0 var(--accent)}
  .mod-block-head{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--line)}

  /* Динамические блоки настройки типа (array/map/enum-source) — единый стиль, чтобы визуально были одной "карточкой настроек типа" */

  /* В карточках переменных правой панели редактора — показываем ✎ только при hover на строку.
     Цепляемся к row-обёртке: .row или .v_array/.v_map/.v_enum_source где живут селекты. */
  .var-card .var-edit-link{opacity:0;pointer-events:none}

</style>
</head>
<body>

<script>
/* ============================================================
   СОСТОЯНИЕ
============================================================ */
// Имя окна нужно userscript Naumen: window.open(..., 'rm_script') будет переиспользовать
// уже открытую вкладку речевого скрипта, а не плодить новые.
try{ window.name = 'rm_script'; }catch(e){}
let DATA = null;
let OBJS = null;
let VARS = {};
let FOCUS_ARRAY_LAST = null; // id переменной, у которой нужно сфокусировать последний элемент после следующего рендера
let FOCUS_MAP_LAST  = null;  // id переменной map, у которой нужно сфокусировать только что добавленный ключ
let HISTORY = [];
let CURRENT = null;
let CURRENT_TEXT_BLOCKS = {};          // {blockIdx: выбранная_строка_для_блока_типа_text}, сбрасывается при новом заходе в модуль
let CURRENT_OBJ = null;

let MODE = 'work';
let EDIT_TAB = 'scripts';
let EDIT_SELECTED = null;
let SETTINGS_SECTION = 'stages'; // stages | variables | start | files
let COLLAPSED = new Set(); // id свёрнутых возражений-родителей
let OBJ_CARD_LAST_ID = null; // id возражения, для которого последний раз рендерилась карточка (для сброса состояния \\\ блоков при переходе)
let VARS_COLLAPSED = new Set(); // id свёрнутых переменных в редакторе
let VARS_COLLAPSED_INITED = false; // флаг: при первом рендере свернём все
let VARS_SEARCH = '';
let SCRIPTS_HANDLE = null;    // file handle для scripts.json (модули, переменные, этапы)
let OBJECTIONS_HANDLE = null; // file handle для objections.json (возражения — общая база)
let CALLS_HANDLE = null;      // file handle для callbacks.json (перезвоны)
let CALLS = null;             // { reasons:[...], results:[...], items:[{id, date, timeFrom, timeTo, phone, parent, students, reason, notes, history:[{ts, result, rescheduleToDate, rescheduleToFrom, rescheduleToTo, reason}], archived, created, links:[{label,url}] } }
let CALLS_FILTER = 'active';  // active | overdue | today | upcoming | all | archived
let CALLS_SEARCH = '';        // поиск по номеру/имени/словам
let CALLS_SEARCH_IGNORE = false; // игнорировать фильтры при поиске
let DIRTY = { scripts:false, objs:false, calls:false };
let AUTOSAVE = (localStorage.getItem('autosave') ?? '1') === '1';
let _saveTimer = null;

/* Бэкапы */
let BACKUPS_ENABLED = (localStorage.getItem('bk_enabled') ?? '1') === '1';
let BACKUPS_INTERVAL_MIN = parseInt(localStorage.getItem('bk_interval')||'60',10);
let BACKUPS_KEEP = parseInt(localStorage.getItem('bk_keep')||'24',10);
let _bkTimer = null;
let _bkDirty = false; // были ли изменения с момента последнего бэкапа

/* ============================================================
   УТИЛИТЫ
============================================================ */
function escHTML(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* === БЛОЧНАЯ СТРУКТУРА МОДУЛЯ ===
   m.blocks: [
     {type:'text', text: 'строка' | ['вар1','вар2']},
     {type:'input', var: 'имя_переменной', label: 'опц.'},
     {type:'buttons', items: [{label, next?, if?, set?, end?, open_obj?}, ...]}
   ]
   Утилиты — для безопасного доступа и совместимости со старым кодом. */
function getBlocks(m){
  if(!m) return [];
  if(!Array.isArray(m.blocks)){ m.blocks = []; return m.blocks; }
  // Защита от null/мусора: если есть битые элементы — мутируем массив на месте,
  // удаляя их. Возвращаем тот же ссылочный массив, чтобы splice работал.
  let hasGarbage = false;
  for(let i=0;i<m.blocks.length;i++){
    const b = m.blocks[i];
    if(!b || typeof b !== 'object' || !b.type){ hasGarbage = true; break; }
  }
  if(hasGarbage){
    const cleaned = m.blocks.filter(b => b && typeof b === 'object' && b.type);
    m.blocks.length = 0;
    cleaned.forEach(b => m.blocks.push(b));
    console.warn('[getBlocks] вычистил битые элементы из m.blocks');
  }
  return m.blocks;
}
/* Все «места ввода переменной» в модуле:
   - блоки {type:'input'}
   - items {kind:'input'} внутри {type:'buttons'} блоков
   Возвращает массив объектов {var, label}. */
function getInputs(m){
  const out = [];
  getBlocks(m).forEach(b=>{
    if(b.type==='input'){
      if(Array.isArray(b.inputs)){
        out.push(...b.inputs);
      } else if(b.var){
        out.push(b);
      }
    } else if(b.type==='buttons' && Array.isArray(b.items)){
      b.items.forEach(it=>{ if(it && it.kind==='input') out.push(it); });
    }
  });
  return out;
}
function getButtons(m){
  const out = [];
  getBlocks(m).forEach(b=>{
    if(b.type==='buttons' && Array.isArray(b.items)){
      b.items.forEach(it => {
        if(it && typeof it === 'object' && (it.kind||'button')==='button') out.push(it);
      });
    }
  });
  return out;
}
/* Авто-высота textarea по содержимому */
function autosizeTA(ta){
  if(!ta) return;
  ta.classList.add('autosize');
  // Простой resize без попыток управлять scroll-позицией.
  // Браузер сам решит, скроллить ли к каретке (обычно делает это адекватно).
  // Раньше тут была компенсация смещения textarea — но она вызывала «дёрганье»
  // туда-сюда при печати в больших блоках, поэтому убрана.
  const resize = ()=>{
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  };
  ta.addEventListener('input', resize);
  requestAnimationFrame(resize);
}
/* Применяем автосайз ко всем textarea в контейнере (вызывать после innerHTML) */
function autosizeAll(root){
  (root||document).querySelectorAll('textarea').forEach(autosizeTA);
}

/* ===== Палитра переменных + перетаскивание в текстовые поля ===== */
const VAR_DRAG_MIME = 'application/x-varid';
function renderVarPalette(){
  if(!(DATA?.variables?.length)) return '';
  const chips = DATA.variables.map(v=>{
    const t = varTypeLabel(v);
    return `<div class="vp-chip" draggable="true" data-varid="${escHTML(v.id)}" title="Перетащи в текст или клик — вставит {${escHTML(v.id)}}">
      <span class="vp-name">${escHTML(v.label||v.id)}</span>
      <span class="vp-id">{${escHTML(v.id)}}</span>
      <button type="button" class="var-edit-link vp-edit" data-varid="${escHTML(v.id)}" title="Открыть переменную в редакторе">✎</button>
    </div>`;
  }).join('');
  return `<aside class="var-palette">
    <h4>🏷 Переменные</h4>
    <div class="vp-hint">Перетащи в текстовое поле или кликни — вставится <code>{id}</code>. Кнопка ✎ — открыть в редакторе.</div>
    <div class="vp-list">${chips}</div>
  </aside>`;
}
function attachVarPaletteEvents(rootEl){
  rootEl.querySelectorAll('.vp-chip').forEach(chip=>{
    chip.addEventListener('dragstart', e=>{
      const id = chip.dataset.varid;
      e.dataTransfer.setData(VAR_DRAG_MIME, id);
      e.dataTransfer.setData('text/plain', '{'+id+'}');
      e.dataTransfer.effectAllowed = 'copy';
    });
    chip.addEventListener('click', (e)=>{
      // если кликнули по ✎ — не вставляем, а откроем редактирование переменной
      if(e.target.closest('.vp-edit')){
        e.preventDefault(); e.stopPropagation();
        gotoVariable(e.target.dataset.varid || chip.dataset.varid);
        return;
      }
      const target = LAST_TEXT_FIELD;
      if(!target){ return; }
      insertAtCursor(target, '{'+chip.dataset.varid+'}');
      target.focus();
    });
  });
}
/* Запоминаем последнее активное текстовое поле — для click-вставки */
let LAST_TEXT_FIELD = null;
document.addEventListener('focusin', e=>{
  if(e.target.matches('input[type=text], input:not([type]), textarea')) LAST_TEXT_FIELD = e.target;
});
/* Глобальный обработчик dnd для всех input/textarea */
document.addEventListener('dragover', e=>{
  const t = e.target;
  if(!t || !t.matches || !t.matches('input[type=text], input:not([type]), textarea')) return;
  if(!Array.from(e.dataTransfer.types||[]).includes(VAR_DRAG_MIME)) return;
  e.preventDefault();
  t.classList.add('drop-target');
});
document.addEventListener('dragleave', e=>{
  if(e.target?.classList) e.target.classList.remove('drop-target');
});
document.addEventListener('drop', e=>{
  const t = e.target;
  if(!t || !t.matches || !t.matches('input[type=text], input:not([type]), textarea')) return;
  const id = e.dataTransfer.getData(VAR_DRAG_MIME);
  if(!id) return;
  e.preventDefault();
  t.classList.remove('drop-target');
  // вставляем по координатам каретки
  const pos = caretPositionFromPoint(t, e.clientX, e.clientY);
  insertAtPos(t, pos, '{'+id+'}');
  t.focus();
});
function caretPositionFromPoint(el, x, y){
  // Простая стратегия — для textarea и input установим каретку по document API,
  // иначе вставим в конец.
  try{
    if(document.caretPositionFromPoint){
      const cp = document.caretPositionFromPoint(x,y);
      if(cp && el.contains(cp.offsetNode)) return cp.offset;
    } else if(document.caretRangeFromPoint){
      const r = document.caretRangeFromPoint(x,y);
      if(r) return r.startOffset;
    }
  }catch(_){}
  return el.selectionStart ?? el.value.length;
}
function insertAtPos(el, pos, text){
  const v = el.value;
  el.value = v.slice(0,pos) + text + v.slice(pos);
  const newPos = pos + text.length;
  el.setSelectionRange(newPos, newPos);
  // триггерим input, чтобы сработали oninput-хуки
  el.dispatchEvent(new Event('input', {bubbles:true}));
}
function insertAtCursor(el, text){
  const pos = el.selectionStart ?? el.value.length;
  insertAtPos(el, pos, text);
}

/* ===== Глобальное переименование переменной =====
   Обновляет: подстановки {old} в текстах, input.var, b.set ключи, b.input.var,
   условия if/showIf/branch.if (заменяет идентификатор как слово), set значения (если строка содержит {old}). */
function renameVariableEverywhere(oldId, newId){
  if(!oldId || !newId || oldId===newId) return;
  const reSubstitution = new RegExp('\\{'+escapeRegex(oldId)+'\\}','g');
  const reWord         = new RegExp('(?<![A-Za-z0-9_])'+escapeRegex(oldId)+'(?![A-Za-z0-9_])','g');
  const replSubst = s => (typeof s==='string') ? s.replace(reSubstitution, '{'+newId+'}') : s;
  const replIf    = s => (typeof s==='string') ? s.replace(reWord, newId) : s;
  const replText  = s => Array.isArray(s) ? s.map(replSubst) : replSubst(s);

  // СКРИПТЫ (новая блочная структура)
  Object.values(DATA?.modules||{}).forEach(m=>{
    if(m.title!==undefined) m.title = replSubst(m.title);
    if(Array.isArray(m.branch)){
      m.branch.forEach(b=>{ if(b.if) b.if = replIf(b.if); });
    }
    getBlocks(m).forEach(blk=>{
      if(blk.type==='text'){
        blk.text = replText(blk.text);
      } else if(blk.type==='input'){
        if(blk.var===oldId) blk.var = newId;
        if(blk.label) blk.label = replSubst(blk.label);
      } else if(blk.type==='buttons'){
        (blk.items||[]).forEach(b=>{
          if(b.label) b.label = replSubst(b.label);
          if(b.if)    b.if    = replIf(b.if);
          if(b.set){
            const arr = Object.entries(b.set).map(([k,vv])=>{
              const nk = k===oldId ? newId : k;
              const nv = (typeof vv==='string') ? replSubst(vv) : vv;
              return [nk, nv];
            });
            b.set = Object.fromEntries(arr);
          }
        });
      }
    });
  });
  // Переменные: showIf
  (DATA?.variables||[]).forEach(v=>{
    if(v.showIf) v.showIf = replIf(v.showIf);
  });

  // ВОЗРАЖЕНИЯ
  (OBJS?.objections||[]).forEach(o=>{
    if(o.title!==undefined) o.title = replSubst(o.title);
    if(o.text!==undefined)  o.text  = replText(o.text);
    (o.buttons||[]).forEach(b=>{
      if(b.label) b.label = replSubst(b.label);
    });
  });
}
function escapeRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ============================================================
   АВТО-СКРОЛЛ при drag-and-drop
   Когда любой draggable элемент в перетаскивании и курсор близко к верху/низу
   ближайшего прокручиваемого предка (или окна) — плавно скроллим.
============================================================ */
const DND_AUTOSCROLL = {
  active: false,
  rafId: null,
  lastX: 0, lastY: 0,
  zone: 60,      // px от края, в которой включается скролл
  maxSpeed: 18,  // px за кадр на самом краю
  start(){
    if(this.active) return;
    this.active = true;
    document.addEventListener('dragover', this._onMove, true);
    document.addEventListener('drag', this._onMove, true);
    this._tick();
  },
  stop(){
    this.active = false;
    if(this.rafId){ cancelAnimationFrame(this.rafId); this.rafId = null; }
    document.removeEventListener('dragover', this._onMove, true);
    document.removeEventListener('drag', this._onMove, true);
  },
  _onMove(e){
    if(e.clientX>0 || e.clientY>0){
      DND_AUTOSCROLL.lastX = e.clientX;
      DND_AUTOSCROLL.lastY = e.clientY;
    }
  },
  _findScrollParent(x, y){
    let el = document.elementFromPoint(x, y);
    while(el){
      if(el === document.body || el === document.documentElement) break;
      const cs = getComputedStyle(el);
      const oy = cs.overflowY;
      if((oy==='auto'||oy==='scroll') && el.scrollHeight > el.clientHeight + 1) return el;
      el = el.parentElement;
    }
    return null; // = window
  },
  _tick(){
    if(!this.active) return;
    const x = this.lastX, y = this.lastY;
    if(x>0 || y>0){
      const sp = this._findScrollParent(x, y);
      const z = this.zone, ms = this.maxSpeed;
      let dy = 0;
      if(sp){
        const r = sp.getBoundingClientRect();
        if(y < r.top + z)         dy = -Math.ceil(((r.top + z) - y) / z * ms);
        else if(y > r.bottom - z) dy =  Math.ceil((y - (r.bottom - z)) / z * ms);
        if(dy){
          const before = sp.scrollTop;
          sp.scrollTop = Math.max(0, Math.min(sp.scrollHeight - sp.clientHeight, before + dy));
        }
      } else {
        const h = window.innerHeight || document.documentElement.clientHeight;
        if(y < z)        dy = -Math.ceil((z - y) / z * ms);
        else if(y > h-z) dy =  Math.ceil((y - (h - z)) / z * ms);
        if(dy) window.scrollBy(0, dy);
      }
    }
    this.rafId = requestAnimationFrame(()=>this._tick());
  }
};
// Глобально: на любой dragstart/dragend в документе подключаем автоскролл.
// Это покрывает все наши DnD utilities, не требует точечной интеграции.
document.addEventListener('dragstart', ()=>DND_AUTOSCROLL.start(), true);
document.addEventListener('dragend',   ()=>DND_AUTOSCROLL.stop(),  true);
document.addEventListener('drop',      ()=>DND_AUTOSCROLL.stop(),  true);

/* Переход к редактированию конкретной переменной из любого места UI.
   Открывает Настройки → Переменные, разворачивает карточку, прокручивает к ней и фокусирует label. */
function gotoVariable(varId){
  if(!varId) return;
  if(!(DATA.variables||[]).some(v=>v.id===varId)){ alert('Переменная «'+varId+'» не найдена'); return; }
  EDIT_TAB = 'settings';
  SETTINGS_SECTION = 'variables';
  VARS_COLLAPSED.delete(varId);
  setMode('edit');
  // дать DOM прорендериться
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const card = document.querySelector('.var-card[data-var-id="'+CSS.escape(varId)+'"]');
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      const labelInp = card.querySelector('.v_label');
      if(labelInp){ labelInp.focus(); labelInp.select(); }
    }
  }));
}
window.gotoVariable = gotoVariable;
/* HTML-фрагмент кнопки «✎» — вставлять рядом с select переменной.
   varIdGetter — функция, возвращающая текущее выбранное id переменной (значение select).
   Использование (inline): после select делаем <button class="var-edit-link" data-target-attr="...">✎</button>
   и навешиваем onclick. Для простоты — функция attachVarEditLink. */
function makeVarEditLink(getVarId, title){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'var-edit-link';
  btn.textContent = '✎';
  btn.title = title || 'Открыть переменную в редакторе';
  btn.onclick = (e)=>{
    e.preventDefault(); e.stopPropagation();
    const id = (typeof getVarId === 'function') ? getVarId() : getVarId;
    gotoVariable(id);
  };
  return btn;
}
/* Универсально: для select.someClass — вставляет ✎ кнопку сразу после.
   Кнопка disabled, если значение пустое. Обновляется при change. */
function attachVarEditLinksTo(container, selectSelector){
  container.querySelectorAll(selectSelector).forEach(sel=>{
    if(sel.nextElementSibling?.classList?.contains('var-edit-link')) return;
    const btn = makeVarEditLink(()=>sel.value, 'Открыть переменную в редакторе');
    btn.disabled = !sel.value;
    sel.parentNode.insertBefore(btn, sel.nextSibling);
    sel.addEventListener('change', ()=>{ btn.disabled = !sel.value; });
  });
}

/* Переименование значения enum (option) во всех местах:
   1) В key-литералах map-lookup'ов вида {mapVar.oldKey} в текстах модулей/возражений,
      где mapVar.keysFrom === enumVarId.
   2) В дефолтных значениях single-enum переменных, у которых optionsFrom === enumVarId (или это сам этот enum).
   3) В ключах map в VARS (runtime значениях оператора) — если оператор уже что-то ввёл.
   4) В фиксированных options самого enum-источника НЕ трогаем (этим занимается вызывающий код).
   5) В b.set значениях, выражениях if — пока не трогаем (там литерал в кавычках, переименование рискованно). */
function renameEnumOptionEverywhere(enumVarId, oldKey, newKey){
  if(!enumVarId || !oldKey || !newKey || oldKey===newKey) return;
  // Найдём все map-переменные, чьи ключи берутся из этого enum
  const mapVarIds = (DATA.variables||[])
    .filter(v=>varFormat(v)==='map' && v.keyType==='enum' && v.keysFrom===enumVarId)
    .map(v=>v.id);
  // Также single-enum переменные на этот источник — для замены default
  (DATA.variables||[]).forEach(v=>{
    if(varDataType(v)==='enum' && varFormat(v)==='single'
       && (v.optionsFrom===enumVarId || v.id===enumVarId)
       && v.default===oldKey){ v.default = newKey; }
    if(varFormat(v)==='array' && v.valueType==='enum' && v.optionsFrom===enumVarId){
      // если есть default-массив (редко используется), не трогаем — это runtime
    }
  });
  // Замена {mapVar.oldKey} → {mapVar.newKey} в строках
  if(mapVarIds.length){
    const replInStr = (s)=>{
      if(typeof s!=='string') return s;
      let out = s;
      mapVarIds.forEach(mv=>{
        const re = new RegExp('\\{('+escapeRegex(mv)+')\\.('+escapeRegex(oldKey)+')\\}', 'g');
        out = out.replace(re, '{$1.'+newKey+'}');
      });
      return out;
    };
    const replText = (s)=> Array.isArray(s) ? s.map(replInStr) : replInStr(s);
    Object.values(DATA?.modules||{}).forEach(m=>{
      if(m.title!==undefined) m.title = replInStr(m.title);
      getBlocks(m).forEach(blk=>{
        if(blk.type==='text')   blk.text = replText(blk.text);
        else if(blk.type==='input' && blk.label) blk.label = replInStr(blk.label);
        else if(blk.type==='buttons'){
          (blk.items||[]).forEach(b=>{ if(b.label) b.label = replInStr(b.label); });
        }
      });
    });
    (OBJS?.objections||[]).forEach(o=>{
      if(o.title!==undefined) o.title = replInStr(o.title);
      if(o.text!==undefined)  o.text  = replText(o.text);
      (o.buttons||[]).forEach(b=>{ if(b.label) b.label = replInStr(b.label); });
    });
  }
  // Runtime: ключи в VARS map-переменных
  mapVarIds.forEach(mv=>{
    const obj = VARS[mv];
    if(obj && typeof obj==='object' && !Array.isArray(obj) && (oldKey in obj)){
      obj[newKey] = obj[oldKey];
      delete obj[oldKey];
    }
  });
  // Runtime: значения single-enum равные oldKey
  (DATA.variables||[]).forEach(v=>{
    if(varDataType(v)==='enum' && varFormat(v)==='single'
       && (v.optionsFrom===enumVarId || v.id===enumVarId)
       && VARS[v.id]===oldKey){ VARS[v.id] = newKey; }
    // Array<enum>: переписать значения
    if(varFormat(v)==='array' && v.valueType==='enum' && v.optionsFrom===enumVarId){
      const arr = VARS[v.id];
      if(Array.isArray(arr)){
        for(let i=0;i<arr.length;i++) if(arr[i]===oldKey) arr[i] = newKey;
      }
    }
  });
}
function valNonEmpty(v){
  if(v===undefined||v===null) return false;
  if(typeof v==='boolean') return v;
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==='object') return Object.keys(v).length>0;
  return String(v).trim()!=='';
}
function varType(id){
  const def = (DATA.variables||[]).find(v=>v.id===id);
  return def?.type || 'text';
}
function varDef(id){ return (DATA.variables||[]).find(v=>v.id===id); }
/* Значение переменной, ТОЛЬКО если оно реально заполнено в скрипте,
   а не является значением по умолчанию. Иначе ''.
   Используется для автоподстановки родителя/ребёнка в перезвоны. */
function varReal(id){
  const v = VARS[id];
  if(v===null || v===undefined || v==='') return '';
  const s = String(v);
  const def = varDef(id)?.default;
  if(def!==undefined && def!==null && def!=='' && String(def)===s) return '';
  return s;
}

/* ============================================================
   ЗНАЧЕНИЯ ПО УМОЛЧАНИЮ / СБРОС
============================================================ */
function defaultValueFor(v){
  const fmt = varFormat(v);
  const t   = varDataType(v);
  if(fmt==='array') return [];
  if(fmt==='map'){
    const obj = {};
    getMapKeys(v).forEach(k=>{
      obj[k] = v.valueType==='bool' ? false : (v.valueType==='number' ? '' : '');
    });
    return obj;
  }
  // single
  if(t==='bool')   return v.default==='true' || v.default===true || false;
  if(t==='number') return v.default==='' || v.default===undefined ? '' : v.default;
  if(t==='enum'){
    const opts = getEnumOptions(v.id);
    if(v.default!==undefined && v.default!=='' && opts.includes(v.default)) return v.default;
    return '';
  }
  return v.default ?? '';
}
function resetVarsToDefaults(){
  const newVars = {};
  (DATA.variables||[]).forEach(v=>{
    if(v.persistent && VARS && VARS[v.id]!==undefined){
      // не сбрасываем — переносим текущее значение
      newVars[v.id] = VARS[v.id];
    } else {
      newVars[v.id] = defaultValueFor(v);
    }
  });
  VARS = newVars;
  // Заметки оператора сбрасываем всегда (session-only)
  OPERATOR_NOTES = '';
}

/* ============================================================
   ЗАГРУЗКА / СОХРАНЕНИЕ
============================================================ */
async function loadJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error(url+' → HTTP '+r.status);
  return await r.json();
}
function ensureDataShape(){
  if(!DATA) DATA = {};
  if(!OBJS) OBJS = {};
  if(!DATA.stages) DATA.stages = [];
  if(!DATA.variables) DATA.variables = [];
  if(!DATA.modules) DATA.modules = {};
  if(!Array.isArray(DATA.order)) DATA.order = Object.keys(DATA.modules);
  // notes из настроек больше не используется (заменено редактируемым блоком оператора)
  delete DATA.notes;
  // Возражения — отдельный файл/объект. Миграция: если в DATA случайно есть objections (старый объединённый формат),
  // переносим их в OBJS (если OBJS пустой) и удаляем из DATA, чтобы не дублировались при сохранении.
  if(Array.isArray(DATA.objections)){
    if(!Array.isArray(OBJS.objections) || OBJS.objections.length===0){
      OBJS.objections = DATA.objections;
    }
    delete DATA.objections;
  }
  if(!Array.isArray(OBJS.objections)) OBJS.objections = [];
  // Миграция модулей: старый формат (text + inputs + buttons) → новый (blocks: [...])
  Object.entries(DATA.modules).forEach(([id, m])=>{
    if(!Array.isArray(m.blocks)){
      const blocks = [];
      if(m.text !== undefined && m.text !== ''){
        blocks.push({type:'text', text: m.text});
      }
      if(Array.isArray(m.inputs) && m.inputs.length){
        m.inputs.forEach(inp=>{
          if(inp && inp.var) blocks.push({type:'input', var: inp.var, label: inp.label || ''});
        });
      } else if(m.input && m.input.var){
        blocks.push({type:'input', var: m.input.var, label: m.input.label || ''});
      }
      if(Array.isArray(m.buttons) && m.buttons.length){
        blocks.push({type:'buttons', items: m.buttons});
      }
      m.blocks = blocks;
      delete m.text; delete m.input; delete m.inputs; delete m.buttons;
    }
    // САНИТАРИЯ: удалить null/undefined/невалидные элементы из blocks.
    // Бывает после старых багов DnD — спасает редактор от падения.
    const cleaned = [];
    let droppedCount = 0;
    m.blocks.forEach(b=>{
      if(!b || typeof b !== 'object' || !b.type){ droppedCount++; return; }
      if(b.type === 'buttons'){
        // Внутри items тоже могут быть null'ы
        b.items = (Array.isArray(b.items) ? b.items : []).filter(it => it && typeof it === 'object');
      }
      if(b.type === 'input' && typeof b.var !== 'string') b.var = '';
      cleaned.push(b);
    });
    if(droppedCount > 0){
      console.warn('[sanitize] модуль', id, '— удалено битых блоков:', droppedCount);
    }
    m.blocks = cleaned;
  });
  DATA.variables.forEach(v=>{
    if(!v.type) v.type = 'text';
    delete v.multiline;
    // Миграция в новую модель type+format
    if(v.type==='map' && !v.format){
      // старое: type:map, valueType — тип значений, keys — фикс. ключи
      v.format = 'map';
      v.type = 'text';      // ключи строковые
      v.keyType = 'text';
      if(!v.valueType) v.valueType = 'text';
    }
    if(v.type==='enum' && !v.format){
      // старое: type:enum (всегда single)
      v.format = 'single';
      // valueType у старого enum игнорируем — теперь это просто тип данных enum
      delete v.valueType;
    }
    if(!v.format) v.format = 'single';
  });
  // подчищаем broken parent у возражений
  const ids = new Set(OBJS.objections.map(o=>o.id));
  OBJS.objections.forEach(o=>{ if(o.parent && !ids.has(o.parent)) delete o.parent; });
  // По умолчанию свёрнуты все родительские возражения (которые имеют детей)
  const hasChildren = new Set();
  OBJS.objections.forEach(o=>{ if(o.parent) hasChildren.add(o.parent); });
  hasChildren.forEach(id=>COLLAPSED.add(id));
}
/* Загрузка двух отдельных файлов: scripts (модули/переменные/этапы) и objections (общая база).
   Любой аргумент может быть null — тогда соответствующая часть будет пустой. */
function initAll(scripts, objections, calls){
  DATA = scripts || {};
  OBJS = objections || {};
  if(calls){
    CALLS = calls;
  } else if(!CALLS) {
    CALLS = emptyCalls();
  }
  ensureCallsShape();
  // При перезагрузке файлов — сбросить флаги инициализации UI-состояний,
  // чтобы при следующем открытии редактора переменные снова свернулись.
  VARS_COLLAPSED_INITED = false;
  VARS_COLLAPSED.clear();
  ensureDataShape();
  resetVarsToDefaults();
  renderNotes();
  renderVars();
  renderStages();
  renderJump();
  renderObjList();
  HISTORY = [];
  CURRENT_OBJ = null;
  if(DATA.start) go(DATA.start, true);
  else document.getElementById('screen').innerHTML = '<div class="empty">Сценарий пуст. Перейди в ⚙ Редактор и создай модули.</div>';
  if(MODE==='calls') renderCalls();
  if(PENDING_EXTERNAL_IMPORT){
    const p = PENDING_EXTERNAL_IMPORT; PENDING_EXTERNAL_IMPORT = null;
    setTimeout(()=>applyExternalImport(p), 0);
  } else {
    setTimeout(processExternalImportFromLocation, 0);
  }
}

/* File System Access API + IndexedDB для хранения ручек */
const hasFSA = 'showOpenFilePicker' in window;

/* --- IndexedDB: хранилище FileSystemFileHandle между сессиями --- */
function idbOpen(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('rm-handles', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=> res(req.result);
    req.onerror   = ()=> rej(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=> res();
    tx.onerror    = ()=> rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=> res(req.result || null);
    req.onerror   = ()=> rej(req.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete(key);
    tx.oncomplete = ()=> res();
    tx.onerror    = ()=> rej(tx.error);
  });
}

async function getBackupDirHandle(){

async function chooseBackupDir(){

    alert('Выбор папки доступен только в Chrome/Edge. В других браузерах бэкапы будут скачиваться в загрузки.');
    return;
  }

  }catch(e){ if(e.name!=='AbortError') alert('Ошибка: '+e.message); }
}
function fmtBackupName(prefix){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${prefix}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.json`;
}
async function runBackup(force=false){
  if(!force && !_bkDirty) return false; // ничего не менялось
  if(!DATA && !OBJS && !CALLS) return false;
  try{
    const dir = await getBackupDirHandle();
    if(dir){
      const perm = await dir.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){
        const req = await dir.requestPermission({mode:'readwrite'});
        if(req!=='granted'){ console.warn('Нет прав на папку бэкапов'); return false; }
      }
      let bkDir;
      try{ bkDir = await dir.getDirectoryHandle('backups', {create:true}); }
      catch(e){ bkDir = dir; }
      // Скрипты
      if(DATA && Object.keys(DATA.modules||{}).length){
        await writeFileInDir(bkDir, fmtBackupName('scripts'), DATA);
        await rotateBackups(bkDir, 'scripts-', BACKUPS_KEEP);
      }
      // Возражения
      if(OBJS && (OBJS.objections||[]).length){
        await writeFileInDir(bkDir, fmtBackupName('objections'), OBJS);
        await rotateBackups(bkDir, 'objections-', BACKUPS_KEEP);
      }
      // Перезвоны (только если есть привязка к файлу и есть данные)
      if(CALLS_HANDLE && CALLS && (CALLS.items||[]).length){
        await writeFileInDir(bkDir, fmtBackupName('callbacks'), CALLS);
        await rotateBackups(bkDir, 'callbacks-', BACKUPS_KEEP);
      }
    } else {
      if(DATA && Object.keys(DATA.modules||{}).length) downloadFile(fmtBackupName('scripts'), DATA);
      if(OBJS && (OBJS.objections||[]).length)         downloadFile(fmtBackupName('objections'), OBJS);
      if(CALLS_HANDLE && CALLS && (CALLS.items||[]).length) downloadFile(fmtBackupName('callbacks'), CALLS);
    }
    _bkDirty = false;
    return true;
  }catch(e){
    console.error('Backup error:', e);
    return false;
  }
}
async function writeFileInDir(dir, name, data){
  const fh = await dir.getFileHandle(name, {create:true});
  const w = await fh.createWritable();
  await w.write(JSON.stringify(data, null, 2));
  await w.close();
}
async function rotateBackups(dir, prefix, keep){
  try{
    const names = [];
    for await (const [name, h] of dir.entries()){
      if(h.kind==='file' && name.startsWith(prefix) && name.endsWith('.json')) names.push(name);
    }
    names.sort(); // лексикографически по дате в имени
    const toDelete = names.slice(0, Math.max(0, names.length - keep));
    for(const n of toDelete){
      try{ await dir.removeEntry(n); }catch(e){}
    }
  }catch(e){ console.warn('rotate:', e); }
}
function scheduleBackups(){
  clearInterval(_bkTimer);
  if(!BACKUPS_ENABLED) return;
  const ms = Math.max(1, BACKUPS_INTERVAL_MIN) * 60 * 1000;
  _bkTimer = setInterval(()=>runBackup(false), ms);
}

async function saveViaHandle(handle, data){

  const perm = await handle.queryPermission({mode:'readwrite'}).catch(()=>null);

    const r = await handle.requestPermission({mode:'readwrite'}).catch(()=>null);
    if(r !== 'granted') throw new Error('нет прав на запись в файл «'+(handle.name||'?')+'»');
  }
  const w = await handle.createWritable();

  try{
    const f = await handle.getFile();

  }catch(e){ console.warn('[write] verify failed:', e); throw e; }

/* Сохранить .bak рядом с файлом — в той же папке, имя = "<filename>.bak".
   Делается через попытку получить родительскую папку из handle (Chrome 122+: handle.getParentDirectory).
   Если не получается — пишем .bak во временное хранилище OPFS. */
async function saveBackupBeside(handle, data){
  if(!handle) return false;
  const baseName = (handle.name||'file').replace(/\.json$/i,'') || 'file';
  // 1) Chrome 122+: getParentDirectory() — пишем .bak в ту же папку
  try{
    if(typeof handle.getParentDirectory === 'function'){
      const dir = await handle.getParentDirectory();
      const fh = await dir.getFileHandle(baseName + '.bak.json', {create:true});
      await saveViaHandle(fh, data);
      console.log('[bak] beside file via getParentDirectory:', baseName+'.bak.json');
      return true;
    }
  }catch(e){ console.warn('[bak] getParentDirectory failed:', e); }
  // 2) Резерв: выбранная папка бэкапов
  try{
    const dir = await getBackupDirHandle();
    if(dir){
      const perm = await dir.queryPermission({mode:'readwrite'});
      if(perm==='granted' || (await dir.requestPermission({mode:'readwrite'}))==='granted'){
        const fh = await dir.getFileHandle(baseName + '.last.bak.json', {create:true});
        await saveViaHandle(fh, data);
        console.log('[bak] in backup dir:', baseName+'.last.bak.json');
        return true;
      } else {
        console.warn('[bak] нет прав на папку бэкапов');
      }
    } else {
      console.warn('[bak] папка бэкапов не выбрана');
    }
  }catch(e){ console.warn('[bak] backup dir failed:', e); }
  return false;
}

/* ===== Защита от случайной перезаписи =====
   Возвращает true, если сохранять БЕЗОПАСНО (память не пустая, либо файл тоже пуст). */
function dataLooksEmpty(){
  return !DATA || !DATA.modules || Object.keys(DATA.modules).length===0;
}
function objsLookEmpty(){
  return !OBJS || !Array.isArray(OBJS.objections) || OBJS.objections.length===0;
}
async function fileLooksNonEmpty(handle, kind){
  if(!handle) return false;
  try{
    const f = await handle.getFile();
    if(f.size < 10) return false;
    const txt = await f.text();
    const parsed = JSON.parse(txt);
    if(kind==='scripts') return parsed?.modules && Object.keys(parsed.modules).length>0;
    if(kind==='objs')    return Array.isArray(parsed?.objections) && parsed.objections.length>0;
  }catch(e){}
  return false;
}
/* Проверка/запрос прав на запись по сохранённой ручке */
async function verifyHandlePermission(handle, mode='readwrite'){
  if(!handle) return false;
  try{
    if((await handle.queryPermission({mode}))==='granted') return true;
    if((await handle.requestPermission({mode}))==='granted') return true;
  }catch(e){}
  return false;
}
function downloadFile(name, data){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function markDirty(kind){
  // kind: 'scripts' | 'objs' | 'calls'. По умолчанию scripts (для совместимости старых вызовов).
  if(kind==='objs') DIRTY.objs = true;
  else if(kind==='calls') DIRTY.calls = true;
  else              DIRTY.scripts = true;
  _bkDirty = true;
  updateSaveBtn();
  if(AUTOSAVE && (SCRIPTS_HANDLE || OBJECTIONS_HANDLE || CALLS_HANDLE)){
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(()=>autoSave(), 500);
  }
}
function updateSaveBtn(){

  // Галка «автосохранение» показывается только в редакторе (в настройках она тоже есть).

  const partsStr = parts.length ? ' ('+parts.join(', ')+')' : '';

  if(any){
