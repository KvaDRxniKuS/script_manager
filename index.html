  } else {
    btn.textContent = fsaOn ? '💾 Сохранить + бэкап' : '💾 Скачать файлы';
    if(fsaOn){
      if(AUTOSAVE_ARMED) st.textContent = AUTOSAVE ? '✓ автосохранено (с защитой от пустой перезаписи)' : '✓ сохранено';
      else               st.textContent = '⚠ файл подключён, но автосейв пока заблокирован — нажми «Сохранить» один раз';
    } else {
      st.textContent = '✓ в памяти (нет привязки к файлам)';
    }
    st.className = 'save-state saved';
  }
}
let AUTOSAVE_ARMED = false;

async function autoSave(){
  if(!AUTOSAVE_ARMED) return;
  // Сохраняем независимо: если грязно scripts и есть handle — пишем; то же для objs.
  try{
    if(DIRTY.scripts && SCRIPTS_HANDLE){
      if(!(await verifyHandlePermission(SCRIPTS_HANDLE))) return;
      if(dataLooksEmpty() && await fileLooksNonEmpty(SCRIPTS_HANDLE,'scripts')){
        showSaveState('⚠ автосохранение скриптов остановлено: в памяти пусто, а файл содержит данные.', true);
      } else {
        await saveViaHandle(SCRIPTS_HANDLE, DATA);
        DIRTY.scripts = false;
      }
    }
    if(DIRTY.objs && OBJECTIONS_HANDLE){
      if(!(await verifyHandlePermission(OBJECTIONS_HANDLE))) return;
      if(objsLookEmpty() && await fileLooksNonEmpty(OBJECTIONS_HANDLE,'objs')){
        showSaveState('⚠ автосохранение возражений остановлено: в памяти пусто, а файл содержит данные.', true);
      } else {
        await saveViaHandle(OBJECTIONS_HANDLE, OBJS);
        DIRTY.objs = false;
      }
    }
    if(DIRTY.calls && CALLS_HANDLE){
      if(!(await verifyHandlePermission(CALLS_HANDLE))) return;
      await saveViaHandle(CALLS_HANDLE, CALLS);
      DIRTY.calls = false;
    }
    updateSaveBtn();
  }catch(e){
    showSaveState('⚠ ошибка автосохранения: '+e.message, true);
  }
}
function showSaveState(text, dirty){
  const st = document.getElementById('saveState');
  if(!st) return;
  st.textContent = text;
  st.className = 'save-state ' + (dirty ? 'dirty' : 'saved');
}

async function saveAll(){
  const log = [];
  const results = []; // [{kind, name, ok, bakOk}]

  async function saveOne(kind, handle, payload, emptyCheckFn, defaultName){
    const r = { kind, name: handle?.name || defaultName, ok:false, bakOk:false };
    try{
      if(handle){
        if(emptyCheckFn() && await fileLooksNonEmpty(handle, kind)){
          if(!confirm('В памяти '+(kind==='objs'?'возражения ПУСТЫ':'сценарий ПУСТ')+', а в файле «'+handle.name+'» есть данные.\nПерезаписать пустым?')){
            log.push(kind+': пропущено пользователем');
            return r;
          }
        }
        r.bakOk = await saveBackupBeside(handle, payload).catch(e=>{log.push(kind+' .bak FAIL: '+e.message); return false;});
        await saveViaHandle(handle, payload);
        r.ok = true;
        if(kind==='objs') DIRTY.objs = false;
        else if(kind==='calls') DIRTY.calls = false;
        else DIRTY.scripts = false;
      } else {
        downloadFile(defaultName, payload);
        r.ok = true;
        if(kind==='objs') DIRTY.objs = false;
        else if(kind==='calls') DIRTY.calls = false;
        else DIRTY.scripts = false;
      }
    }catch(e){
      log.push(kind+' FAIL: '+e.message);
      console.error('[save] '+kind+' ERROR:', e);
    }
    return r;
  }
  function callsLookEmpty(){ return !CALLS || !Array.isArray(CALLS.items) || CALLS.items.length===0; }

  // Логика: сохраняем только те части, что грязные.
  // Если ничего не грязно — пересохраняем то, что привязано (по нажатию кнопки).
  // Если нет вообще никакой привязки — скачиваем то, что не пусто.
  const noHandles = !SCRIPTS_HANDLE && !OBJECTIONS_HANDLE && !CALLS_HANDLE;
  const nothingDirty = !DIRTY.scripts && !DIRTY.objs && !DIRTY.calls;

  if(noHandles){
    results.push(await saveOne('scripts', null, DATA, dataLooksEmpty, 'scripts.json'));
    results.push(await saveOne('objs',    null, OBJS, objsLookEmpty,  'objections.json'));
    if(!callsLookEmpty()) results.push(await saveOne('calls', null, CALLS, callsLookEmpty, 'callbacks.json'));
  } else {
    if(DIRTY.scripts || (nothingDirty && SCRIPTS_HANDLE)){
      results.push(await saveOne('scripts', SCRIPTS_HANDLE, DATA, dataLooksEmpty, 'scripts.json'));
    }
    if(DIRTY.objs || (nothingDirty && OBJECTIONS_HANDLE)){
      results.push(await saveOne('objs', OBJECTIONS_HANDLE, OBJS, objsLookEmpty, 'objections.json'));
    }
    if(DIRTY.calls || (nothingDirty && CALLS_HANDLE)){
      results.push(await saveOne('calls', CALLS_HANDLE, CALLS, callsLookEmpty, 'callbacks.json'));
    }
  }

  AUTOSAVE_ARMED = true;
  updateSaveBtn();

  const allOk = results.length>0 && results.every(r=>r.ok);
  const parts = results.map(r => r.ok ? ('✓ '+r.name + (r.bakOk?' + .bak':'')) : ('✗ '+r.name));
  showSaveState((allOk?'✓ Сохранено: ':'⚠ ')+parts.join(' · ') + (log.length?' · '+log.join(' · '):''), !allOk);
  if(log.length) console.warn('[save] log:', log);

  if(!allOk && (SCRIPTS_HANDLE || OBJECTIONS_HANDLE)){
    alert('Не все файлы сохранены.\nЛог: '+log.join(' / ')+'\n\nОткрой DevTools (F12) для деталей.');
  }
}

/* ============================================================
   УСЛОВИЯ (с поддержкой && / ||)
============================================================ */
/* Извлечь значение по «пути» через точку: var, var.length, var.count, var.literal_key.
   Поддерживает map-lookup и .length / .count для массивов, map, строк. */
function evalLookup(path){
  if(!path) return undefined;
  const dot = path.indexOf('.');
  if(dot<0){
    return VARS[path];
  }
  const head = path.slice(0, dot);
  const tail = path.slice(dot+1).trim();
  const raw = VARS[head];
  if(tail==='length' || tail==='count'){
    if(Array.isArray(raw)) return raw.length;
    if(raw && typeof raw==='object') return Object.keys(raw).length;
    if(typeof raw==='string') return raw.length;
    return 0;
  }
  // map lookup
  if(raw && typeof raw==='object' && !Array.isArray(raw)){
    return raw[tail];
  }
  return undefined;
}
/* Сравнить два значения с учётом типов: пытаемся числа → число, иначе строки. */
function evalCompare(left, op, rightRaw){
  // array == value: проверка «содержит» (удобно для array<enum>)
  if(Array.isArray(left)){
    const has = left.map(x=>String(x)).includes(String(rightRaw));
    if(op==='==') return has;
    if(op==='!=') return !has;
  }
  // bool
  if(typeof left==='boolean'){
    const r = (rightRaw===true || String(rightRaw).trim()==='true');
    if(op==='==') return left===r;
    if(op==='!=') return left!==r;
  }
  const ls = String(left??'').trim(), rs = String(rightRaw??'').trim();
  const isNum = x => /^-?\d+(\.\d+)?$/.test(String(x).trim());
  const numeric = isNum(ls) && isNum(rs);
  const ln = numeric ? Number(ls) : NaN;
  const rn = numeric ? Number(rs) : NaN;
  switch(op){
    case '==': return numeric ? ln===rn : ls===rs;
    case '!=': return numeric ? ln!==rn : ls!==rs;
    case '>=': return numeric && ln>=rn;
    case '<=': return numeric && ln<=rn;
    case '>':  return numeric && ln>rn;
    case '<':  return numeric && ln<rn;
  }
  return false;
}
function stripOuterParensExpr(s){
  s = String(s||'').trim();
  while(s.startsWith('(') && findMatching(s, 0, '(', ')') === s.length-1){
    s = s.slice(1, -1).trim();
  }
  return s;
}
function splitTopLevelLogical(s, op){
  const out = [];
  let buf = '';
  let pDepth = 0, sqDepth = 0, brDepth = 0;
  let quote = '';
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(quote){
      buf += c;
      if(c===quote && s[i-1] !== '\\') quote = '';
      continue;
    }
    if(c==='"' || c==="'"){ quote = c; buf += c; continue; }
    if(c==='{') brDepth++;
    else if(c==='}' && brDepth>0) brDepth--;
    else if(brDepth===0){
      if(c==='(') pDepth++;
      else if(c===')' && pDepth>0) pDepth--;
      else if(c==='[') sqDepth++;
      else if(c===']' && sqDepth>0) sqDepth--;
      if(pDepth===0 && sqDepth===0 && s.slice(i, i+op.length)===op){
        out.push(buf.trim());
        buf = '';
        i += op.length-1;
        continue;
      }
    }
    buf += c;
  }
  out.push(buf.trim());
  return out.filter(x=>x!=='' || out.length===1);
}
function hasTopLevelLogical(s, op){ return splitTopLevelLogical(s, op).length > 1; }
function parseConditionValue(raw){
  let r = String(raw??'').trim();
  r = stripOuterParensExpr(r);
  const quoted = r.match(/^["']([\s\S]*)["']$/);
  if(quoted) return quoted[1];
  if(r==='true') return true;
  if(r==='false') return false;
  if(r==='null') return null;
  if(/^-?\d+(\.\d+)?$/.test(r)) return parseFloat(r);
  // Если справа реально путь к существующей переменной — берём её значение.
  // Иначе оставляем как строковый литерал: mood==хорошее, device_type==ноутбук.
  if(/^[a-zA-Zа-яА-Я_][a-zA-Zа-яА-Я0-9_.]*$/.test(r)){
    const head = r.split('.')[0];
    if(head in VARS){
      const v = evalLookup(r);
      if(v!==undefined) return v;
    }
  }
  return r;
}
function evalCompareAgainstExpr(left, op, rightExpr){
  const r = stripOuterParensExpr(rightExpr);
  // Сахар: x == (a || b)  →  x==a || x==b
  //        x != (a || b)  →  x!=a && x!=b
  // Также работает с && внутри скобок, если нужно строгое объединение.
  const orParts = splitTopLevelLogical(r, '||');
  if(orParts.length > 1){
    if(op==='!=') return orParts.every(part=>evalCompareAgainstExpr(left, op, part));
    return orParts.some(part=>evalCompareAgainstExpr(left, op, part));
  }
  const andParts = splitTopLevelLogical(r, '&&');
  if(andParts.length > 1){
    if(op==='!=') return andParts.some(part=>evalCompareAgainstExpr(left, op, part));
    return andParts.every(part=>evalCompareAgainstExpr(left, op, part));
  }
  return evalCompare(left, op, parseConditionValue(r));
}
function evalSimple(expr){
  let s = String(expr).trim();
  if(!s) return true;
  const stripped = stripOuterParensExpr(s);
  if(stripped !== s) return evalIf(stripped);
  s = stripped;
  let m;

  // !expr / !(a || b)
  if(s[0]==='!') return !evalIf(s.slice(1).trim());

  // path IN (a, b) / path in (a || b) / path not in (...)
  m = s.match(/^([a-zA-Zа-яА-Я0-9_.]+)\s+(not\s+in|in)\s*\(([^]*)\)$/i);
  if(m){
    const left = evalLookup(m[1]);
    const neg = /^not\s+in$/i.test(m[2]);
    let body = m[3].trim();
    let parts;
    if(hasTopLevelLogical(body, '||')) parts = splitTopLevelLogical(body, '||');
    else parts = splitTopLevel(body, ',');
    const ok = parts.some(part => evalCompare(left, '==', parseConditionValue(part)));
    return neg ? !ok : ok;
  }

  // path OP value     (path может быть var | var.length | var.count | var.key)
  m = s.match(/^([a-zA-Zа-яА-Я0-9_.]+)\s*(==|!=|>=|<=|>|<)\s*(.+)$/);
  if(m){
    const [_, path, op, rawV] = m;
    const left = evalLookup(path);
    return evalCompareAgainstExpr(left, op, rawV);
  }

  // var | var.length | var.key — проверка непустоты
  m = s.match(/^([a-zA-Zа-яА-Я0-9_.]+)$/);
  if(m){
    return valNonEmpty(evalLookup(m[1]));
  }
  // Не распарсилось — это ошибка в условии. Возвращаем FALSE (а не true),
  // чтобы оператор увидел проблему и поправил, а не показывал случайно.
  console.warn('[evalSimple] не понял условие:', JSON.stringify(s));
  return false;
}
function evalIf(expr){
  if(!expr) return true;
  if(Array.isArray(expr)) return expr.every(e=>evalIf(e));
  let s = stripOuterParensExpr(String(expr).trim());
  if(!s) return true;
  // Полноценнее, чем старое split: учитываем скобки и строки.
  const orParts = splitTopLevelLogical(s, '||');
  if(orParts.length > 1) return orParts.some(part => evalIf(part));
  const andParts = splitTopLevelLogical(s, '&&');
  if(andParts.length > 1) return andParts.every(part => evalIf(part));
  return evalSimple(s);
}

/* ============================================================
   ПОДСТАНОВКА
============================================================ */
function valToString(v){
  if(v===undefined||v===null) return '';
  if(typeof v==='boolean') return v?'да':'нет';
  if(Array.isArray(v)) return v.join(', ');
  if(typeof v==='object'){
    // map → "ключ1: знач, ключ2: знач"
    const parts = [];
    for(const [k,vv] of Object.entries(v)){
      if(typeof vv==='boolean'){ if(vv) parts.push(k); }
      else if(valNonEmpty(vv)) parts.push(`${k}: ${vv}`);
    }
    return parts.join(', ');
  }
  return String(v);
}
/* Подстановка {выражение}. Внутри {} может быть:
   - {var}             — простая переменная (с подсветкой missing/empty)
   - {var.count}       — длина массива или число ключей map
   - {var.length}      — то же что count
   - {var+1}, {var-1}, {var*2}, {var/2} — арифметика
   - {var1+var2}       — комбинация
   Парсинг минимальный, без скобок и приоритета (left-to-right с приоритетом умножения/деления над сложением/вычитанием).
*/
function interpolate(str){
  let s = String(str);
  // 1) Рекурсивно резолвим ВЛОЖЕННЫЕ {...}: ищем самые внутренние (без { внутри) и заменяем,
  //    пока ничего не меняется. Это позволяет писать {map.{other_var}}.
  //    Защита от бесконечного цикла — максимум 8 проходов.
  for(let pass=0; pass<8; pass++){
    const before = s;
    s = s.replace(/\{([^{}]+)\}/g, (m, expr)=>{
      expr = expr.trim();
      // Map-lookup: {mapVar.literalKey} — literalKey может содержать пробелы, кириллицу и т.д.
      // Регексп: имя — латиница/цифры/_, далее точка, далее всё кроме { } } до конца — это ключ.
      const mapLk = expr.match(/^([a-zA-Z0-9_]+)\.([^{}.][^{}]*)$/);
      if(mapLk){
        const vname = mapLk[1], key = mapLk[2].trim();
        const def = varDef(vname);
        if(def && varFormat(def)==='map'){
          const obj = VARS[vname];
          if(!obj || typeof obj!=='object') return `__EMPTY__${vname}.${key}__`;
          if(!(key in obj)){
            // Подсветим как «нет такого ключа»
            return `__MISSING__${vname}.${key}__`;
          }
          const sv = valToString(obj[key]).trim();
          return sv==='' ? `__EMPTY__${vname}.${key}__` : sv;
        }
        // Если это .count/.length — оставим для evalExpr ниже
        if(def && (key==='count' || key==='length')){
          // не трогаем — пропадёт в основной ветке
        } else if(def){
          // .key для не-map: попробуем как expression (fallback)
        }
      }
      // Простая переменная
      const simple = expr.match(/^([a-zA-Z0-9_]+)$/);
      if(simple){
        const key = simple[1];
        const def = varDef(key);
        if(!def) return `__MISSING__${key}__`;
        const v = VARS[key];
        const sv = valToString(v).trim();
        return sv==='' ? `__EMPTY__${key}__` : sv;
      }
      // Выражение (числа, .count, +-*/)
      try{
        const result = evalExpr(expr);
        if(result===undefined||result===null) return '';
        return valToString(result);
      }catch(e){
        return `__EXPRERR__${expr}__`;
      }
    });
    if(s === before) break;
  }
  return s;
}

/* Вычислитель выражений.
   Поддерживает: числа, строки в кавычках, переменные (var, var.count, var.length),
   операторы + - * /, конкатенацию строк через +, унарный минус.
   Без скобок. */
function evalExpr(expr){
  const tokens = tokenize(expr);
  // Простой парсер: сначала * /, потом + -.
  // Преобразуем токены в массив значений и операторов
  // Унарный минус: если первый токен '-' — считаем как 0 - X
  let i = 0;
  function readValue(){
    let neg = false;
    while(tokens[i]==='-' || tokens[i]==='+'){
      if(tokens[i]==='-') neg = !neg;
      i++;
    }
    const tok = tokens[i++];
    if(tok===undefined) throw new Error('unexpected end');
    let val;
    if(typeof tok === 'object'){ val = tok.value; }
    else if(/^-?\d+(\.\d+)?$/.test(tok)) val = parseFloat(tok);
    else if(/^['"](.*)['"]$/.test(tok)) val = tok.slice(1,-1);
    else { // identifier with optional .prop  (либо .count/.length, либо .map_key)
      const m = tok.match(/^([a-zA-Z0-9_]+)(?:\.(.+))?$/);
      if(!m) throw new Error('bad token: '+tok);
      const def = varDef(m[1]);
      const raw = VARS[m[1]];
      if(m[2]){
        if(m[2]==='count' || m[2]==='length'){
          if(Array.isArray(raw)) val = raw.length;
          else if(raw && typeof raw === 'object') val = Object.keys(raw).length;
          else if(typeof raw === 'string') val = raw.length;
          else val = 0;
        } else if(def && varFormat(def)==='map'){
          // Map lookup по литеральному ключу
          if(raw && typeof raw === 'object' && !Array.isArray(raw) && (m[2] in raw)){
            val = raw[m[2]];
          } else {
            val = '';
          }
        } else throw new Error('unknown prop: '+m[2]);
      } else {
        val = raw;
      }
      // если число в строке — попробуем сконвертировать
      if(typeof val === 'string' && /^-?\d+(\.\d+)?$/.test(val)) val = parseFloat(val);
    }
    return neg ? (typeof val==='number' ? -val : val) : val;
  }
  // Сначала * /
  let lhs = readValue();
  while(i<tokens.length){
    const op = tokens[i];
    if(op==='*' || op==='/'){
      i++;
      const rhs = readValue();
      lhs = op==='*' ? lhs*rhs : lhs/rhs;
    } else if(op==='+' || op==='-'){
      i++;
      // для + и - нужно собрать всю правую часть с учётом * / приоритета
      let rhs = readValue();
      while(i<tokens.length && (tokens[i]==='*' || tokens[i]==='/')){
        const op2 = tokens[i++]; const v2 = readValue();
        rhs = op2==='*' ? rhs*v2 : rhs/v2;
      }
      if(op==='+'){
        // конкатенация если хотя бы одно строка
        if(typeof lhs==='string' || typeof rhs==='string') lhs = String(lhs) + String(rhs);
        else lhs = lhs + rhs;
      } else {
        lhs = lhs - rhs;
      }
    } else throw new Error('unexpected: '+op);
  }
  return lhs;
}
function tokenize(s){
  const tokens = [];
  const re = /\s+|([+\-*/])|('[^']*'|"[^"]*"|[a-zA-Zа-яА-Я0-9_.]+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push(m[1]);
    else if(m[2]) tokens.push(m[2]);
  }
  return tokens;
}
function interpolateHTML(str){
  // 1) Условные блоки (рекурсивно, до подстановок)
  let conditioned = renderConditionals(String(str||''));
  // 1a) Защита от случайных «дыр»: 3+ переносов подряд → не более 2 (одна пустая строка).
  //     Это нормализует результат после удаления условных блоков, не ломая намеренные двойные переносы.
  conditioned = conditioned.replace(/\n{3,}/g, '\n\n');
  // 1b) Если итог начинается/заканчивается переносами — обрезаем (тоже от схлопнутых блоков на краях)
  conditioned = conditioned.replace(/^\n+/, '').replace(/\n+$/, '');
  // 2) Подстановки + экранирование
  let out = escHTML(interpolate(conditioned));
  out = out.replace(/__MISSING__(.+?)__/g,(_,k)=>`<mark class="missing">{${k}?}</mark>`);
  out = out.replace(/__EMPTY__(.+?)__/g,(_,k)=>`<mark class="missing">{${k}: пусто}</mark>`);
  out = out.replace(/__EXPRERR__(.+?)__/g,(_,e)=>`<mark class="missing">{${e} = ошибка}</mark>`);
  // Ссылки на возражения (Текст|ID)
  out = out.replace(/\(([^|)]+)\|([^|)]+)\)/g, (_, text, id) => `<span class="obj-link-inline" data-objid="${escHTML(id)}">${text}</span>`);
  // 3) Inline-маркеры и сворачиваемые блоки
  out = renderInlineMarks(out);
  out = renderCollapsibles(out);
  return out;
}

/* Условные блоки в тексте:
     (условие)[текст если true]
     (условие)[текст если true:текст если false]
   Двоеточие на верхнем уровне квадратных скобок разделяет ветки.
   Вложенность: внутри веток могут быть свои (...)[...] блоки — обрабатываются рекурсивно.
   Скобки/двоеточия внутри подстановок {...} не учитываются как структурные. */
function renderConditionals(text){
  let result = '';
  let i = 0;
  const n = text.length;
  while(i < n){
    const ch = text[i];
    // Кандидат на условный блок: ( ... ) [ ...
    if(ch === '('){
      const condEnd = findMatching(text, i, '(', ')');
      if(condEnd > i && text[condEnd+1] === '['){
        const bracketEnd = findMatching(text, condEnd+1, '[', ']');
        if(bracketEnd > condEnd+1){
          const condExpr = text.slice(i+1, condEnd).trim();
          // Содержимое скобок. Срезаем ровно один ведущий и один хвостовой \n,
          // чтобы многострочное оформление вида "(x)[\nтекст\n]" не давало лишних
          // пустых строк. То есть "[" и "]" сами на своих строках "съедают" свою строку.
          // Алгоритм: пока первая (последняя) строка целиком пуста — удаляем её вместе с \n.
          // Так корректно обрабатываются и [\n]…[\n], и [\n\n]…[\n\n] (когда оператор оставил
          // пустую строку перед ] для читаемости — она тоже служебная).
          const trimEdgeNL = s => {
            s = String(s||'');
            // ведущие пустые строки
            while(true){
              const m = s.match(/^([ \t]*)\n/);
              if(!m) break;
              s = s.slice(m[0].length);
            }
            // хвостовые пустые строки
            while(true){
              const m = s.match(/\n([ \t]*)$/);
              if(!m) break;
              s = s.slice(0, -m[0].length);
            }
            return s;
          };
          let inner = trimEdgeNL(text.slice(condEnd+2, bracketEnd));
          const parts = splitTopLevel(inner, ':');
          // К каждой ветке тоже — границы с : могут иметь служебные пустые строки.
          const truePart  = trimEdgeNL(parts[0] || '');
          const falsePart = trimEdgeNL(parts.length>1 ? parts.slice(1).join(':') : '');
          let chosen;
          try{
            chosen = evalIf(condExpr) ? truePart : falsePart;
          }catch(e){
            chosen = '(условие «'+condExpr+'» = ошибка)';
          }
          // Рекурсивно обработать выбранную ветку
          const rendered = renderConditionals(chosen);

          // Нормализация переносов: блок может занимать «целую строку» в исходнике.
          //   Случай 1 (блок на своей строке + ветка пустая): схлопываем ВСЕ \n
          //     сразу после ]. Тогда останутся только те переносы, что были ДО блока
          //     (в result), и пустые строки между «A\n\n[блок]\n\nB» превратятся
          //     в «A\n\nB» (а не «A\n\n\nB» с лишней пустой строкой).
          //   Случай 2 (блок на своей строке + ветка непустая): оставляем как есть.
          //   Случай 3 (inline в строке): не делаем ничего — обычная подстановка.
          const prevCh = result.length ? result[result.length-1] : '\n';
          const nextCh = bracketEnd+1 < n ? text[bracketEnd+1] : '\n';
          const onOwnLine = (prevCh === '\n') && (nextCh === '\n');

          result += rendered;
          let nextPos = bracketEnd + 1;
          if(onOwnLine && rendered === ''){
            // Съедаем все идущие подряд \n после блока — результирующее количество
            // переносов = то, что в result уже есть (от исходного префикса).
            while(text[nextPos] === '\n') nextPos++;
          }
          i = nextPos;
          continue;
        }
      }
    }
    result += ch;
    i++;
  }
  return result;
}
/* Найти позицию парной закрывающей скобки. Уважает {...} (подстановки) и
   игнорирует структурные скобки внутри них. */
function findMatching(s, startIdx, openCh, closeCh){
  let depth = 0;
  let inBrace = 0; // вложенность {...}
  for(let i=startIdx; i<s.length; i++){
    const c = s[i];
    if(c === '{') inBrace++;
    else if(c === '}' && inBrace>0) inBrace--;
    else if(inBrace===0){
      if(c === openCh) depth++;
      else if(c === closeCh){
        depth--;
        if(depth===0) return i;
      }
    }
  }
  return -1;
}
/* Разбить строку по разделителю на ВЕРХНЕМ уровне (не внутри скобок и {...}).
   Возвращает массив частей. */
function splitTopLevel(s, sep){
  const parts = [];
  let buf = '';
  let pDepth = 0, sqDepth = 0, brDepth = 0;
  for(let i=0; i<s.length; i++){
    const c = s[i];
    if(c==='{') brDepth++;
    else if(c==='}' && brDepth>0) brDepth--;
    else if(brDepth===0){
      if(c==='(') pDepth++;
      else if(c===')' && pDepth>0) pDepth--;
      else if(c==='[') sqDepth++;
      else if(c===']' && sqDepth>0) sqDepth--;
      else if(c===sep && pDepth===0 && sqDepth===0){
        parts.push(buf); buf=''; continue;
      }
    }
    buf += c;
  }
  parts.push(buf);
  return parts;
}

/* Inline-форматирование:
     \!! текст \!!   — жёлтая жирная подсветка (важное)
     \!  текст \!    — синяя подсветка (обычное выделение)
   Сначала ищем двойной маркер (чтобы он не съелся одинарным).
   Текст внутри маркеров не может содержать сами маркеры. */
/* Расшифровать базовые HTML-сущности (обратная к escHTML) — для получения plain-text,
   который положим в data-copy у копируемых блоков. */
function unescHTML(s){
  return String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
}
/* Убрать HTML-теги из строки (для получения чистого текста копирования). */
function stripTags(s){ return String(s||'').replace(/<[^>]+>/g,''); }

function renderInlineMarks(html){
  // \\!! ... \\!! — жёлтый (важное, как в возражениях)
  html = html.replace(/\\!!([\s\S]+?)\\!!/g, '<mark class="mk-yellow">$1</mark>');
  // \\! ... \\! — синий (обычное выделение)
  html = html.replace(/\\!([\s\S]+?)\\!/g,   '<mark class="mk-blue">$1</mark>');
  // \% ... \% — копируемый блок (клик = копировать plain-text в буфер).
  // Синтаксис с экранированием: обратный слэш перед %, чтобы обычные проценты в тексте
  // (например "скидка 20%", "100% гарантия") не превращались в копируемые блоки.
  html = html.replace(/\\%([\s\S]+?)\\%/g, (_, inner)=>{
    // inner уже прошёл escHTML и может содержать <mark> от предыдущих замен — это ок для отображения.
    // Для data-copy декодируем сущности и убираем теги, чтобы копировался чистый текст.
    const plain = unescHTML(stripTags(inner));
    return '<span class="copy-block" data-copy="'+escHTML(plain)+'">'+inner+'</span>';
  });
  return html;
}

/* Сворачиваемые блоки:
     \\\Заголовок              — открывающий: \\\ или \\\+ (раскрыт) с заголовком в той же строке
     любое содержимое (включая вложенные \\\ блоки — любой глубины)
     \\\                       — закрывающий: \\\ один на строке, без заголовка

   Парсер построчный со стеком: каждая открывающая строка кладёт фрейм в стек,
   каждая закрывающая — сворачивает текущий фрейм в <div class="collapsible">.
   Так автоматически поддерживается неограниченная вложенность. */
/* Парсер сворачиваемых блоков.
   Каждый фрейм держит массив items = [{type:'line'|'block', content}].
   При финальной склейке \n ставится ТОЛЬКО между двумя соседними line.
   Между block↔block, block↔line и наоборот — без \n (блок сам по себе block-элемент в DOM
   и не нуждается в окружающих переносах строк pre-wrap). */
function renderCollapsibles(html){
  const stack = [{ isRoot:true, items:[] }];
  const push = (item)=> stack[stack.length-1].items.push(item);
  const trimTrailingBlankLines = ()=>{
    const arr = stack[stack.length-1].items;
    while(arr.length){
      const last = arr[arr.length-1];
      if(last.type==='line' && /^\s*$/.test(last.content)) arr.pop();
      else break;
    }
  };

  const reClose = /^\s*\\{3}\s*$/;
  const reOpen  = /^\s*\\{3}(\+)?\s*(\S.*?)\s*$/;

  // Счётчик для стабильной идентификации блоков между перерисовками текста
  // (нужно чтобы сохранять состояние open/closed при interpolateHTML по изменению переменных).
  let blockSeq = 0;

  const lines = html.split('\n');
  for(const raw of lines){
    if(reClose.test(raw)){
      trimTrailingBlankLines();
      if(stack.length > 1){
        const frame = stack.pop();
        const body = joinItems(frame.items);
        const titleClean = (frame.title||'').trim() || '(без заголовка)';
        const id = ++blockSeq;
        const blockHtml = `<div class="collapsible${frame.isOpen?' open':''}" data-coll-id="${id}">`
          + `<button type="button" class="collapsible-head">`
          +   `<span class="collapsible-arrow"></span>`
          +   `<span class="collapsible-title">${titleClean}</span>`
          + `</button>`
          + `<div class="collapsible-body">${body}</div>`
          + `</div>`;
        push({type:'block', content:blockHtml});
      } else {
        push({type:'line', content:raw});
      }
      continue;
    }
    const mOpen = raw.match(reOpen);
    if(mOpen){
      stack.push({ isOpen: !!mOpen[1], title: mOpen[2], items: [] });
      continue;
    }
    push({type:'line', content:raw});
  }
  while(stack.length > 1){
    const frame = stack.pop();
    stack[stack.length-1].items.push({type:'line', content:'⚠ Незакрытый блок «'+(frame.title||'')+'»:'});
    frame.items.forEach(it=>stack[stack.length-1].items.push(it));
  }
  return joinItems(stack[0].items);
}

/* Сохранить состояние open у всех блоков в контейнере (по data-coll-id), вернуть Set. */
function snapshotCollapsibleState(container){

/* Применить состояние open к блокам в контейнере. */
function applyCollapsibleState(container, openSet){

  container.querySelectorAll('.collapsible[data-coll-id]').forEach(d=>{

/* Склейка items.
   \n ставим:
     - между двумя line-элементами (обычные строки)
     - между line и block, или block и line (чтобы текст не прилипал к блоку)
   НЕ ставим между двумя block (у блоков свой margin делает зазор). */
function joinItems(items){
  let out = '';
  for(let i=0;i<items.length;i++){
    const it = items[i];
    if(i>0){
      const prev = items[i-1];
      if(prev.type !== 'block') out += '\n';
    }
    out += it.content;
  }
  return out;
}

/* Парсить YYYY-MM-DD в локальную дату (полночь). */
function parseDate(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], 0,0,0,0);
}
function fmtDate(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  const y=d.getFullYear(), M=String(d.getMonth()+1).padStart(2,'0'), D=String(d.getDate()).padStart(2,'0');
  return `${y}-${M}-${D}`;
}
function parseTime(s){
  if(!s) return null;
  const m = String(s).match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  return { h:+m[1], m:+m[2] };
}
/* Дата+время конца (null — бесконечность). */
function callEndDateTime(c){
  const d = parseDate(c.date); if(!d) return null;
  if(c.timeTo){
    const t = parseTime(c.timeTo); if(!t) return null;
    d.setHours(t.h, t.m, 0,0);
    return d;
  }
  if(c.timeFrom){
    const t = parseTime(c.timeFrom); if(!t) return null;
    d.setHours(t.h, t.m, 0,0);
    return d;
  }
  return d; // полночь
}
function callStartDateTime(c){
  const d = parseDate(c.date); if(!d) return null;
  if(c.timeFrom){
    const t = parseTime(c.timeFrom);
    if(t){ d.setHours(t.h, t.m, 0,0); return d; }
  }
  if(c.timeTo){
    const t = parseTime(c.timeTo);
    if(t){ d.setHours(t.h, t.m, 0,0); return d; }
  }
  return d;
}
function todayDateStr(){ return fmtDate(new Date()); }
/* Статус звонка: overdue / today / upcoming / archived */
/* Система тегов звонка. У одного звонка может быть несколько тегов:
   - archived  — в архиве;
   - today     — актуален сегодня (дата сегодня/прошлая/нет даты) — «надо сегодня»;
   - upcoming  — будущий (дата в будущем) ИЛИ время «с» ещё не наступило;
   - overdue   — просрочен (есть «до» и окно уже прошло).
   Фильтры сортируют по наличию тега. */
function callTags(c){
  if(c.archived) return ['archived'];
  const tags = [];
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
  const cd = parseDate(c.date);
  const cdMs = cd ? cd.getTime() : today.getTime();
  const nowM = now.getHours()*60 + now.getMinutes();
  const f = parseTime(c.timeFrom);
  const t = parseTime(c.timeTo);
  const fromM = f ? (f.h*60+f.m) : null;
  const toM   = t ? (t.h*60+t.m) : null;
  // фактическое время следующего перезвона (если есть — оно приоритетнее окна С-ДО)
  const n = parseTime(c.nextTime);
  const nextM = n ? (n.h*60+n.m) : null;

  if(cdMs > today.getTime()){ tags.push('upcoming'); return tags; } // дата в будущем

  tags.push('today'); // сегодня / прошлая дата / без даты — нужно сделать сегодня

  // «не пора ещё»: если есть nextTime — по нему; иначе по времени «с» окна
  if(nextM !== null && nowM < nextM) tags.push('upcoming');
  else if(nextM === null && fromM !== null && nowM < fromM) tags.push('upcoming');

  // просрочен (окно «до» уже прошло) — окно остаётся рамкой
  if(toM !== null && nowM > toM) tags.push('overdue');
  return tags;
}
/* Основной статус для сортировки и оформления карточки. */
function callStatus(c){
  const tg = callTags(c);
  const prio = ['archived','overdue','today','upcoming'];
  for(const p of prio) if(tg.includes(p)) return p;
  return 'today';
}

/* Список вариантов времени с шагом 30 минут, с 08:00 до 21:00 включительно (не звоним после 21). */
/* Список смещений от МСК (работа по МСК, вся РФ).
   Диапазон МСК-1…МСК+9 → выбираем как +/- от МСК (смещение от 0 = Москва).
   Для простоты UI отображаем в формате «МСК±N», utc вычисляем как 3+msk.
   По запросу пользователя смещение +/- 0..7ч по МСК (плюс МСК-1 для Калининграда для полноты). */
const CALL_TIMEZONES = (()=>{
  const out = [];
  // Работаем по МСК (msk=0), обслуживаем всю РФ. МСК-1 (Калининград) и +0..+7.
  for(let msk=-1; msk<=7; msk++){
    const utc = 3+msk;
    let label, shortName;
    if(msk===0){ label='МСК (Москва)'; shortName='МСК'; }
    else if(msk<0){ label='МСК-1 (Калининград)'; shortName='МСК-1'; }
    else { label='МСК+'+msk; shortName='МСК+'+msk; }
    out.push({utc, msk, label, shortName});
  }
  return out;
})();
const DEFAULT_TZ_UTC = 3; // Москва по умолчанию
/* Получить время клиента по часовому поясу (часы, минуты, дата как объект Date в UTC с указанным сдвигом). */
function clientNow(tzHours){
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset()*60000; // мс от эпохи в UTC
  return new Date(utcMs + (tzHours||DEFAULT_TZ_UTC)*3600*1000);
}
/* Локализованная строка времени клиента (HH:MM). */
function clientTimeStr(tzHours){
  const d = clientNow(tzHours);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
/* Дата клиента в формате YYYY-MM-DD (по его часовому поясу). */
function clientDateStr(tzHours){ return fmtDate(clientNow(tzHours)); }
/* Допустим ли звонок сейчас у клиента: НЕ звоним после 21:00 по времени клиента (8:00–20:59).
   Галочка ignoreTz = «клиент разрешил звонить в любое время» — проверку пропускаем. */
function isClientCallAllowed(tzHours, ignoreTz){
  if(ignoreTz) return true;
  const d = clientNow(tzHours);
  const h = d.getHours();
  return h >= 8 && h < 21;
}

const CALL_TIME_SLOTS = (()=>{
  const out = [];
  for(let h=8; h<=21; h++){
    out.push(String(h).padStart(2,'0')+':00');
    if(h!==21) out.push(String(h).padStart(2,'0')+':30');
  }
  return out;
})();
function callReasonLabel(id){ return (CALLS?.reasons||[]).includes(id)?id:''; }
function callResultLabel(id){ return (CALLS?.results||[]).includes(id)?id:''; }

/* Сортировка элементов:
   Актуальные = не заархивированные. Сначала сегодня просроченные (end<now), потом сегодня активные (в окне),
   потом сегодня будущие, потом будущие по дате. Просроченные со вчера — в самый верх по убыванию давности? Нет:
   «первым должен быть тот который был раньше (дальше от текущего времени)» — т.о. самые давние просроченные выше.
*/
/* Минуты от полуночи по фактическому времени следующего перезвона (nextTime),
   иначе по окну С-ДО (timeFrom/timeTo). Без всего — большой (в конец). */
function callDayMinutes(c){
  if(c.nextTime){
    const n = parseTime(c.nextTime);
    if(n) return n.h*60+n.m;
  }
  const f = parseTime(c.timeFrom);
  if(f) return f.h*60+f.m;
  const t = parseTime(c.timeTo);
  if(t) return t.h*60+t.m;
  return 24*60+1;
}
function sortedCalls(list){
  const order = {overdue:0, today:1, upcoming:2, archived:3};
  return [...list].sort((a,b)=>{
    const oa = order[callStatus(a)] ?? 1;
    const ob = order[callStatus(b)] ?? 1;
    if(oa !== ob) return oa-ob; // просроч → сегодня → будущие → архив
    if(oa===3){
      // внутри архива — самые свежие по последнему history выше
      const la = a.history.length?a.history[a.history.length-1].ts:a.created;
      const lb = b.history.length?b.history[b.history.length-1].ts:b.created;
      return lb-la;
    }
    // Внутри группы — сортировка по времени звонка (времени дня), а не по дате.
    // Вчерашний на 20:30 и сегодняшний на 12:30 → 12:30 раньше (по времени дня).
    const sa = callDayMinutes(a);
    const sb = callDayMinutes(b);
    if(sa !== sb) return sa-sb;
    // при равенстве времени — раньше тот, у кого дата раньше
    const da = callStartDateTime(a)?.getTime() ?? 0;
    const db = callStartDateTime(b)?.getTime() ?? 0;
    return da-db;
  });
}

/* Совпадает ли перезвон с поисковым запросом (номер, имя, комментарий, причина). */
function callMatchesSearch(c, q){
  if(!q) return true;
  const s = q.toLowerCase();
  const hay = [
    c.phone, c.parent, c.notes, c.reason,
    (c.links||[]).map(l=>l.label+' '+(l.url||'')).join(' '),
    (c.history||[]).map(h=>h.result+' '+(h.reason||'')).join(' ')
  ].join(' ').toLowerCase();
  return hay.indexOf(s) !== -1;
}
function callsFilterList(items){
  const filter = CALLS_FILTER;
  const q = (CALLS_SEARCH||'').trim().toLowerCase();
  return items.filter(c=>{
    // поиск по номеру/имени/словам
    if(q && !callMatchesSearch(c, q)) return false;
    // если включено «игнорировать фильтры» — пропускаем фильтрацию по тегу/архиву
    if(CALLS_SEARCH_IGNORE && q) return true;
    const tg = callTags(c);
    if(filter==='all') return !c.archived;
    if(filter==='archived') return c.archived;
    // active = не в архиве и НЕ будущий (время «с» не наступило или дата в будущем)
    if(filter==='active') return !c.archived && !tg.includes('upcoming');
    return tg.includes(filter);                        // today / upcoming / overdue по тегу
  });
}

let _callsNewFormVisible = false;
let LAST_COPIED_CALL_ID = null; // id карточки, из которой последним скопирован номер

/* Счётчик актуальных задач на кнопке вкладки «Перезвоны».
   Актуальные = не в архиве и дата не в будущем (сегодня/вчера/без даты) —
   т.е. есть что делать, даже если время «с» ещё не наступило. */
function updateCallsBadge(){
  const badge = document.getElementById('callsBadge');
  if(!badge) return;
  // Актуальные = не в архиве и активны сегодня (тег today),
  // т.е. не будущие (upcoming) и не просроченные-в-архиве.
  const n = (CALLS.items||[]).filter(c=>{
    if(c.archived) return false;
    const tg = callTags(c);
    // актуально, если есть тег today и нет тега upcoming
    return tg.includes('today') && !tg.includes('upcoming');
  }).length;
  if(n>0){ badge.style.display='inline-block'; badge.textContent = n>99 ? '99+' : n; }
  else badge.style.display='none';
}
function renderCalls(){
  ensureCallsShape();
  updateCallsBadge();
  const root = document.getElementById('callsList');
  const statsEl = document.getElementById('callsStats');
  const list = callsFilterList(CALLS.items);
  const sorted = sortedCalls(list);

  const overdue = CALLS.items.filter(c=>!c.archived && callTags(c).includes('overdue')).length;
  const todayCt = CALLS.items.filter(c=>!c.archived && callTags(c).includes('today')).length;
  const upcoming = CALLS.items.filter(c=>!c.archived && callTags(c).includes('upcoming')).length;
  statsEl.textContent = `просрочено: ${overdue} · сегодня: ${todayCt} · будущих: ${upcoming} · архив: ${CALLS.items.filter(c=>c.archived).length}`;

  root.innerHTML = '';

  // Форма нового перезвона (если открыта)
  if(_callsNewFormVisible){
    root.appendChild(buildCallForm(null));
  }

  if(!sorted.length){
    const empty = document.createElement('div');
    empty.className='empty';
    empty.style.padding='24px';
    empty.textContent = CALLS_FILTER==='archived'
      ? 'Архив пуст.'
      : (overdue+todayCt+upcoming===0 ? 'Перезвонов нет. Нажмите «➕ Новый перезвон», чтобы добавить.' : 'По этому фильтру ничего нет.');
    root.appendChild(empty);
    return;
  }

  sorted.forEach(c=>{
    if(c._editOpen) root.appendChild(buildCallForm(c));
    else root.appendChild(buildCallCard(c));
  });
}

/* Дата в формате YYYY-MM-DD по часовому поясу клиента из таймстемпа ts. */
function clientDateStrFromTs(ts, tz){
  tz = (typeof tz==='number') ? tz : DEFAULT_TZ_UTC;
  const d = new Date(ts);
  // Сдвигаем на таймзону клиента: локальная дата = UTC + tz часов
  const shifted = new Date(d.getTime() + tz*3600*1000 - d.getTimezoneOffset()*60000);
  return fmtDate(shifted);
}
/* Подсчёт количества совершённых звонков (не переносов) на указанную дату YYYY-MM-DD
   ПО ЧАСОВОМУ ПОЯСУ КЛИЕНТА, а не по локальному времени компьютера. */
function countCallsOnDateTz(c, dateStr, tz){
  tz = (typeof tz==='number') ? tz : ((typeof c.tz==='number')?c.tz:DEFAULT_TZ_UTC);
  return (c.history||[]).filter(h=>{
    if(!h.ts) return false;
    if(h.result==='Перенос') return false;
    return clientDateStrFromTs(h.ts, tz)===dateStr;
  }).length;
}
function countCallsOnDate(c, dateStr){
  return countCallsOnDateTz(c, dateStr, c.tz);
}
/* Рассчитать следующий слот перезвона при НО/АО/Сброс:
   - сдвиг на +3 часа, шаг 30 минут (00/30);
   - окно звонка [timeFrom .. timeTo) задаётся в МСК (время оператора). По умолчанию 08:00–21:00.
   - дата слота — МСК-дата (когда оператор звонит);
   - лимит «не более 3 попыток в МСК-день» (maxPerDay);
   - ПОВЕРХ окна действует правило «не звонить после 21:00 по местному времени клиента»
     (и не раньше 08:00): кандидат-слот допустим, только если по времени клиента (МСК+сдвиг) час в [8..21).
     Галочка ignoreTz = «клиент разрешил звонить в любое время» — отключает это ограничение.
   - максимум 60 дней вперёд, дальше — фоллбэк на завтра в начало окна.
*/
/* Минуты дня из строки времени 'HH:MM' или null. */
function hmToMin(hhmm){
  const p = parseTime(hhmm);
  return p ? (p.h*60+p.m) : null;
}
/* Время последнего совершённого звонка (последняя запись истории, не «Перенос»)
   в минутах от полуночи МСК. Если истории нет — текущее время МСК. */
function lastCallMinutes(c, now){
  const hist = (c.history||[]).filter(h=>h && h.ts && h.result && h.result!=='Перенос');
  if(hist.length){
    // время последнего звонка — из ts записи (момент нажатия НО/АО/Сброс),
    // время дня берём как есть (это время МСК, в котором работает оператор)
    const last = hist[hist.length-1];
    const t = new Date(last.ts);
    return t.getHours()*60 + t.getMinutes();
  }
  return now.getHours()*60 + now.getMinutes();
}
/* Рассчитать фактическое время следующего перезвона при НО/АО/Сброс:
   - сдвиг +offsetHours (по умолчанию 3ч) ОТ времени последнего звонка (из истории),
     округление вниз до 00/30: звонок в 16:31 → 19:30;
   - если истории нет — от текущего момента;
   - окно С-ДО (timeFrom/timeTo) — информационное, используется как РАМКИ отображения:
     если кандидат выходит за рамки окна или за текущий день — переносим на следующий
     день на время «с» карточки (или на кандидата, если «с» нет);
   - не более maxPerDay попыток в МСК-день.
*/
function calcNextSlot(c, offsetHours){
  offsetHours = offsetHours||3;
  const maxPerDay = 3;
  const tz = (typeof c.tz==='number') ? c.tz : DEFAULT_TZ_UTC;
  const shift = tz - DEFAULT_TZ_UTC;
  const ignoreTz = !!c.ignoreTz;
  const pad = n=>String(n).padStart(2,'0');

  const mskNow = clientNow(DEFAULT_TZ_UTC); // текущее время в МСК
  const nowM = mskNow.getHours()*60 + mskNow.getMinutes();
  // база = время последнего звонка из истории (или сейчас)
  const baseM = lastCallMinutes(c, mskNow);
  // кандидат = база + offset, округление к БЛИЖАЙШЕМУ 00/30
  const candM = Math.round((baseM + offsetHours*60) / 30) * 30;

  // допустимо ли время (не после 21 / не раньше 8 по местному клиента)
  const okTime = m=>{
    if(ignoreTz) return true;
    const hh = Math.floor(m/60) + shift;
    const localH = ((hh % 24) + 24) % 24;
    return localH >= 8 && localH < 21;
  };
  // рамки окна С-ДО (информационные)
  const fromM = hmToMin(c.timeFrom); // может быть null
  const toM   = hmToMin(c.timeTo);
  const inWindow = m => {
    if(fromM!==null && m < fromM) return false;
    if(toM!==null && m > toM) return false;
    return true;
  };
  const countMskDay = (dateStr)=> (c.history||[]).filter(h=>{
    if(!h.ts) return false;
    if(h.result==='Перенос') return false;
    return clientDateStrFromTs(h.ts, DEFAULT_TZ_UTC)===dateStr;
  }).length;

  const todayStr = fmtDate(mskNow);
  // попытка в текущий день: кандидат сегодня, в БУДУЩЕМ относительно текущего времени,
  // в окне и допустим.
  if(countMskDay(todayStr) < maxPerDay && candM < 24*60 && candM > nowM && inWindow(candM) && okTime(candM)){
    return { date: todayStr, time: pad(Math.floor(candM/60))+':'+pad(candM%60) };
  }

  // иначе — следующие дни на время «с» карточки (или кандидата, если «с» нет)
  for(let dayOffset=1; dayOffset<60; dayOffset++){
    const base = new Date(mskNow.getFullYear(), mskNow.getMonth(), mskNow.getDate()+dayOffset);
    const dateStr = fmtDate(base);
    if(countMskDay(dateStr) >= maxPerDay) continue;
    let m = (fromM!==null) ? fromM : candM;
    if(m >= 24*60) m = (fromM!==null) ? fromM : 8*60;
    if(!inWindow(m) || !okTime(m)) continue;
    return { date: dateStr, time: pad(Math.floor(m/60))+':'+pad(m%60) };
  }
  // фоллбэк
  const d = new Date(mskNow.getFullYear(), mskNow.getMonth(), mskNow.getDate()+1);
  const fm = (fromM!==null) ? fromM : 8*60;
  return { date: fmtDate(d), time: pad(Math.floor(fm/60))+':'+pad(fm%60) };
}
/* Автосдвиг при НО/АО/Сброс: +3 часа (с учётом лимитов). */
function autoReschedule(c, resultLabel){
  const slot = calcNextSlot(c, 2.5);
  const entry = {
    ts: Date.now(),
    result: resultLabel,
    newDate: slot.date, newFrom: slot.time, newTo: c.timeTo || '21:00',
    auto: true
  };
  c.history.push(entry);
  // Фактическое время следующего перезвона — скрытый параметр (nextDate/nextTime).
  // С/ДО (timeFrom/timeTo) остаются информационными и НЕ меняются.
  c.nextDate = slot.date;
  c.nextTime = slot.time;
  c.date = slot.date; // дата следующего звонка
  // timeFrom/timeTo не трогаем — они информационные рамки
}

function buildCallCard(c){
  const card = document.createElement('div');

  card.dataset.callId = c.id;

  function actBtn(label, cls, title, handler){
    const b=document.createElement('button'); b.type='button'; b.className='btn-small '+(cls||''); b.textContent=label;
    if(title) b.title=title;
    b.onclick=(e)=>{e.stopPropagation(); handler&&handler();};
    return b;
  }

  /* === Строка 1: когда | имя+телефон / комментарий | действия === */
  const main = document.createElement('div'); main.className='call-main';

  // === Блок 1: время и счётчики ===
  const when = document.createElement('div'); when.className='tile-when';

  const timeSpan = document.createElement('span'); timeSpan.className='big-time';

  timeSpan.textContent = timeLabel;
  twMain.appendChild(timeSpan);
  if(tzShift !== 0){
    const shiftSpan = document.createElement('span'); shiftSpan.className='big-shift';
    shiftSpan.textContent = (tzShift>0?'+':'')+tzShift;
    shiftSpan.title = 'Сдвиг от МСК: '+(tzShift>0?'+':'')+tzShift+' ч';
    twMain.appendChild(shiftSpan);
  }
  when.appendChild(twMain);
  // следующий + локальное время клиента
  const twSub = document.createElement('div'); twSub.className='tw-sub';
  if(c.nextTime){
    const nx = document.createElement('span'); nx.className='next-time';
    nx.textContent = 'след: '+c.nextTime;
    nx.title = 'Время следующего перезвона ('+(c.nextDate||'')+')';
    twSub.appendChild(nx);
  }
  const nowSpan = document.createElement('span'); nowSpan.className='big-local';
  nowSpan.textContent = 'сейчас '+clientTimeStr(c.tz);
  nowSpan.title = 'Сейчас у клиента';
  twSub.appendChild(nowSpan);
  when.appendChild(twSub);
  // дата + создан
  const twDate = document.createElement('div'); twDate.className='tw-date';
  const date = document.createElement('span'); date.className='date';
  const d = parseDate(c.date);
  let dateLabel = c.date||'';
  if(d){
    const now=new Date(); const td=new Date(now); td.setHours(0,0,0,0);
    const diff=Math.round((d-td)/86400000);
    const weekday=['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
    if(diff===0) dateLabel='сегодня';
    else if(diff===1) dateLabel='завтра';
    else if(diff===-1) dateLabel='вчера';
    else dateLabel=d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'})+', '+weekday;
  }
  date.textContent = dateLabel;
  twDate.appendChild(date);
  if(c.created){
    const created = document.createElement('span'); created.className='created';
    created.textContent = 'создан '+new Date(c.created).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    created.title='Время создания перезвона';
    twDate.appendChild(created);
  }
  when.appendChild(twDate);
  // история попыток — точки
  const attempts=(c.history||[]).filter(h=>h.result && h.result!=='Перенос');
  if(attempts.length){
    const hist=document.createElement('div'); hist.className='tw-hist';
    const lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent='ист. '+attempts.length+':';
    hist.appendChild(lbl);
    attempts.slice(-6).forEach(h=>{
      const dot=document.createElement('span'); dot.className='dot';
      const r=(h.result||'').toLowerCase();
      if(/договор|успеш|ok|готов/.test(r)) dot.classList.add('done');
      else if(/автоответ|ао/.test(r)) dot.classList.add('ao');
      else if(/сброс|занят/.test(r)) dot.classList.add('sb');
      else if(/перезво|callback/.test(r)) dot.classList.add('cb');
      else dot.classList.add('no');
      dot.title=h.result+' · '+(new Date(h.ts)).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      hist.appendChild(dot);
    });
    when.appendChild(hist);
  }
  main.appendChild(when);

  // --- информация: строка 1 = имя + телефон; строка 2 = комментарий (полный) ---
  const info = document.createElement('div'); info.className='tile-info';
  const infoTop = document.createElement('div'); infoTop.className='ti-top';
  const name = document.createElement('span'); name.className='name';

  infoTop.appendChild(name);
  if(c.reason){
    const rt=document.createElement('span'); rt.className='reason-tag'; rt.textContent=c.reason;
    infoTop.appendChild(rt);

    :(()=>{const a=(c.links||[]).find(l=>l.label&&l.label.indexOf('Админка')===0);return (a&&a.url&&String(a.url).trim())?String(a.url).trim():'';})();
  // Номер: 1) поле phone, 2) из ссылки «Звонок» (called=), 3) из комментария (маски +79/79/89)
  const phoneDisplay = (c.phone && String(c.phone).trim())

    const ph=document.createElement('span'); ph.className='phone';

        if(prev) prev.classList.remove('copied-num');

      LAST_COPIED_CALL_ID = c.id;
      const d = card.querySelector('.call-detail');
      if(d && !d.classList.contains('open')) d.classList.add('open');
    };
    ph.appendChild(num);
    infoTop.appendChild(ph);
  }
  info.appendChild(infoTop);
  // комментарий — второй строкой, ПОЛНЫЙ текст без обрезки

    const cmt=document.createElement('div'); cmt.className='comment'; cmt.textContent=comment;
    info.appendChild(cmt);

  // --- Блок 1: управление карточкой ---
  const ctrl = document.createElement('div'); ctrl.className='cb-block cb-ctrl';
  if(!c.archived){
    ctrl.appendChild(actBtn('✓','ok','Дозвонился — указать результат',()=>{ openCallResultModal(c); }));
    ctrl.appendChild(actBtn('×','danger','Удалить',()=>{ if(confirm('Удалить перезвон?')){ CALLS.items=CALLS.items.filter(x=>x.id!==c.id); callsMarkDirty(); renderCalls(); } }));
    ctrl.appendChild(actBtn('✎','','Редактировать карточку',editHandler));
  } else {
    ctrl.appendChild(actBtn('↶','','Вернуть из архива',()=>{ c.archived=false; callsMarkDirty(); renderCalls(); }));
    ctrl.appendChild(actBtn('🗑','danger','Удалить навсегда',()=>{ if(confirm('Удалить безвозвратно?')){ CALLS.items=CALLS.items.filter(x=>x.id!==c.id); callsMarkDirty(); renderCalls(); } }));
    ctrl.appendChild(actBtn('✎','','Редактировать карточку',editHandler));

  if(!c.archived){
    resBlock.appendChild(actBtn('АО/НО','ao','Нет ответа / автоответчик / сброс (перенос на +2.5ч, авт.)',()=>{ autoReschedule(c,'АО/НО'); c.archived=false; callsMarkDirty(); renderCalls(); }));

    resBlock.appendChild(rf);
  }

  setTimeout(autoGrow,0);
  const ok=document.createElement('button'); ok.type='button'; ok.className='btn-small primary'; ok.textContent='Ок';
  const cn=document.createElement('button'); cn.type='button'; cn.className='btn-small'; cn.textContent='×';
  cn.onclick=(e)=>{e.stopPropagation();inlineForm.classList.remove('open');};
  ok.onclick=(e)=>{
    e.stopPropagation();
    if(!dateIn.value){alert('Укажите дату');return;}
    c.history.push({
      ts:Date.now(), result:'Перезвонить',
      newDate:dateIn.value, newFrom:timeIn.value, newTo:c.timeTo||'21:00', reason:reasonIn.value.trim()
    });
    // Фактическое время следующего перезвона — в nextDate/nextTime.
    // Окно С-ДО (timeFrom/timeTo) остаётся информационным и НЕ меняется.
    c.nextDate = dateIn.value;
    c.nextTime = timeIn.value;
    c.date = dateIn.value;
    c.archived=false;
    inlineForm.classList.remove('open');
    callsMarkDirty(); renderCalls();
  };
  inlineForm.appendChild(dateL);
  inlineForm.appendChild(timeL);
  inlineForm.appendChild(reasonIn);
  inlineForm.appendChild(ok); inlineForm.appendChild(cn);
  card.appendChild(inlineForm);

  /* === Детали (раскрываются кликом по карточке) — только история звонков === */
  const detail = document.createElement('div'); detail.className='call-detail';
  if(c.history && c.history.length){
    const hdr = document.createElement('div'); hdr.style.color='#a8b8d8'; hdr.style.marginBottom='4px';
    hdr.textContent='История звонков ('+c.history.length+'):';
    detail.appendChild(hdr);
    c.history.slice().reverse().forEach(ev=>{
      const row=document.createElement('div'); row.className='hist-row';
      const t=document.createElement('span'); t.className='t';
      t.textContent=new Date(ev.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const txt=document.createElement('span');
      let s = ev.result||'—';
      if(ev.newDate) s += ' → '+ev.newDate+(ev.newFrom?' '+ev.newFrom:'')+(ev.reason?' ('+ev.reason+')':(ev.auto?' (авто)':''));
      txt.textContent=s;
      row.appendChild(t); row.appendChild(txt);
      detail.appendChild(row);
    });
  }
  if(!detail.children.length){
    const e=document.createElement('div'); e.style.color='var(--muted)'; e.textContent='История пуста';
    detail.appendChild(e);
  }
  card.appendChild(detail);

  // Клик по карточке — развернуть детали. Не раскрываем из интерактивных зон
  // (кнопки, ссылки, форма переноса, номер — чтобы клик/ввод там не раскрывал меню).
  card.addEventListener('click',(e)=>{
    if(e.target.closest && e.target.closest('.cb-block,.reschedule-inline,.phone-num,a')) return;
    detail.classList.toggle('open');
  });

  return card;
}

function styleInlineField(inp){
  inp.style.fontSize='13px';inp.style.padding='6px 8px';inp.style.background='#0c0f15';
  inp.style.border='1px solid var(--line)';inp.style.color='#f0f4fb';inp.style.borderRadius='4px';
  inp.style.textTransform='none';inp.style.letterSpacing='0';

function mkField(label, type, value, placeholder){
  const labelWrap = document.createElement('label');
  const k = document.createElement('span'); k.textContent=label;
  const inp = document.createElement('input'); inp.type=type; inp.value=value||'';
  if(placeholder) inp.placeholder=placeholder;
  styleInlineField(inp);
  labelWrap.appendChild(k); labelWrap.appendChild(inp);
  return { labelWrap, input:inp };
}
function mkSelect(label, options, value){
  const labelWrap = document.createElement('label');
  const k = document.createElement('span'); k.textContent=label;
  const sel = document.createElement('select');
  options.forEach(o=>{
    const op=document.createElement('option'); op.value=o; op.textContent=o||'—';
    if(o===value) op.selected=true;
    sel.appendChild(op);
  });
  styleInlineField(sel);
  labelWrap.appendChild(k); labelWrap.appendChild(sel);
  return { labelWrap, select:sel };
}
/* Селектор времени с шагом 30 мин с 08:00 до 21:00 (не звоним после 21). */
function mkTimeSelect(label, value){
  const opts = [''].concat(CALL_TIME_SLOTS);
  return mkSelect(label, opts, value||'');
}
/* Извлечь номер из ссылки на звонок (CRM). Ссылка вида ...&called=79...&... */
function extractCalledFromUrl(url){
  if(!url) return '';
  try{
    const m = String(url).match(/[?&]called=([^&#\s]+)/);
    if(m && m[1]) return decodeURIComponent(m[1]);
  }catch(e){}
  return '';
}
/* Найти телефон в тексте (комментарии) по маскам +79…, 79…, 89….
   Нормализация: 8 в начале -> 7, символ «+» убирается. */
function extractPhoneFromText(text){
  if(!text) return '';
  const m = String(text).match(/(?<!\d)(?:\+?[78]9\d{9})(?!\d)/);
  if(!m) return '';
  let n = m[0].replace(/\D/g,'');
  if(n.length===11 && n[0]==='8') n = '7'+n.slice(1);
  return n;
}
/* Нормализация массива ссылок: гарантируем «Звонок» первым и «Админка» второй. */
function normalizeCallLinks(c){
  const links = (c?.links||[]).filter(x=>x && (x.url||x.label)).map(x=>({label:x.label||'',url:x.url||''}));
  let callLink = links.find(l=>l.label==='Звонок') || null;
  let admLinks = links.filter(l=>l.label && l.label!=='Звонок' && l.label.indexOf('Админка')===0);
  let otherLinks = links.filter(l=>l.label!=='Звонок' && !(l.label && l.label.indexOf('Админка')===0));
  if(!callLink) callLink = {label:'Звонок', url:''};
  if(admLinks.length===0) admLinks = [{label:'Админка', url:''}];
  // Собираем: Звонок, Админка, Админка2..., прочие
  const out = [callLink, ...admLinks];
  otherLinks.forEach(l=>out.push(l));
  return out;
}

    autoPhone  = pull('phone')||pull('parent_phone')||pull('client_phone')||'';
  }

  const fParent = mkField('Родитель','text', (c?.parent||autoParent)||'');
  const fPhone = mkField('Телефон','text', (c?.phone||autoPhone)||'', '7...');
  // запрет на ввод «+» и лишних символов в номере телефона
  fPhone.input.addEventListener('input', ()=>{
    fPhone.input.value = fPhone.input.value.replace(/[^0-9]/g,'');
  });
  grid3.appendChild(fParent.labelWrap);
  grid3.appendChild(fPhone.labelWrap);
  bWho.appendChild(grid3);
  body.appendChild(bWho);

  // --- Блок: комментарий ---
  const bNotes = mkBlock('Комментарий');
  let defaultNotes = c?.notes || '';
  if(!isEdit && !defaultNotes){
    const pull = varReal;
    const parts = [];
    const child = pull('child_name')||pull('childName')||pull('student_name')||pull('pupil');
    const klass = pull('class')||pull('child_class')||pull('grade');
    const subj  = pull('subject')||pull('lesson_subject');
    if(child) parts.push(child + (klass?', '+klass+' кл.':''));
    if(subj) parts.push(subj);
    defaultNotes = parts.join(' · ');
  }
  const notes = document.createElement('textarea');

  function renderLinks(){
    linksList.innerHTML='';
    existingLinks.forEach((l,idx)=>{
      const row=document.createElement('div'); row.className='link-row';
      const isCall = l.label==='Звонок';
      // Имя ссылки — редактируемое (кроме «Звонок»). Можно задать «для одного ребёнка», «для другого» и т.п.
      const lab = document.createElement('input');
      lab.type='text';
      lab.placeholder = isCall ? 'Звонок' : 'имя (напр. админка ребёнка)';
      lab.value = isCall ? 'Звонок' : (l.label||'');
      if(isCall){ lab.readOnly=true; lab.title='Название «Звонок» фиксировано'; lab.style.opacity=.55; }
      lab.oninput=()=>{ if(!isCall) l.label=lab.value.trim()||'Админка'; };

      u.placeholder = isCall ? 'https://... (ссылка на CRM для результатов звонка)' : 'https://...';
      u.value=l.url||'';
      u.oninput=()=>{l.url=u.value.trim();};
      const del=document.createElement('button');
      del.type='button';del.className='btn-small danger';del.textContent='×';del.title='Удалить';

    });
    const add=document.createElement('button');
    add.type='button';add.className='btn-small';add.textContent='+ админка';
    add.title='Добавить ссылку на админку (можно задать своё имя)';
    add.onclick=()=>{

  save.onclick=()=>{
    const date=fDate.input.value;
    if(!date){alert('Укажите дату');return;}

    const links=existingLinks.map(l=>{
      let url=(l.url||'').trim();
      return {label:l.label,url};

    const payload={
      date, timeFrom:fFrom.select.value||'', timeTo:fTo.select.value||'',
      phone, parent:fParent.input.value.trim(),
      students:'', subject:'', // deprecated
      notes:notes.value, links, reason:'',
      tz: (CALL_TIMEZONES.find(z=>z.label===fTz.select.value)||CALL_TIMEZONES[1]).utc,
      ignoreTz: !!fIgnoreCb.checked
    };
    if(isEdit){

    } else {
      CALLS.items.push(newCall(payload));
      _callsNewFormVisible=false;
    }
    callsMarkDirty(); renderCalls();
  };
  const cancel=document.createElement('button');
  cancel.type='button';cancel.className='btn-small';cancel.textContent='Отмена';
  cancel.onclick=()=>{
    if(isEdit)c._editOpen=false; else _callsNewFormVisible=false;
    renderCalls();
  };
  acts.appendChild(save);acts.appendChild(cancel);
  wrap.appendChild(acts);
  return wrap;
}

function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(
      ()=>showCopyToast('Скопировано: '+text),
      ()=>fallbackCopy(text, ()=>showCopyToast('Скопировано')));
  } else {
    fallbackCopy(text, ()=>showCopyToast('Скопировано'));
  }
}
function callMarkResult(id, result, archive){
  const c = CALLS.items.find(x=>x.id===id); if(!c) return;
  c.history.push({ts:Date.now(), result});
  if(archive) c.archived=true;
  callsMarkDirty(); renderCalls();
}
/* Модальное окно ввода/редактирования результата звонка.
   editing=false: при «Дозвонился» — сохраняет в c.result и архивирует карточку.
   editing=true: только редактирует c.result (без архивации и без записи в историю). */
function openCallResultModal(c, editing){
  if(!c) return;
  const old = document.getElementById('callResultModal');
  if(old) old.remove();

  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.id='callResultModal';
  const box = document.createElement('div'); box.className='modal-box';
  const title = document.createElement('h3');
  title.textContent = editing ? 'Редактировать результат звонка' : 'Дозвонились — результат звонка';
  box.appendChild(title);
  const hint = document.createElement('div'); hint.className='modal-hint';
  hint.textContent = editing ? 'Изменение сохранится в поле «Результат» на карточке.'
                              : 'Введите результат (увидят на карточке). Карточка уйдёт в архив.';
  box.appendChild(hint);
  const ta = document.createElement('textarea'); ta.placeholder='например: договорились на 15:00, записали на курс…';
  ta.value = c.result || '';
  ta.autofocus = true;
  box.appendChild(ta);
  const acts = document.createElement('div'); acts.className='modal-actions';
  const ok = document.createElement('button'); ok.type='button'; ok.className='btn-small primary'; ok.textContent='✓ Сохранить';
  ok.onclick = ()=>{
    c.result = ta.value.trim();
    if(!editing){
      c.history.push({ts:Date.now(), result:'Дозвонился'+(ta.value.trim()?(' — '+ta.value.trim()):'')});
      c.archived = true;
    }
    callsMarkDirty(); renderCalls();
    overlay.remove();
  };
  const cn = document.createElement('button'); cn.type='button'; cn.className='btn-small'; cn.textContent='Отмена';
  cn.onclick = ()=>{ overlay.remove(); };
  acts.appendChild(ok); acts.appendChild(cn);
  box.appendChild(acts);
  overlay.appendChild(box);
  // закрытие по Esc
  overlay.addEventListener('keydown', e=>{ if(e.key==='Escape') overlay.remove(); });
  document.body.appendChild(overlay);
  setTimeout(()=>ta.focus(), 50);
}

    const seen = localStorage.getItem('rm_changelog_seen') || '';
